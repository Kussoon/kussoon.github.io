<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Kussoon｜一筆書きコースター 3D比較試作</title><style>
*{box-sizing:border-box}body{margin:0;background:#102438;color:white;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN",sans-serif}main{height:100dvh;display:flex;flex-direction:column}header{padding:10px 12px;background:#102438;display:flex;align-items:center;justify-content:space-between;gap:10px}h1{margin:0;font-size:17px}.status{font-size:12px;color:#77ebc1}#stage{position:relative;min-height:0;flex:1}canvas{display:block;width:100%;height:100%;touch-action:none;background:#c8e5f5}.hint{position:absolute;top:12px;left:12px;border-radius:9px;padding:8px 11px;background:#102438d0;font-size:13px;pointer-events:none}.hint[hidden]{display:none}nav{display:flex;gap:8px;padding:10px 10px calc(10px + env(safe-area-inset-bottom));background:#102438}button{border:0;border-radius:9px;min-height:48px;padding:11px;font-weight:700;font-size:15px;background:#e9f0f4;color:#102438}#go{flex:1;background:#5ce2b7}button:disabled{opacity:.45}button[hidden]{display:none}footer{background:#102438;text-align:center;color:#b4c9dc;font-size:10px;padding-bottom:4px}
</style></head><body><main><header><h1>🎢 一筆書きコースター <small style="font-size:11px">3D比較試作</small></h1><span class="status" id="status">指で線を描いてください</span></header><section id="stage"><canvas id="canvas" aria-label="指で一筆書きする描画エリア"></canvas><div id="hint" class="hint">指でなぞってコースを描いてください</div></section><nav><button id="reset">描き直す</button><button id="go" disabled>▶ コースに乗る</button><button id="pause" hidden>一時停止</button></nav><footer>広告・外部ライブラリなし｜試作：3D空間のレール・景色・バンクを統一</footer></main><script>
(()=>{
"use strict";
const C=document.getElementById("canvas"),ctx=C.getContext("2d",{alpha:false}),go=document.getElementById("go"),pause=document.getElementById("pause"),reset=document.getElementById("reset"),hint=document.getElementById("hint"),status=document.getElementById("status");
const clamp=(n,a,b)=>Math.max(a,Math.min(b,n)),mix=(a,b,t)=>a+(b-a)*t,V=(x=0,y=0,z=0)=>({x,y,z}),add=(a,b)=>V(a.x+b.x,a.y+b.y,a.z+b.z),sub=(a,b)=>V(a.x-b.x,a.y-b.y,a.z-b.z),scale=(a,k)=>V(a.x*k,a.y*k,a.z*k),dot=(a,b)=>a.x*b.x+a.y*b.y+a.z*b.z,cross=(a,b)=>V(a.y*b.z-a.z*b.y,a.z*b.x-a.x*b.z,a.x*b.y-a.y*b.x),norm=a=>scale(a,1/(Math.hypot(a.x,a.y,a.z)||1));
let W=1,H=1,D=1,raw=[],drawing=false,mode="edit",length=0,track=[],finish=0,ridePos=0,speed=9,paused=false,last=0,ground=[],objects=[],camera=null;
function size(){const r=C.getBoundingClientRect();W=Math.max(1,r.width);H=Math.max(1,r.height);D=Math.min(2,devicePixelRatio||1);C.width=Math.round(W*D);C.height=Math.round(H*D);ctx.setTransform(D,0,0,D,0,0);if(mode==="edit")editor()}
addEventListener("resize",size);
function screenPoint(x,y){const b=C.getBoundingClientRect();return{x:clamp(x-b.left,0,W),y:clamp(y-b.top,0,H)}}
function begin(x,y){if(mode!=="edit")return;raw=[screenPoint(x,y)];length=0;drawing=true;hint.hidden=true;go.disabled=true;status.textContent="描画中";editor()}
function move(x,y){if(!drawing)return;const p=screenPoint(x,y),q=raw[raw.length-1],d=Math.hypot(p.x-q.x,p.y-q.y);if(d>2){raw.push(p);length+=d;go.disabled=length<110;editor()}}
function end(){drawing=false;if(mode==="edit")status.textContent=length>=110?"コースができました":"もう少し長く描いてください"}
if(window.PointerEvent){
 C.addEventListener("pointerdown",e=>{e.preventDefault();try{C.setPointerCapture(e.pointerId)}catch(_){}begin(e.clientX,e.clientY)});
 C.addEventListener("pointermove",e=>{if(drawing){e.preventDefault();move(e.clientX,e.clientY)}});
 C.addEventListener("pointerup",end);C.addEventListener("pointercancel",end)
}else{
 C.addEventListener("touchstart",e=>{e.preventDefault();const t=e.changedTouches[0];begin(t.clientX,t.clientY)},{passive:false});
 C.addEventListener("touchmove",e=>{e.preventDefault();const t=e.changedTouches[0];move(t.clientX,t.clientY)},{passive:false});
 C.addEventListener("touchend",end);C.addEventListener("mousedown",e=>begin(e.clientX,e.clientY));addEventListener("mousemove",e=>move(e.clientX,e.clientY));addEventListener("mouseup",end)
}
function editor(){
 ctx.fillStyle="#d7eff9";ctx.fillRect(0,0,W,H);ctx.strokeStyle="#b9dce9";ctx.lineWidth=1;
 for(let x=0;x<W;x+=36){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke()}
 for(let y=0;y<H;y+=36){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke()}
 if(!raw.length)return;
 ctx.lineCap="round";ctx.lineJoin="round";ctx.beginPath();raw.forEach((p,i)=>i?ctx.lineTo(p.x,p.y):ctx.moveTo(p.x,p.y));ctx.lineWidth=13;ctx.strokeStyle="#26485d";ctx.stroke();ctx.lineWidth=7;ctx.strokeStyle="#ed7453";ctx.stroke();
 for(const [p,color] of [[raw[0],"#19a88a"],[raw[raw.length-1],"#d45f4f"]]){ctx.beginPath();ctx.arc(p.x,p.y,7,0,Math.PI*2);ctx.fillStyle=color;ctx.fill()}
}
const cat=(a,b,c,d,t)=>.5*(2*b+(-a+c)*t+(2*a-5*b+4*c-d)*t*t+(-a+3*b-3*c+d)*t*t*t);
function makeTrack(){
 const smoothed=raw.map((p,i)=>{
  let sx=0,sy=0,sw=0;for(let j=Math.max(0,i-7);j<=Math.min(raw.length-1,i+7);j++){const w=8-Math.abs(j-i);sx+=raw[j].x*w;sy+=raw[j].y*w;sw+=w}return{x:sx/sw,y:sy/sw}
 });smoothed[0]=raw[0];smoothed[smoothed.length-1]=raw[raw.length-1];
 const pts=[];
 for(let i=0;i<smoothed.length-1;i++){
  const a=smoothed[Math.max(0,i-1)],b=smoothed[i],c=smoothed[i+1],d=smoothed[Math.min(i+2,smoothed.length-1)];
  const n=Math.max(2,Math.ceil(Math.hypot(c.x-b.x,c.y-b.y)/3));
  for(let j=0;j<n;j++){let t=j/n;pts.push({x:cat(a.x,b.x,c.x,d.x,t),y:cat(a.y,b.y,c.y,d.y,t)})}
 }pts.push(smoothed[smoothed.length-1]);
 track=[];finish=0;
 for(let i=0;i<pts.length;i++){
  if(i)finish+=Math.max(.02,Math.hypot(pts[i].x-pts[i-1].x,pts[i].y-pts[i-1].y)*.12);
  track.push({x:(pts[i].x-W*.5)*.08,y:3+(H-pts[i].y)*.095,z:finish})
 }
 // Ground and nearby scenery share the same 3D world.
 objects=[];const kinds=["forest","city","coast","castle","desert","tower"];
 const section=Math.max(22,finish/6);
 for(let z=8,i=0;z<finish+18;z+=7,i++){
  const p=sample(Math.min(finish,z)),kind=kinds[Math.min(5,Math.floor(z/section))];
  for(let side of [-1,1]){
   const x=p.x+side*(6+(i%3)*2);
   if(kind==="coast"&&side<0)continue;
   if(kind==="desert"&&i%2)continue;
   objects.push({x,z,kind:kind==="castle"&&i%4?"forest":kind==="tower"&&i%5?"city":kind,seed:i+Math.max(0,side)})
  }
 }
}
function sample(z){
 z=clamp(z,0,finish);let lo=0,hi=track.length-1;
 while(lo+1<hi){let m=(lo+hi)>>1;if(track[m].z<z)lo=m;else hi=m}
 const a=track[lo],b=track[hi],t=clamp((z-a.z)/(b.z-a.z||1),0,1);
 return V(mix(a.x,b.x,t),mix(a.y,b.y,t),z)
}
function geometry(z){
 const p=sample(z),before=sample(Math.max(0,z-3.2)),after=sample(Math.min(finish,z+3.2));
 const dir=norm(sub(after,before)),right=norm(V(dir.z,0,-dir.x));
 const far=sample(Math.min(finish,z+5)),near=sample(Math.max(0,z-5));
 const bend=(far.x-2*p.x+near.x)/Math.max(1,(far.z-near.z)*.5);
 const bank=clamp(-bend*2,-.43,.43);
 const across=add(scale(right,.63),V(0,bank,0));
 return{p,dir,right,bank,left:sub(p,across),rightRail:add(p,across)}
}
function cam(){
 const geo=geometry(ridePos),behind=sample(Math.max(0,ridePos-4)),ahead=sample(Math.min(finish,ridePos+5));
 const forward=norm(sub(ahead,behind)),right=norm(V(forward.z,0,-forward.x)),up0=norm(cross(forward,right));
 // The camera banks with the rail: scenery and horizon rotate around the rider.
 const roll=clamp(Math.atan2(geo.bank,.63),-.52,.52);
 const rightRolled=add(scale(right,Math.cos(roll)),scale(up0,Math.sin(roll)));
 const up=add(scale(up0,Math.cos(roll)),scale(right,-Math.sin(roll)));
 return{pos:add(geo.p,scale(up,1.12)),forward,right:rightRolled,up,roll}
}
function coords(p,c){let d=sub(p,c.pos);return{x:dot(d,c.right),y:dot(d,c.up),z:dot(d,c.forward)}}
function proj(p,c){const v=coords(p,c);if(v.z<.08)return null;const f=Math.min(W,H)*1.03;return{x:W*.5+v.x*f/v.z,y:H*.54-v.y*f/v.z,z:v.z}}
function segment(a,b,c,color,width=2,alpha=1){
 // Near-plane clipping preserves rails on sharp crests and descents.
 let A=coords(a,c),B=coords(b,c),near=.13;
 if(A.z<near&&B.z<near)return;
 if(A.z<near||B.z<near){const t=(near-A.z)/(B.z-A.z),cut={x:mix(A.x,B.x,t),y:mix(A.y,B.y,t),z:near};if(A.z<near)A=cut;else B=cut}
 const f=Math.min(W,H)*1.03;
 const ax=W*.5+A.x*f/A.z,ay=H*.54-A.y*f/A.z,bx=W*.5+B.x*f/B.z,by=H*.54-B.y*f/B.z;
 ctx.save();ctx.globalAlpha=alpha;ctx.strokeStyle=color;ctx.lineWidth=clamp(width*16/Math.max(.5,Math.min(A.z,B.z)),.6,width*2.6);ctx.lineCap="round";ctx.beginPath();ctx.moveTo(ax,ay);ctx.lineTo(bx,by);ctx.stroke();ctx.restore();
}
function poly(pts,c,fill,alpha=1){
 const p=pts.map(x=>proj(x,c));if(p.some(x=>!x))return;
 ctx.save();ctx.globalAlpha=alpha;ctx.fillStyle=fill;ctx.beginPath();p.forEach((x,i)=>i?ctx.lineTo(x.x,x.y):ctx.moveTo(x.x,x.y));ctx.closePath();ctx.fill();ctx.restore();
}
function box(pos,w,h,d,c,color){
 const x=pos.x,y=pos.y,z=pos.z;
 const A=V(x-w/2,y,z-d/2),B=V(x+w/2,y,z-d/2),C=V(x+w/2,y,z+d/2),D=V(x-w/2,y,z+d/2);
 const E=add(A,V(0,h,0)),F=add(B,V(0,h,0)),G=add(C,V(0,h,0)),I=add(D,V(0,h,0));
 poly([A,B,F,E],c,color);poly([B,C,G,F],c,"#72889b");poly([E,F,G,I],c,"#d7e1e4")
}
function landscape(c){
 // Horizon is rendered in camera orientation; the world rotates naturally with bank/pitch.
 const sky=ctx.createLinearGradient(0,0,0,H);sky.addColorStop(0,"#69b9e9");sky.addColorStop(1,"#d2f4ff");ctx.fillStyle=sky;ctx.fillRect(0,0,W,H);
 // Terrain grid is fixed in world coordinates at y=0, preventing floating objects.
 const p=sample(ridePos),centerX=p.x;
 for(let z=Math.ceil((ridePos+110)/9)*9;z>=Math.floor((ridePos-15)/9)*9;z-=9){
  for(let x=Math.floor((centerX-65)/9)*9;x<centerX+65;x+=9){
   const coastal=(z>finish*.30&&z<finish*.5&&x<centerX-5),desert=z>finish*.65&&z<finish*.82;
   const tile=coastal?"#4cacc6":desert?"#dab977":((Math.floor(x/9)+Math.floor(z/9))%2?"#79b886":"#87c893");
   poly([V(x,0,z),V(x+9,0,z),V(x+9,0,z+9),V(x,0,z+9)],c,tile);
  }
 }
 for(let i=objects.length-1;i>=0;i--){
  const o=objects[i];if(o.z<ridePos-6||o.z>ridePos+110)continue;
  const foot=V(o.x,0,o.z),top=V(o.x,5,o.z),p=proj(foot,c),q=proj(top,c);if(!p||!q)continue;
  const r=clamp(Math.abs(p.y-q.y)/5,1,48);
  if(o.kind==="forest"){
   segment(foot,add(foot,V(0,4,0)),c,"#71513a",.9);
   const center=proj(add(foot,V(0,4.6,0)),c);if(!center)continue;
   ctx.fillStyle=["#367f59","#469163","#28744d"][o.seed%3];
   for(let j=-1;j<=1;j++){ctx.beginPath();ctx.ellipse(center.x+j*r*.8,center.y,r*1.3,r*1.5,0,0,Math.PI*2);ctx.fill()}
  }else if(o.kind==="city"){
   for(let j=-1;j<=1;j++)box(V(o.x+j*2.4,0,o.z),2.1,3+(j+2+o.seed)%5,2.6,c,"#8fa5b6")
  }else if(o.kind==="castle"){
   box(foot,5,4.5,4,c,"#ebe6d6");box(V(o.x-2.2,0,o.z),1.6,7,1.6,c,"#e5e2d6");box(V(o.x+2.2,0,o.z),1.6,7,1.6,c,"#e5e2d6")
  }else if(o.kind==="tower"){
   segment(foot,add(foot,V(0,12,0)),c,"#59697c",2);box(V(o.x,8,o.z),3,1,3,c,"#cfdadf")
  }else if(o.kind==="desert"){
   box(V(o.x,0,o.z),5,.6,6,c,"#d5ac69");segment(foot,add(foot,V(0,2.8,0)),c,"#4b986c",2.2)
  }
 }
}
function trackDraw(c){
 // Draw distant pieces first, each piece in shared 3D world coordinates.
 const end=Math.min(finish,ridePos+125);
 for(let z=end;z>Math.max(0,ridePos-1.5);z-=.9){
  const a=geometry(Math.max(0,z-.9)),b=geometry(z);
  segment(a.left,b.left,c,"#1d3348",2.6);
  segment(a.rightRail,b.rightRail,c,"#1d3348",2.6);
  segment(add(a.left,V(0,.08,0)),add(b.left,V(0,.08,0)),c,"#e2f5fa",.7);
  segment(add(a.rightRail,V(0,.08,0)),add(b.rightRail,V(0,.08,0)),c,"#e2f5fa",.7);
 }
 for(let z=Math.ceil(ridePos/2.2)*2.2;z<end;z+=2.2){
  const a=geometry(z);
  segment(a.left,a.rightRail,c,"#d66d51",1.4);
 }
 for(let z=Math.ceil(ridePos/8)*8;z<end;z+=8){
  const a=geometry(z);segment(a.p,V(a.p.x,0,a.p.z),c,"#81909b",1.1)
 }
 // Subtle distant track highlight, without unrealistic X-ray rails
 for(let z=Math.min(end,ridePos+75);z>ridePos+15;z-=1.5){
  const a=geometry(z-1.5),b=geometry(z);
  segment(a.left,b.left,c,"#ebfbff",.8,.13);segment(a.rightRail,b.rightRail,c,"#ebfbff",.8,.13)
 }
}
function cockpit(){
 // Always fixed relative to rider: scenery/horizon bank, cabin doesn't drift off screen.
 const u=clamp(Math.min(W/420,H/610),.55,1.45);
 ctx.save();ctx.translate(W/2,H+5);ctx.scale(u,u);
 for(const side of [-1,1]){ctx.save();ctx.scale(side,1);ctx.fillStyle="#304f66";ctx.strokeStyle="#152d40";ctx.lineWidth=5;ctx.beginPath();ctx.moveTo(160,0);ctx.lineTo(170,-140);ctx.lineTo(226,-155);ctx.lineTo(226,0);ctx.fill();ctx.stroke();ctx.restore()}
 const grad=ctx.createLinearGradient(0,-145,0,12);grad.addColorStop(0,"#8ca9bf");grad.addColorStop(1,"#1e3a53");ctx.fillStyle=grad;ctx.strokeStyle="#183146";ctx.lineWidth=5;ctx.beginPath();ctx.moveTo(-160,10);ctx.lineTo(-147,-107);ctx.quadraticCurveTo(0,-157,147,-107);ctx.lineTo(160,10);ctx.fill();ctx.stroke();
 ctx.lineCap="round";ctx.strokeStyle="#cbd5df";ctx.lineWidth=18;ctx.beginPath();ctx.moveTo(-149,-100);ctx.lineTo(149,-100);ctx.stroke();
 ctx.strokeStyle="#263340";ctx.lineWidth=32;ctx.beginPath();ctx.moveTo(-149,-109);ctx.lineTo(149,-109);ctx.stroke();
 ctx.strokeStyle="#555e68";ctx.lineWidth=25;ctx.beginPath();ctx.moveTo(-149,-111);ctx.lineTo(149,-111);ctx.stroke();
 ctx.fillStyle="#b3c4cd";ctx.fillRect(-16,-120,32,70);ctx.strokeStyle="#273e50";ctx.strokeRect(-16,-120,32,70);
 for(const side of [-1,1]){ctx.save();ctx.scale(side,1);
  ctx.strokeStyle="#284c63";ctx.lineWidth=55;ctx.beginPath();ctx.moveTo(148,40);ctx.quadraticCurveTo(115,-15,112,-69);ctx.stroke();
  ctx.fillStyle="#ecc098";ctx.strokeStyle="#ac7d65";ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(95,-75);ctx.quadraticCurveTo(77,-94,82,-123);ctx.quadraticCurveTo(88,-149,117,-141);ctx.quadraticCurveTo(145,-134,140,-110);ctx.lineTo(133,-80);ctx.quadraticCurveTo(123,-60,103,-64);ctx.closePath();ctx.fill();ctx.stroke();
  for(let j=0;j<4;j++){ctx.beginPath();ctx.moveTo(91+j*11,-127);ctx.lineTo(92+j*11,-108);ctx.stroke()}ctx.restore()}
 ctx.restore();
}
function render(){
 camera=cam();landscape(camera);trackDraw(camera);cockpit();
 ctx.fillStyle="#102438db";ctx.fillRect(0,0,W,40);ctx.fillStyle="#fff";ctx.font="bold 14px sans-serif";ctx.textAlign="left";ctx.fillText("走行 "+Math.round(100*ridePos/finish)+"%",12,25);ctx.textAlign="right";ctx.fillText("ゲーム速度 "+Math.round(speed*5)+" km/h",W-12,25);ctx.textAlign="left";
 if(ridePos>=finish){paused=true;status.textContent="ゴール！";hint.hidden=false;hint.textContent="ゴール！ もう一度乗れます";pause.textContent="もう一度乗る"}
}
go.onclick=()=>{if(raw.length<2)return;makeTrack();if(finish<1)return;ridePos=0;speed=9;paused=false;mode="ride";go.hidden=true;pause.hidden=false;pause.textContent="一時停止";hint.hidden=true;status.textContent="乗車中";render()};
pause.onclick=()=>{if(ridePos>=finish){ridePos=0;speed=9;paused=false;hint.hidden=true;status.textContent="乗車中";pause.textContent="一時停止"}else{paused=!paused;pause.textContent=paused?"▶ 再開":"一時停止";status.textContent=paused?"一時停止中":"乗車中"}};
reset.onclick=()=>{raw=[];track=[];objects=[];length=0;drawing=false;mode="edit";go.hidden=false;go.disabled=true;pause.hidden=true;hint.hidden=false;hint.textContent="指でなぞってコースを描いてください";status.textContent="指で線を描いてください";editor()};
function loop(t){const dt=clamp((t-last)/1000||0,0,.05);last=t;if(mode==="ride"){if(!paused){const a=sample(ridePos),b=sample(Math.min(finish,ridePos+1));const grade=(b.y-a.y)/Math.max(.1,b.z-a.z);speed=clamp(speed+((grade<0?-11:-22)*grade-.06*speed+.35)*dt,2.2,34);ridePos=Math.min(finish,ridePos+speed*dt)}render()}requestAnimationFrame(loop)}
size();requestAnimationFrame(loop);
})();
</script></body></html>
