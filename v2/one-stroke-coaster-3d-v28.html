function landscape(c){

 // Unified 3D banked rails and smooth crosspieces (matched to camera banking).

  const a=geometry(Math.max(begin,z-.18)),b=geometry(z);
  for(const side of ["left","rightRail"]){
   segment(a[side],b[side],c,"#1c3041",4.2);
   segment(add(a[side],V(0,.065,0)),add(b[side],V(0,.065,0)),c,"#c3dce6",1.25);
  }
 }
 for(let z=Math.ceil(ridePos/1.05)*1.05;z<end;z+=1.05){
  const a=geometry(z);
  segment(a.left,a.rightRail,c,"#17191b",1.95);
 }
 for(let z=Math.min(end,ridePos+70);z>ridePos+17;z-=1.6){
  const a=geometry(z-1.6),b=geometry(z);
  segment(a.left,b.left,c,"#efffff",.8,.13);segment(a.rightRail,b.rightRail,c,"#efffff",.8,.13);
 }
}
function cockpit(){
 // v28: remove the lower dashboard and side panels. Keep only the slim
 // safety bar and hands close to the screen bottom to expose more scenery.
 const u=clamp(Math.min(W/420,H/610),.55,1.45);
 ctx.save();ctx.translate(W/2,H+5+u*67);ctx.scale(u,u);
 ctx.lineCap="round";
 ctx.strokeStyle="#263340";ctx.lineWidth=31;ctx.beginPath();ctx.moveTo(-149,-109);ctx.lineTo(149,-109);ctx.stroke();
 ctx.strokeStyle="#555e68";ctx.lineWidth=24;ctx.beginPath();ctx.moveTo(-149,-111);ctx.lineTo(149,-111);ctx.stroke();
 for(const side of [-1,1]){ctx.save();ctx.scale(side,1);
  ctx.translate(110,-88);ctx.scale(.5,.5);ctx.translate(-110,88);
  ctx.strokeStyle="#284c63";ctx.lineWidth=48;ctx.beginPath();ctx.moveTo(148,40);ctx.quadraticCurveTo(115,-15,112,-69);ctx.stroke();
  ctx.fillStyle="#ecc098";ctx.strokeStyle="#ac7d65";ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(95,-75);ctx.quadraticCurveTo(77,-94,82,-123);ctx.quadraticCurveTo(88,-149,117,-141);ctx.quadraticCurveTo(145,-134,140,-110);ctx.lineTo(133,-80);ctx.quadraticCurveTo(123,-60,103,-64);ctx.closePath();ctx.fill();ctx.stroke();
  for(let j=0;j<4;j++){ctx.beginPath();ctx.moveTo(91+j*11,-127);ctx.lineTo(92+j*11,-108);ctx.stroke()}ctx.restore()}
 ctx.restore();
}
function courseMiniMap(){
 if(!track.length||finish<=0)return;
 const mw=Math.min(190,Math.max(120,W*.30)),mh=Math.min(128,Math.max(90,H*.31)),x=9,y=47;
 let minZ=Infinity,maxZ=-Infinity,minY=Infinity,maxY=-Infinity;
 for(const p of track){minZ=Math.min(minZ,p.z);maxZ=Math.max(maxZ,p.z);minY=Math.min(minY,p.y);maxY=Math.max(maxY,p.y)}
 const sx=(mw-24)/Math.max(1,maxZ-minZ),sy=(mh-39)/Math.max(1,maxY-minY);
 const xx=p=>x+12+(p.z-minZ)*sx,yy=p=>y+mh-12-(p.y-minY)*sy;
 ctx.save();ctx.fillStyle="rgba(16,36,56,.85)";ctx.fillRect(x,y,mw,mh);
 ctx.strokeStyle="#b4dce8";ctx.lineWidth=1;ctx.strokeRect(x+.5,y+.5,mw-1,mh-1);
 ctx.font="bold 11px sans-serif";ctx.textAlign="left";ctx.fillStyle="#fff";ctx.fillText("コース全体・現在位置",x+8,y+15);
 ctx.beginPath();for(let i=0;i<track.length;i++){const p=track[i];if(!i)ctx.moveTo(xx(p),yy(p));else ctx.lineTo(xx(p),yy(p))}
 ctx.lineWidth=2;ctx.strokeStyle="#70e3e4";ctx.stroke();
 const p=sample(ridePos);ctx.beginPath();ctx.arc(xx(p),yy(p),5,0,Math.PI*2);
 ctx.fillStyle="#ffe36b";ctx.fill();ctx.strokeStyle="#111";ctx.lineWidth=1.4;ctx.stroke();ctx.restore();
}
function overlay(text){
 ctx.save();const fs=Math.round(clamp(Math.min(W,H)*.21,48,105));
 ctx.textAlign="center";ctx.textBaseline="middle";
 ctx.font="900 "+(text.length>3?Math.round(fs*.63):fs)+"px -apple-system,sans-serif";
 ctx.lineWidth=clamp(fs*.13,5,14);ctx.strokeStyle="rgba(16,36,56,.82)";
 ctx.strokeText(text,W/2,H*.43);
 ctx.fillStyle="#fff8b9";ctx.fillText(text,W/2,H*.43);
 ctx.restore();
}
function render(){
 camera=cam();landscape(camera);trackDraw(camera);cockpit();courseMiniMap();
 ctx.fillStyle="#102438db";ctx.fillRect(0,0,W,40);ctx.fillStyle="#fff";ctx.font="bold 14px sans-serif";ctx.textAlign="left";ctx.fillText("走行 "+Math.round(100*ridePos/finish)+"%",12,25);ctx.textAlign="right";ctx.fillText("ゲーム速度（目安） "+Math.round(speed*5)+" km/h",W-12,25);ctx.textAlign="left";
 if(mode==="countdown")overlay(String(Math.max(1,Math.ceil(countdown))));
 else if(startFlash>0)overlay("スタート！");
 if(ridePos>=finish&&mode!=="countdown"){paused=true;status.textContent="ゴール！";hint.hidden=true;pause.textContent="もう一度乗る";overlay("ゴール！")}
}
function updateLoopControls(){
 loopCount.textContent="手描き線を維持";
 loopMinus.disabled=manualLoops===0;
 if(mode==="edit")status.textContent=manualLoops===0?"描いた円を自動認識":"縦ループを"+manualLoops+"回指定";
}
loopPlus.onclick=()=>{if(mode!=="edit")return;manualLoops++;updateLoopControls()};
loopMinus.onclick=()=>{if(mode!=="edit")return;manualLoops=Math.max(0,manualLoops-1);updateLoopControls()};
go.onclick=()=>{if(raw.length<2)return;makeTrack();if(finish<1)return;ridePos=0;speed=0;launchElapsed=0;paused=false;countdown=3;startFlash=0;mode="countdown";go.hidden=true;pause.hidden=true;loopControls.hidden=true;hint.hidden=true;status.textContent=loopWarning;render()};
pause.onclick=()=>{if(ridePos>=finish){ridePos=0;speed=0;launchElapsed=0;paused=false;countdown=3;startFlash=0;mode="countdown";pause.hidden=true;hint.hidden=true;status.textContent="スタート準備中";pause.textContent="一時停止"}else{paused=!paused;pause.textContent=paused?"▶ 再開":"一時停止";status.textContent=paused?"一時停止中":"乗車中"}};
reset.onclick=()=>{raw=[];track=[];objects=[];loopZones=[];countdown=0;startFlash=0;launchElapsed=0;speed=0;length=0;drawing=false;mode="edit";go.hidden=false;go.disabled=true;pause.hidden=true;loopControls.hidden=false;manualLoops=0;updateLoopControls();hint.hidden=false;hint.textContent="指でなぞってコースを描いてください";status.textContent="指で線を描いてください";editor()};
function loop(t){
 const dt=clamp((t-last)/1000||0,0,.05);last=t;
 if(mode==="countdown"){
  countdown=Math.max(0,countdown-dt);
  if(countdown<=0){mode="ride";startFlash=1.05;pause.hidden=false;status.textContent="乗車中・手描きコース";}
  render();
 }else if(mode==="ride"){
  if(!paused){
   if(startFlash>0)startFlash=Math.max(0,startFlash-dt);
   // Launch always starts at zero and linearly reaches displayed 45 km/h
   // after exactly 3 seconds of active riding time, regardless of slope.
   if(launchElapsed<3){
    launchElapsed=Math.min(3,launchElapsed+dt);
    speed=9*(launchElapsed/3);
   }else{
    const a=sample(ridePos),b=sample(Math.min(finish,ridePos+1));
    // The slope uses actual 3D displacement, also inside vertical loops.
    const ds=Math.max(.15,Math.hypot(b.x-a.x,b.y-a.y,b.z-a.z));
    const slope=clamp((b.y-a.y)/ds,-1,1);
    // Prevent an uphill deadlock once launch is complete.
    const minimumRunningSpeed=3; // game display: 15 km/h
    if(slope<0){
     const maxSpeed=18; // 90 km/h game speed limit
     const easing=Math.max(0,1-(speed/maxSpeed)**2);
     speed=clamp(speed+(-22.95*slope)*easing*dt,minimumRunningSpeed,maxSpeed);
    }else if(slope>0){
     speed=clamp(speed-3.5859375*slope*dt,minimumRunningSpeed,18);
    }else{
     speed=clamp(speed,minimumRunningSpeed,18);
    }
   }
   ridePos=Math.min(finish,ridePos+speed*dt);
  }
  render();
 }
 requestAnimationFrame(loop);
}
updateLoopControls();size();requestAnimationFrame(loop);
})();
