 while(lo+1<hi){const mid=(lo+hi)>>1;if(lengths[mid]<target)lo=mid;else hi=mid;}
 const a=raw[lo],b=raw[hi],t=clamp((target-lengths[lo])/(lengths[hi]-lengths[lo]||1),0,1);
 const px=mix(xx(a),xx(b),t),py=mix(yy(a),yy(b),t);
 ctx.beginPath();ctx.arc(px,py,4,0,Math.PI*2);ctx.fillStyle="#ffe36b";ctx.fill();
 ctx.strokeStyle="#111";ctx.lineWidth=1.2;ctx.stroke();ctx.restore();
}
function overlay(text){
 ctx.save();const fs=Math.round(clamp(Math.min(W,H)*.21,48,105));
 ctx.textAlign="center";ctx.textBaseline="middle";
 ctx.font="900 "+(text.length>3?Math.round(fs*.63):fs)+"px -apple-system,sans-serif";
 ctx.lineWidth=clamp(fs*.13,5,14);ctx.strokeStyle="rgba(16,36,56,.82)";
 ctx.strokeText(text,W/2,H*.43);
 ctx.fillStyle="#fff8b9";ctx.fillText(text,W/2,H*.43);
 ctx.restore();
}
// Approximate rider-specific g-load from local 3D track curvature and
// current speed. Values are GAME estimates (not calibrated accelerometers).
// +vertical: seat pressure; -vertical: airtime; horizontal: side load.
// Estimate the direction of the rider's apparent load. This is a GAME
// approximation based on the rendered track and speed, not a measured g-force.
// The proper-acceleration direction is the force from seat to body; the
// sideways felt/inertial load is OPPOSITE the turn's centripetal acceleration.
function estimateRideG(at=ridePos,v=speed){
 if(!track.length||finish<3)return{vertical:1,lateral:0};
 const h=Math.min(1.4,Math.max(.35,finish*.015));
 const before=sample(Math.max(0,at-h)),p=sample(at),after=sample(Math.min(finish,at+h));
 const d0=sub(p,before),d1=sub(after,p);
 const len0=Math.hypot(d0.x,d0.y,d0.z),len1=Math.hypot(d1.x,d1.y,d1.z);
 if(len0<.04||len1<.04)return{vertical:1,lateral:0};
 const t0=norm(d0),t1=norm(d1);
 const curvature=scale(sub(t1,t0),2/Math.max(.1,len0+len1));
 const forward=norm(add(t0,t1));
 let right=norm(sub(V(1,0,0),scale(forward,forward.x)));
 if(Math.hypot(right.x,right.y,right.z)<.01)right=V(0,0,1);
 const up=norm(cross(forward,right));
 const acceleration=scale(curvature,v*v*.48);
 const gravity=V(0,-9.81,0);
 const proper=sub(acceleration,gravity);
 return{
  // Positive vertical = downward pressure into seat, 1G when level at rest.
  vertical:clamp(dot(proper,up)/9.81,-4,5),
  // Positive lateral = passenger is thrown toward screen RIGHT.
  // In a right turn (acceleration toward +X), the passenger feels LEFT.
  lateral:clamp(-dot(proper,right)/9.81,-3,3)
 };
}
function gGauge(){
 if(mode!=="ride"&&mode!=="countdown")return;
 const g=mode==="countdown"?{vertical:1,lateral:0}:estimateRideG();
 const width=Math.min(126,Math.max(84,W*.30));
 const height=Math.min(115,Math.max(78,H*.19));
 const right=W-12,top=(fullMode?65:51),left=right-width,bottom=top+height;
 const lateral=clamp(g.lateral,-3,3),vertical=clamp(g.vertical,-2,5);
 const markerX=left+(lateral+3)/6*width;
 const markerY=top+(5-vertical)/7*height;
 ctx.save();
 ctx.lineJoin="round";ctx.lineCap="round";
 // Transparent ┐ shape: top horizontal (left/right) and right vertical
 // (seat pressure / airtime). No box, background, numerals or units.
 ctx.strokeStyle="rgba(232,247,255,.92)";ctx.lineWidth=3;
 ctx.beginPath();ctx.moveTo(left,top);ctx.lineTo(right,top);ctx.lineTo(right,bottom);ctx.stroke();
 ctx.strokeStyle="rgba(232,247,255,.60)";ctx.lineWidth=1.5;
 for(const tick of [-3,-2,-1,0,1,2,3]){
  const x=left+(tick+3)/6*width;
  ctx.beginPath();ctx.moveTo(x,top);ctx.lineTo(x,top+ (tick===0?11:6));ctx.stroke();
 }
 for(const tick of [-2,-1,0,1,2,3,4,5]){
  const y=top+(5-tick)/7*height;
  ctx.beginPath();ctx.moveTo(right,y);ctx.lineTo(right-(tick===1?12:6),y);ctx.stroke();
 }
 ctx.strokeStyle="#ffe478";ctx.lineWidth=6;
 ctx.beginPath();ctx.moveTo(markerX,top-2);ctx.lineTo(markerX,top+12);ctx.stroke();
 ctx.beginPath();ctx.moveTo(right-13,markerY);ctx.lineTo(right+1,markerY);ctx.stroke();
 ctx.restore();
}
function progressBarGeometry(){
 // Leave a visible gap beneath the L-shaped G gauge, then extend
 // progress all the way to the bottom of the canvas.
 const gTop=fullMode?65:51,gHeight=Math.min(115,Math.max(78,H*.19));
 const top=gTop+gHeight+66;
 const bottom=H-13;
 return{x:W-22,top,bottom,height:Math.max(1,bottom-top)};
}
function progressThermometer(){
 if(mode!=="ride"&&mode!=="countdown")return;
 const {x,top,bottom,height}=progressBarGeometry();
 const amount=clamp(finish?ridePos/finish:0,0,1);
 ctx.save();ctx.font="bold 13px sans-serif";ctx.textAlign="right";
 ctx.fillStyle="#f7fbff";ctx.fillText(Math.round(amount*100)+"%",W-12,top-17);
 ctx.lineCap="round";
 ctx.strokeStyle="rgba(232,247,255,.52)";ctx.lineWidth=7.5;
 ctx.beginPath();ctx.moveTo(x,top);ctx.lineTo(x,bottom);ctx.stroke();
 if(amount>0){ctx.strokeStyle="#ffe478";ctx.lineWidth=10.5;
  ctx.beginPath();ctx.moveTo(x,top);ctx.lineTo(x,top+height*amount);ctx.stroke();}
 // Show a small touch indicator only while scrubbing in pause.
 if(scrubbing){ctx.fillStyle="#ffe478";ctx.strokeStyle="#102438";
  ctx.lineWidth=1.5;ctx.beginPath();ctx.arc(x,top+height*amount,9,0,Math.PI*2);
  ctx.fill();ctx.stroke();}
 ctx.restore();
}
function progressHit(x,y){
 if(mode!=="ride"||!paused||ridePos>=finish||!track.length)return false;
 const bar=progressBarGeometry();
 return Math.abs(x-bar.x)<=34&&y>=bar.top-24&&y<=bar.bottom+15;
}
function seekPausedRide(y){
 const bar=progressBarGeometry();
 if(bar.height<=0||finish<=0)return;
 // Stay strictly before the finish while dragging to avoid goal actions.
 ridePos=clamp((y-bar.top)/bar.height,0,1)*Math.max(0,finish-.001);
 startFlash=0;
 status.textContent="一時停止中｜位置 "+Math.round(100*ridePos/finish)+"%";
 render();
}
const confettiColors=["#ff4f73","#ffd84d","#5de2c2","#63b7ff","#fff2a8","#ce86ff"];
function startGoalConfetti(){
 if(goalCelebrationStarted)return;
 goalCelebrationStarted=true;goalCelebrationTime=0;confettiEmitterAccumulator=0;confettiEmitterIndex=0;goalConfetti=[];
}
function updateGoalConfetti(dt){
 if(!goalCelebrationStarted)return;
 goalCelebrationTime+=dt;
 if(goalCelebrationTime<.62){
  confettiEmitterAccumulator+=dt*132;
  while(confettiEmitterAccumulator>=1){
   confettiEmitterAccumulator-=1;
   const side=confettiEmitterIndex++%2===0?-1:1,rand=Math.random();
   const x=side<0?W*(.025+Math.random()*.025):W*(.975-Math.random()*.025);
   const y=H*(.89+Math.random()*.035);
   const vx=-side*W*(.9+rand*.85),vy=-H*(.72+Math.random()*.58);
   goalConfetti.push({x,y,x0:x,y0:y,vx,vy,age:0,life:1.7+Math.random()*1.2,
    gravity:H*(.85+Math.random()*.35),angle:Math.random()*Math.PI*2,
    spin:(Math.random()-.5)*16,length:H*(.018+Math.random()*.021),
    width:Math.max(2,W*(.004+Math.random()*.003)),phase:Math.random()*Math.PI*2,
    color:confettiColors[Math.floor(Math.random()*confettiColors.length)],
    streamer:Math.random()<.28,side});
  }
 }
 for(const p of goalConfetti){
  p.age+=dt;p.x=p.x0+p.vx*p.age;p.y=p.y0+p.vy*p.age+.5*p.gravity*p.age*p.age;
  p.angle+=p.spin*dt;
 }
 goalConfetti=goalConfetti.filter(p=>p.age<p.life&&p.x>-40&&p.x<W+40&&p.y<H+60);
}
function drawGoalConfetti(){
 if(!goalCelebrationStarted||!goalConfetti.length)return;
 ctx.save();ctx.lineCap="round";ctx.lineJoin="round";
 for(const p of goalConfetti){
  const alpha=clamp(Math.min((p.life-p.age)*2.4,1),0,1);
  ctx.globalAlpha=alpha;ctx.strokeStyle=p.color;ctx.fillStyle=p.color;
  if(p.streamer){
   const span=Math.min(p.age,.42),start=Math.max(0,p.age-span),steps=7;
   ctx.lineWidth=Math.max(2,p.width*.8);ctx.beginPath();
   for(let k=0;k<=steps;k++){
    const f=k/steps,t=start+span*f;
    const x=p.x0+p.vx*t,y=p.y0+p.vy*t+.5*p.gravity*t*t;
    const wiggle=Math.sin(t*21+p.phase)*Math.min(11,H*.015);
    const len=Math.max(1,Math.hypot(p.vx,p.vy));
    const xx=x+wiggle*(-p.vy/len),yy=y+wiggle*(p.vx/len);
    k?ctx.lineTo(xx,yy):ctx.moveTo(xx,yy);
   }
   ctx.stroke();
  }else{
   ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.angle);
   ctx.fillRect(-p.width*.5,-p.length*.5,p.width,p.length);ctx.restore();
  }
 }
 ctx.restore();
}
function render(){
 camera=cam();landscape(camera);trackDraw(camera);cockpit();drawGoalConfetti();courseMiniMap();
 // Single-line HUD restores the map title area. The fullscreen exit
 // floats below-left of the G corner instead of covering this row.
 ctx.fillStyle="#102438db";ctx.fillRect(0,0,W,40);
 ctx.fillStyle="#fff";ctx.font="bold 14px sans-serif";
 if(fullMode){
  ctx.textAlign="left";ctx.fillText("ゲーム速度（目安） "+Math.round(speed*5)+" km/h",12,25);
 }else{
  ctx.textAlign="right";ctx.fillText("ゲーム速度（目安） "+Math.round(speed*5)+" km/h",W-12,25);
 }
 ctx.textAlign="left";
 gGauge();progressThermometer();
 if(mode==="countdown")overlay(String(Math.max(1,Math.ceil(countdown))));
 else if(startFlash>0)overlay("スタート！");
 if(ridePos>=finish&&mode!=="countdown"){startGoalConfetti();paused=true;status.textContent="ゴール";hint.hidden=true;pause.textContent="もう一度乗る";quit.hidden=true;fullResume.hidden=true;fullReplay.hidden=!fullMode;fullExit.hidden=!fullMode;overlay("ゴール")}
}
function updateLoopControls(){
 loopCount.textContent="手描き線を維持";
 loopMinus.disabled=manualLoops===0;
 if(mode==="edit")status.textContent=manualLoops===0?"描いた円を自動認識":"縦ループを"+manualLoops+"回指定";
}
loopPlus.onclick=()=>{if(mode!=="edit")return;manualLoops++;updateLoopControls()};
loopMinus.onclick=()=>{if(mode!=="edit")return;manualLoops=Math.max(0,manualLoops-1);updateLoopControls()};
function fullscreenActive(){return document.fullscreenElement===main||document.webkitFullscreenElement===main||fullMode;}
function syncFullMode(){
 // fullMode tracks both real fullscreen and mobile fallback.
 if(!document.fullscreenElement&&!document.webkitFullscreenElement&&!main.classList.contains("pseudo-full"))fullMode=false;
 fullExit.hidden=!fullMode;
 fullReplay.hidden=!(fullMode&&mode==="ride"&&ridePos>=finish);
 size();
 if(mode==="ride"||mode==="countdown")render();
}
function enterFullscreen(){
 // Fullscreen must be requested directly from a user click.
 // iPhone Safari versions without document fullscreen use a fixed viewport
 // fallback; this cannot hide browser UI, but keeps the game immersive.
 fullMode=true;
 fullExit.hidden=false;
 let promise;
 try{
  const request=main.requestFullscreen||main.webkitRequestFullscreen;
  if(request)promise=request.call(main);
  else main.classList.add("pseudo-full");
 }catch(_){main.classList.add("pseudo-full");}
 if(promise&&typeof promise.catch==="function")promise.catch(()=>{
  main.classList.add("pseudo-full");syncFullMode();
 });
 size();
}
function exitFullscreen(){
 main.classList.remove("pseudo-full");
 fullMode=false;fullExit.hidden=true;fullReplay.hidden=true;
 fullResume.hidden=!(mode==="ride"&&paused&&ridePos<finish);
 try{
  if(document.fullscreenElement&&document.exitFullscreen)document.exitFullscreen();
  else if(document.webkitFullscreenElement&&document.webkitExitFullscreen)document.webkitExitFullscreen();
 }catch(_){}
 size();
}
document.addEventListener("fullscreenchange",()=>{
 if(!document.fullscreenElement&&!main.classList.contains("pseudo-full"))fullMode=false;
 syncFullMode();
});
document.addEventListener("webkitfullscreenchange",syncFullMode);
fullExit.onclick=exitFullscreen;
fullReplay.onclick=()=>{if(ridePos>=finish)pause.click();};
function beginRide(){
 if(raw.length<2)return;
 editPlane="height";makeTrack();if(finish<1)return;ridePos=0;speed=0;launchElapsed=0;paused=false;countdown=3;startFlash=0;mode="countdown";go.hidden=true;fullGo.hidden=true;side.hidden=true;fullResume.hidden=true;pause.hidden=true;quit.hidden=true;loopControls.hidden=true;hint.hidden=true;status.textContent=loopWarning;render();
}
go.onclick=beginRide;
fullGo.onclick=()=>{if(go.disabled)return;enterFullscreen();beginRide();};
pause.onclick=()=>{
 if(ridePos>=finish){
  ridePos=0;speed=0;launchElapsed=0;paused=false;countdown=3;startFlash=0;goalConfetti=[];goalCelebrationStarted=false;
  mode="countdown";pause.hidden=true;quit.hidden=true;
  fullReplay.hidden=true;fullResume.hidden=true;hint.hidden=true;
  status.textContent="スタート準備中";pause.textContent="一時停止";
 }else{
  paused=!paused;
  scrubbing=false;
  pause.textContent=paused?"▶ 再開":"一時停止";
  status.textContent=paused?"一時停止中":"乗車中";
  // Fullscreen resume is useful only after pausing a running ride outside
  // fullscreen. Keep the current position and speed in either resume path.
  fullResume.hidden=!paused||fullMode;
 }
};
fullResume.onclick=()=>{
 if(mode!=="ride"||!paused||ridePos>=finish)return;
 // Request fullscreen synchronously on the user's gesture (Safari).
 enterFullscreen();
 paused=false;
 pause.textContent="一時停止";
 status.textContent="乗車中・全画面で再開";
 fullResume.hidden=true;
 render();
};
quit.onclick=()=>{
 if(mode!=="ride"&&mode!=="countdown")return;
 paused=false;speed=0;countdown=0;startFlash=0;launchElapsed=0;
 mode="edit";go.hidden=false;fullGo.hidden=false;side.hidden=false;go.disabled=raw.length<2||length<110;fullGo.disabled=go.disabled;
 pause.hidden=true;fullResume.hidden=true;quit.hidden=true;loopControls.hidden=false;
 hint.hidden=true;status.textContent="走行を終了しました。もう一度乗るか描き直せます。";if(fullMode)exitFullscreen();
 editor();
};
reset.onclick=()=>{reset.textContent="新しく描く";raw=[];track=[];objects=[];loopZones=[];goalConfetti=[];goalCelebrationStarted=false;goalCelebrationTime=0;countdown=0;startFlash=0;launchElapsed=0;speed=0;length=0;drawing=false;mode="edit";go.hidden=false;go.disabled=true;fullReplay.hidden=true;fullGo.hidden=false;fullGo.disabled=true;side.hidden=false;side.disabled=true;sideRaw=[];sideDrawing=false;editPlane="height";side.textContent="↔ 平面図を描く";pause.hidden=true;fullResume.hidden=true;quit.hidden=true;loopControls.hidden=false;manualLoops=0;updateLoopControls();hint.hidden=false;hint.textContent="横から見たコースを一筆書きしてください（左右カーブは自動）";status.textContent="側面図を指で描いてください";editor()};
// At 95%, apply the requested sharp brake and hold 15 km/h to the goal.
function updateRideSpeed(dt){
 const brakeMark=finish*.95;
 if(ridePos>=brakeMark){
  speed=3; // displayed speed: 15 km/h
  launchElapsed=3;
  return;
 }
 // Launch always starts at zero and linearly reaches displayed 45 km/h
 // after exactly 3 seconds of active riding time, regardless of slope.
 if(launchElapsed<3){
  launchElapsed=Math.min(3,launchElapsed+dt);
  speed=9*(launchElapsed/3);
 }else{
  const a=sample(ridePos),b=sample(Math.min(finish,ridePos+1));
  // The slope uses actual 3D displacement, also inside vertical loops.
  const ds=Math.max(.15,Math.hypot(b.x-a.x,b.y-a.y,b.z-a.z));
  const slope=clamp((b.y-a.y)/ds,-1,1);
  // Prevent an uphill deadlock once launch is complete.
  const minimumRunningSpeed=3; // game display: 15 km/h
  if(slope<0){
   const maxSpeed=30; // 150 km/h game speed limit
   const easing=Math.max(0,1-(speed/maxSpeed)**2);
   speed=clamp(speed+(-28.6875*slope)*easing*dt,minimumRunningSpeed,maxSpeed);
  }else if(slope>0){
   speed=clamp(speed-14.34375*slope*dt,minimumRunningSpeed,30);
  }else{
   speed=clamp(speed,minimumRunningSpeed,30);
  }
 }
}
// Split a frame that crosses the marker: reach exactly 95% at the old speed,
// then spend the rest of that frame at 15 km/h. This avoids braking early or
// jumping past the threshold at a high speed.
function advanceRidePosition(dt){
 const brakeMark=finish*.95,next=ridePos+speed*dt;
 if(ridePos<brakeMark&&speed>0&&next>=brakeMark){
  const timeToMark=clamp((brakeMark-ridePos)/speed,0,dt);
  ridePos=Math.min(finish,brakeMark+3*(dt-timeToMark));
  speed=3;launchElapsed=3;
 }else ridePos=Math.min(finish,next);
}
function loop(t){
 const dt=clamp((t-last)/1000||0,0,.05);last=t;
 if(mode==="countdown"){
  countdown=Math.max(0,countdown-dt);
  if(countdown<=0){mode="ride";startFlash=1.05;pause.hidden=false;quit.hidden=false;status.textContent="乗車中・手描きコース";}
  render();
 }else if(mode==="ride"){
  updateGoalConfetti(dt);
  if(!paused){
   if(startFlash>0)startFlash=Math.max(0,startFlash-dt);
   updateRideSpeed(dt);
   advanceRidePosition(dt);
  }
  render();
 }
 requestAnimationFrame(loop);
}
updateLoopControls();size();requestAnimationFrame(loop);
})();
