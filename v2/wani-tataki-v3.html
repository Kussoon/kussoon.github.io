<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no"><meta name="robots" content="noindex,nofollow"><meta name="theme-color" content="#70bc3e"><title>ワニたたき｜比較試作版 v3</title>
<style>
:root{--grass:#70bc3e;--dark:#3d852e;--yellow:#ffdb42;--ink:#233317}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
html,body{margin:0;height:100%;overscroll-behavior:none}body{font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;color:var(--ink);background:linear-gradient(#a8dd66,#5caa35)}
button,select{font:inherit;cursor:pointer}
.app{width:min(100%,480px);height:100dvh;min-height:470px;margin:auto;display:flex;flex-direction:column;padding:calc(env(safe-area-inset-top) + 7px) 10px calc(env(safe-area-inset-bottom) + 7px);gap:7px;overflow:hidden}
header{flex-shrink:0;border-radius:16px;padding:9px;background:#f8f8dce8;border:2px solid #e1d77b}
h1{font-size:clamp(21px,5.5vw,29px);margin:0 0 7px;text-align:center;letter-spacing:.06em}
h1 small{font-size:10px;opacity:.55}
.hud{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}.stat{text-align:center;background:#fff;border:1px solid #d4dbab;border-radius:11px;padding:5px 2px}.stat small{display:block;font-size:11px}.stat strong{display:block;font-size:clamp(18px,5vw,24px);font-variant-numeric:tabular-nums}
.controls{display:flex;gap:8px;margin-top:7px}.controls label{flex:1;display:flex;align-items:center;justify-content:space-between;gap:3px;background:#e9f5d1;border-radius:9px;padding:4px 7px;font-size:12px;font-weight:800}
select{border:1px solid #a0bc7f;border-radius:7px;background:white;min-width:0;max-width:116px;padding:6px 3px;color:#233317}
#sound{border:0;border-radius:7px;background:#657568;color:white;padding:6px 13px;font-weight:800}#sound.on{background:#268247}
.message{font-size:12px;text-align:center;margin:6px 0 0}
.field{flex:1;min-height:0;display:grid;grid-template-rows:repeat(5,minmax(0,1fr));overflow:hidden;border:4px solid var(--yellow);border-radius:18px;background:var(--grass);touch-action:manipulation}
.lane{position:relative;min-height:0;overflow:hidden;background:repeating-linear-gradient(122deg,#69b43b 0 21px,#73be45 21px 42px)}
.lane:not(:last-child){border-bottom:5px solid var(--yellow)}
.lane .num{position:absolute;left:9px;top:7px;font-size:11px;font-weight:900;opacity:.45}
.grass{position:absolute;right:0;top:0;bottom:0;width:31%;background:linear-gradient(120deg,#4d912d,#37802a);border-left:3px solid #387d2b;z-index:1}
.grass:before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(155deg,transparent 0 12px,#ffffff0b 12px 15px)}
.hole{position:absolute;right:-20px;top:50%;transform:translateY(-50%);height:75%;width:100px;background:#244622;border-radius:50%;box-shadow:inset 9px 0 12px #0e331b;z-index:2}
.croc{position:absolute;top:50%;left:100%;transform:translateY(-50%);padding:0;border:0;background:transparent;width:clamp(155px,52vw,238px);height:min(95%,100px);visibility:hidden;z-index:3;will-change:left;touch-action:manipulation}
.croc.live{visibility:visible}.croc.hit{filter:brightness(1.3)}
.croc svg{width:100%;height:100%;filter:drop-shadow(0 3px 3px #173b2a88)}
.hitword{position:absolute;right:19%;top:35%;z-index:5;pointer-events:none;font-weight:1000;font-size:clamp(21px,6vw,28px);color:#ffe241;text-shadow:2px 2px #805515,-1px -1px #805515;transform:rotate(-9deg);animation:hit 1s forwards;font-family:"Hiragino Maru Gothic ProN","Yu Gothic",cursive}
@keyframes hit{0%{opacity:0;scale:.5}15%{opacity:1;scale:1.1}75%{opacity:1}100%{opacity:0;scale:1.05}}
footer{display:flex;gap:7px;flex-shrink:0}footer button{border:0;border-radius:12px;min-height:44px;padding:9px;font-weight:900}#start{flex:2;background:#ffdb42;color:#463e0b}#reset{flex:1;background:#397c37;color:white}
.overlay{position:fixed;inset:0;background:#112814ad;display:grid;place-items:center;padding:20px;z-index:20}.overlay[hidden]{display:none}.dialog{width:min(100%,350px);border-radius:23px;background:#fffcea;border:3px solid #eada69;padding:23px;text-align:center;box-shadow:0 14px 50px #0005}.dialog h2{margin:0 0 9px;font-size:26px}.dialog p{line-height:1.6;font-size:14px}.dialog button{width:100%;background:#358b3e;color:white;border:0;border-radius:12px;padding:14px;font-weight:900}
@media(max-height:670px){.app{gap:4px;padding-top:calc(env(safe-area-inset-top) + 3px);padding-bottom:calc(env(safe-area-inset-bottom) + 3px)}header{padding:5px}h1{font-size:19px;margin-bottom:4px}.stat{padding:2px}.controls{margin-top:4px}.message{margin-top:3px}footer button{min-height:36px;padding:6px}}
footer #pause{flex:1;background:#fff2b4;color:#453b17}footer #pause:disabled{opacity:.5} .dialog #closeDialog{margin-top:8px;background:#dfebc9;color:#25441d;border:2px solid #9bba84} .dialog #closeDialog[hidden]{display:none} .grass{right:auto;left:0;width:29%;border-left:0;border-right:3px solid #387d2b} .hole{right:auto;left:-28px;box-shadow:inset -9px 0 12px #0e331b} .hitword{right:auto;left:6%} .croc svg{transform:scaleX(-1)} .lane{background:repeating-linear-gradient(122deg,#69b43b 0 21px,#73be45 21px 42px)} </style></head>
<body><main class="app"><header><h1>🐊 ワニたたき <small>v3</small></h1><div class="hud"><div class="stat"><small>スコア</small><strong id="score">0</strong></div><div class="stat"><small>のこり時間</small><strong id="time">30</strong></div><div class="stat"><small>ベスト</small><strong id="best">0</strong></div></div><div class="controls"><label>レベル <select id="level"><option value="easy">やさしい</option><option value="normal" selected>ふつう</option><option value="hard">むずかしい</option></select></label><label>音 <button id="sound" type="button" aria-pressed="false">OFF</button></label></div><p class="message" id="message">右の草むらから出るワニをタップ！</p></header><section class="field" id="field" aria-label="5つのワニレーン"></section><footer><button id="start">スタート</button><button id="pause" disabled>一時停止</button><button id="reset">リセット</button></footer></main>
<div class="overlay" id="overlay"><section class="dialog" role="dialog" aria-modal="true" aria-labelledby="dialogTitle"><h2 id="dialogTitle">ワニたたき</h2><p id="dialogMessage">右側5か所から出てくるワニをタップ！<br>30秒でどれだけ叩けるかな？</p><button id="play">ゲームスタート</button><button id="closeDialog" type="button" hidden>閉じる</button><p style="font-size:11px;opacity:.75">音は初期状態でOFFです</p></section></div>
<script>(()=>{
'use strict';
const $=id=>document.getElementById(id), DURATION=30000;
const config={easy:{gap:[800,1550],stay:[1300,1900],double:.07,triple:.02,pause:.15,burst:.06},normal:{gap:[450,1100],stay:[850,1420],double:.14,triple:.07,pause:.17,burst:.11},hard:{gap:[260,800],stay:[590,1060],double:.22,triple:.12,pause:.15,burst:.15}};
const crocodile='<svg viewBox="0 0 260 110" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><path d="M252 14Q192 12 157 24Q103 12 68 21Q24 26 9 52Q3 66 29 75Q80 91 153 82Q211 91 255 84Z" fill="#70bd4a" stroke="#2e672c" stroke-width="5"/><path d="M15 57Q51 61 90 62L235 62" fill="none" stroke="#315d33" stroke-width="4" stroke-linecap="round"/><path d="M20 66Q54 85 119 77Q188 80 230 67" fill="none" stroke="#e9e4b6" stroke-width="6" stroke-linecap="round"/><ellipse cx="60" cy="29" rx="16" ry="18" fill="#f9f9d9" stroke="#2e672c" stroke-width="4"/><ellipse cx="102" cy="29" rx="16" ry="18" fill="#f9f9d9" stroke="#2e672c" stroke-width="4"/><circle cx="56" cy="31" r="6" fill="#192d1e"/><circle cx="98" cy="31" r="6" fill="#192d1e"/><circle cx="20" cy="51" r="4" fill="#285e30"/><circle cx="38" cy="48" r="4" fill="#285e30"/><circle cx="117" cy="55" r="10" fill="#ec888b" opacity=".75"/><path d="M180 21L191 7L207 23M215 19L229 5L241 19" fill="#70bd4a" stroke="#2e672c" stroke-width="4" stroke-linejoin="round"/></svg>';
const lanes=Array.from({length:5},(_,i)=>{const lane=document.createElement('div');lane.className='lane';lane.innerHTML='<span class="num">0'+(i+1)+'</span><div class="grass"></div><div class="hole"></div>';const croc=document.createElement('button');croc.type='button';croc.className='croc';croc.innerHTML=crocodile;croc.setAttribute('aria-label',(i+1)+'段目のワニ');lane.append(croc);$('field').append(lane);return {lane,croc,active:false,hit:false,born:0,life:0,exposure:0,hitWord:null}});
let mode='ready',score=0,best=0,remaining=30,t=0,lastWall=0,raf=0,nextEvent=450,events=[],lastLane=-1,muted=true,audio=null;
try{best=Number(localStorage.getItem('kussoon-wani-tataki-v3-best'))||0}catch{}
const rnd=(a,b)=>a+Math.random()*(b-a);
const pickExposure=(multi)=>multi?(Math.random()<.7?1:.5):((r)=>r<.7?1:r<.9?.5:.3)(Math.random());
function hud(){$('score').textContent=score;$('time').textContent=remaining;$('best').textContent=best}
function idle(l){l.active=false;l.hit=false;l.croc.classList.remove('live','hit');l.croc.style.left='-300px'}
function clearField(){for(const l of lanes){idle(l);if(l.hitWord){l.hitWord.remove();l.hitWord=null}}}
function showDialog(title,body,button,canClose){$('dialogTitle').textContent=title;$('dialogMessage').textContent=body;$('play').textContent=button;$('closeDialog').hidden=!canClose;$('overlay').hidden=false}
function updateButtons(){$('start').textContent=mode==='playing'?'プレイ中':mode==='ended'?'もう一度':'スタート';$('pause').disabled=!(mode==='playing'||mode==='paused');$('pause').textContent=mode==='paused'?'再開':'一時停止'}
function end(){mode='ended';cancelAnimationFrame(raf);remaining=0;hud();clearField();events=[];updateButtons();$('message').textContent='ゲーム終了！';showDialog('ゲーム終了！','今回 '+score+'点！　ベスト '+best+'点','もう一度遊ぶ',true)}
function reset(){cancelAnimationFrame(raf);mode='ready';score=0;remaining=30;t=0;events=[];clearField();hud();updateButtons();$('message').textContent='右の草むらから出るワニをタップ！';showDialog('ワニたたき','左の草むらから右へ飛び出すワニをタップ！ 30秒で何点取れるかな？','ゲームスタート',true)}
function start(){cancelAnimationFrame(raf);mode='playing';score=0;remaining=30;t=0;events=[];nextEvent=400;clearField();hud();$('overlay').hidden=true;updateButtons();$('message').textContent='左から出てくるワニをタップ！';lastWall=performance.now();raf=requestAnimationFrame(frame)}
function pause(){if(mode==='playing'){mode='paused';cancelAnimationFrame(raf);$('message').textContent='一時停止中';updateButtons();}else if(mode==='paused'){mode='playing';lastWall=performance.now();$('message').textContent='再開！';updateButtons();raf=requestAnimationFrame(frame)}}
function queue(at,indices){events.push({at,indices});events.sort((a,b)=>a.at-b.at)}
function wave(){const c=config[$('level').value];let n=1,r=Math.random();if(r<c.triple)n=3;else if(r<c.triple+c.double)n=2;
const indices=[0,1,2,3,4];for(let i=indices.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[indices[i],indices[j]]=[indices[j],indices[i]]}queue(t,indices.slice(0,n));lastLane=indices[0];
const burst=Math.random()<c.burst;
if(burst){ // five crocodiles, sequentially across five lanes
 const order=[0,1,2,3,4];for(let i=order.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[order[i],order[j]]=[order[j],order[i]]}
 const base=t+350;for(let i=0;i<5;i++)queue(base+i*rnd(250,330),[order[i]]);
 nextEvent=t+2600;
}else{nextEvent=t+rnd(...c.gap);if(Math.random()<c.pause)nextEvent=t+1900+rnd(0,400)}
}
function appear(indices){const c=config[$('level').value];for(const i of indices){const l=lanes[i];if(l.active)continue;l.active=true;l.hit=false;l.born=t;l.life=rnd(...c.stay);l.exposure=pickExposure(indices.length>1);l.croc.classList.add('live');l.croc.classList.remove('hit')}}
function draw(l){const u=(t-l.born)/l.life;if(u>=1){idle(l);return}
const p=l.hit?Math.max(0,1-(t-l.born)/140):u<.19?u/.19:u<.7?1:Math.max(0,(1-u)/.3);
const w=l.lane.clientWidth,head=l.croc.offsetWidth||170;const max=Math.min(head*l.exposure,w*.67);const visible=max*p;
// head starts concealed within left hillside, extends RIGHT; leftmost part of head is hidden beneath mask
l.croc.style.left=(-head+visible)+'px';
}
function frame(now){if(mode!=='playing')return;const delta=Math.min(100,Math.max(0,now-lastWall));lastWall=now;t+=delta;remaining=Math.max(0,Math.ceil((DURATION-t)/1000));hud();if(t>=DURATION){end();return}
if(t>=nextEvent)wave();while(events.length&&events[0].at<=t){appear(events.shift().indices)}for(const l of lanes)if(l.active)draw(l);raf=requestAnimationFrame(frame)}
function wow(){if(muted)return;try{const C=window.AudioContext||window.webkitAudioContext;if(!C)return;audio=audio||new C();if(audio.state==='suspended')audio.resume();const now=audio.currentTime,o=audio.createOscillator(),g=audio.createGain();o.type='triangle';o.frequency.setValueAtTime(390,now);o.frequency.exponentialRampToValueAtTime(700,now+.09);o.frequency.exponentialRampToValueAtTime(260,now+.28);g.gain.setValueAtTime(.001,now);g.gain.linearRampToValueAtTime(.14,now+.02);g.gain.exponentialRampToValueAtTime(.001,now+.3);o.connect(g).connect(audio.destination);o.start(now);o.stop(now+.31)}catch{}}
function hit(l){if(mode!=='playing'||!l.active||l.hit)return;l.hit=true;score+=10;if(score>best){best=score;try{localStorage.setItem('kussoon-wani-tataki-v3-best',String(best))}catch{}}hud();wow();if(navigator.vibrate)navigator.vibrate(22);const word=document.createElement('span');word.className='hitword';word.textContent='ヒット！';l.lane.append(word);l.hitWord=word;setTimeout(()=>{word.remove();if(l.hitWord===word)l.hitWord=null},1000);l.life=Math.max(140,t-l.born+140);l.croc.classList.add('hit')}
lanes.forEach(l=>l.croc.addEventListener('pointerdown',e=>{e.preventDefault();hit(l)}));
$('play').addEventListener('click',start);$('closeDialog').addEventListener('click',()=>{$('overlay').hidden=true});$('start').addEventListener('click',()=>{if(mode!=='playing')start()});$('pause').addEventListener('click',pause);$('reset').addEventListener('click',reset);
$('sound').addEventListener('click',()=>{muted=!muted;$('sound').textContent=muted?'OFF':'ON';$('sound').classList.toggle('on',!muted);$('sound').setAttribute('aria-pressed',String(!muted))});
document.addEventListener('visibilitychange',()=>{if(document.hidden&&mode==='playing')pause()});
hud();updateButtons();
})();</script></body></html>
