<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",Meiryo,sans-serif;color:#203d53;background:#f3f8fc}
*{box-sizing:border-box}body{margin:0}main{max-width:900px;margin:auto;padding:16px 12px 50px}
a{color:#165b81}h1{font-size:clamp(22px,5vw,30px);line-height:1.5;margin:12px 0}
p{line-height:1.75}.panel{border-radius:18px;border:1px solid #c5dbe8;background:#fff;padding:16px;margin:13px 0}

.level a.current{background:#ffe59b;border-color:#e2b43d;color:#533c14}

.chosen-one{display:flex;align-items:center;gap:5px}.type-symbol{display:inline-flex;align-items:center;justify-content:center;width:34px;height:34px;flex-shrink:0;border-radius:9px;background:var(--tile);color:#fff}
.type-symbol svg{width:75%;height:75%;display:block;fill:none;stroke:currentColor;stroke-width:2.7;stroke-linecap:round;stroke-linejoin:round}

.g4,.g2{border-left:5px solid #e8942a}.g1{border-left:5px solid #7b9eb8}
.g05,.g025{border-left:5px solid #447ac4}.g0{border-left:5px solid #8361a4}
.card{border:1px solid #d7e3eb;border-radius:10px;padding:9px;margin:7px 0;background:#f8fbfd}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-weight:800}
.math{font-size:13px;color:#445d70;margin-top:6px;line-height:1.65}
.number{margin-left:auto;font-size:19px;color:#205d86}
.note{color:#476679;font-size:14px}
ruby{ruby-position:over}rt{font-size:.58em;line-height:1.05;font-weight:600}
@media(max-width:600px){.results{grid-template-columns:1fr}.panel{padding:12px}.selectors{gap:7px}.selectors label{font-size:14px}}

.practice-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.practice-grid label{display:grid;gap:6px;font-weight:800}
.attack-panel{background:#fff8eb;border:1px solid #efd5a3;border-radius:12px;padding:12px}
.defense-panel{background:#f0f8fd;border:1px solid #cbdde8;border-radius:12px;padding:12px}
.defense-panel .selectors{grid-template-columns:1fr 1fr}
.pick-preview{display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap;min-height:66px;font-weight:800}
.result-panel{text-align:center;border:2px solid #aacadb;border-radius:14px;padding:14px;background:#eef7fd;margin-top:12px}
.result-label{font-size:clamp(17px,4.5vw,24px);font-weight:900}
.result-mult{font-weight:900;font-size:clamp(42px,11vw,72px);line-height:1.25;color:#1b597f}
.calc-detail{font-size:15px;color:#30556c;line-height:1.8;margin:7px 0}
.actions{display:flex;justify-content:center;gap:9px;flex-wrap:wrap;margin-top:14px}
.actions button{min-height:48px;padding:10px 16px;border-radius:11px;background:#1c6b9a;color:white;font:inherit;font-weight:800;border:0;cursor:pointer}
.actions button:focus-visible{outline:3px solid #f5b74b;outline-offset:3px}
@media(max-width:600px){.practice-grid{grid-template-columns:1fr}.defense-panel .selectors{grid-template-columns:1fr 1fr}}
</style></head><body><main>

<p class="eyebrow">Kussoon / れんしゅう・<ruby>上級<rt>じょうきゅう</rt></ruby></p>
<h1>🎯 <ruby>上級<rt>じょうきゅう</rt></ruby>：2タイプのれんしゅう</h1>
<div class="level"><a href="./">🌱 <ruby>初級<rt>しょきゅう</rt></ruby>へもどる</a><a class="current" href="./advanced-practice.html" aria-current="page">⭐ <ruby>上級<rt>じょうきゅう</rt></ruby>：2タイプ</a></div>
<section class="panel">
<p>こうげきする わざを1つ、あいてのタイプを2つえらんで、わざの<ruby>相性<rt>あいしょう</rt></ruby>を<ruby>確認<rt>かくにん</rt></ruby>しましょう。</p>
<div class="practice-grid">
<div class="attack-panel"><label for="attack">⚔️ こうげきする わざのタイプ</label>
<select id="attack" aria-label="こうげきするわざのタイプ"></select>
<div class="pick-preview" id="attack-preview"></div></div>
<div class="defense-panel">
<div class="selectors">
<label for="first">🛡️ あいての1つめ<select id="first" aria-label="あいての1つめのタイプ"></select></label>
<label for="second">🛡️ あいての2つめ<select id="second" aria-label="あいての2つめのタイプ"></select></label>
</div><div class="pick-preview" id="defense-preview"></div></div>
</div>
<div class="result-panel" role="status" aria-live="polite" aria-atomic="true">
<div class="result-label" id="result-label"></div>
<div class="result-mult" id="result-mult"></div>
<div class="calc-detail" id="calc-detail"></div>
</div>
<div class="actions"><button type="button" id="random">🔀 べつの<ruby>組<rt>く</rt></ruby>み<ruby>合<rt>あ</rt></ruby>わせ</button></div>
<p class="note">※ 2つの<ruby>倍率<rt>ばいりつ</rt></ruby>をかけ<ruby>算<rt>ざん</rt></ruby>します。あいての2つのタイプは<ruby>別<rt>べつ</rt></ruby>のタイプをえらびます。<ruby>特性<rt>とくせい</rt></ruby>、もちもの、<ruby>特殊<rt>とくしゅ</rt></ruby>なわざの<ruby>効果<rt>こうか</rt></ruby>は<ruby>考慮<rt>こうりょ</rt></ruby>しません。</p>
</section>

</main><script>
"use strict";

const TYPES=[
["ノーマル","◯","#d7d4cd","#232d3a"],
["ほのお","♨","#f8b27b","#412016"],
["みず","●","#92c6fa","#183853"],
["でんき","⚡","#ffe17a","#463b0c"],
["くさ","♣","#a9df9a","#1e4728"],
["こおり","❄","#a2e4e4","#15434d"],
["かくとう","✊","#e6a29e","#4d2023"],
["どく","◆","#cca1de","#402450"],
["じめん","▰","#e5cd92","#483818"],
["ひこう","➶","#b7c8ed","#263b5c"],
["エスパー","✦","#f6a4b6","#522536"],
["むし","✳","#c6d985","#354518"],
["いわ","⬡","#d0c394","#493e21"],
["ゴースト","☾","#a8a0cb","#272344"],
["ドラゴン","♢","#9ab3eb","#253661"],
["あく","◈","#b5a7a0","#332722"],
["はがね","⬢","#bfcdd2","#283c47"],
["フェアリー","♡","#f3bddc","#582c46"]
];
const NAMES=TYPES.map(t=>t[0]);
// 攻撃タイプごとの「×2」「×0.5」「×0」の防御タイプ。その他は×1。
const RULES={
"ノーマル":[[],["いわ","はがね"],["ゴースト"]],
"ほのお":[["くさ","こおり","むし","はがね"],["ほのお","みず","いわ","ドラゴン"],[]],
"みず":[["ほのお","じめん","いわ"],["みず","くさ","ドラゴン"],[]],
"でんき":[["みず","ひこう"],["でんき","くさ","ドラゴン"],["じめん"]],
"くさ":[["みず","じめん","いわ"],["ほのお","くさ","どく","ひこう","むし","ドラゴン","はがね"],[]],
"こおり":[["くさ","じめん","ひこう","ドラゴン"],["ほのお","みず","こおり","はがね"],[]],
"かくとう":[["ノーマル","こおり","いわ","あく","はがね"],["どく","ひこう","エスパー","むし","フェアリー"],["ゴースト"]],
"どく":[["くさ","フェアリー"],["どく","じめん","いわ","ゴースト"],["はがね"]],
"じめん":[["ほのお","でんき","どく","いわ","はがね"],["くさ","むし"],["ひこう"]],
"ひこう":[["くさ","かくとう","むし"],["でんき","いわ","はがね"],[]],
"エスパー":[["かくとう","どく"],["エスパー","はがね"],["あく"]],
"むし":[["くさ","エスパー","あく"],["ほのお","かくとう","どく","ひこう","ゴースト","はがね","フェアリー"],[]],
"いわ":[["ほのお","こおり","ひこう","むし"],["かくとう","じめん","はがね"],[]],
"ゴースト":[["エスパー","ゴースト"],["あく"],["ノーマル"]],
"ドラゴン":[["ドラゴン"],["はがね"],["フェアリー"]],
"あく":[["エスパー","ゴースト"],["かくとう","あく","フェアリー"],[]],
"はがね":[["こおり","いわ","フェアリー"],["ほのお","みず","でんき","はがね"],[]],
"フェアリー":[["かくとう","ドラゴン","あく"],["ほのお","どく","はがね"],[]]
};
const MATRIX=Object.fromEntries(NAMES.map(a=>[a,Object.fromEntries(NAMES.map(d=>[d,RULES[a][0].includes(d)?2:RULES[a][1].includes(d)?0.5:RULES[a][2].includes(d)?0:1]))]));

const SVG_ICONS={
"ノーマル":'<circle cx="12" cy="12" r="7"/><path d="M12 1v2M4 3l1.4 2M20 3l-1.4 2"/>',
"ほのお":'<path d="M12 2c2 5-1 5 3 9 2-2 2-4 2-5 6 7 5 16-5 16S3 15 8 9c0 5 2 4 4-7z"/><path d="M12 12c2 3-2 4-1 7 2 2 5-1 3-4"/>',
"みず":'<path d="M3 16c4-5 6 3 10-1s6-3 8-1M3 20c5-3 7 3 12-1 2-1 4-1 6 0M10 11c-2-4 4-7 4-10 5 7-1 10-4 10"/>',
"でんき":'<path d="M13 2L5 14h7l-1 8 8-12h-7z"/>',
"くさ":'<path d="M12 22V11M12 15C5 15 3 11 3 5c7 0 9 3 9 10M12 12c0-7 3-9 9-9 0 7-3 9-9 9"/>',
"こおり":'<path d="M12 2v20M2 12h20M5 5l14 14M19 5L5 19M9 4l3 3 3-3M9 20l3-3 3 3"/>',
"かくとう":'<path d="M5 14V9a2 2 0 0 1 4 0V6a2 2 0 0 1 4 0v2a2 2 0 0 1 4 0v2a2 2 0 0 1 4 0v5c0 5-4 7-8 7-5 0-8-3-8-8zM9 9v3M13 8v4M17 10v3"/>',
"どく":'<path d="M9 2h6M11 2v7l-7 10a2 2 0 0 0 2 3h12a2 2 0 0 0 2-3L13 9V2M8 16h8"/><circle cx="10" cy="19" r="1"/><circle cx="14" cy="19" r="1"/>',
"じめん":'<path d="M2 14l5-6 4 4 4-8 7 10M2 17c4-2 7 2 10 0s7-1 10 0M3 21h18"/>',
"ひこう":'<path d="M2 15C9 6 14 5 22 3c-3 8-9 12-17 13l5-1M4 21c7-4 11-1 17-5"/>',
"エスパー":'<path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7-10-7-10-7z"/><circle cx="12" cy="12" r="3"/>',
"むし":'<circle cx="12" cy="13" r="8"/><path d="M12 5v16M6 3L4 1M18 3l2-2M3 9L1 7M21 9l2-2M3 17l-2 2M21 17l2 2"/><circle cx="8" cy="11" r="1"/><circle cx="16" cy="11" r="1"/>',
"いわ":'<path d="M3 20l-1-9 7-8 7 3 6 8-3 8zM9 3l3 9-9 8M12 12l10 2M12 12l7 10"/>',
"ゴースト":'<path d="M4 21V11a8 8 0 0 1 16 0v10l-4-3-4 3-4-3z"/><circle cx="9" cy="12" r="1"/><circle cx="15" cy="12" r="1"/>',
"ドラゴン":'<path d="M3 20c6 1 9-4 8-8l4-2-2-5 5 2 3-3-1 9-5 3-2 5M7 13l-5-1 5-3M14 13l2 1"/>',
"あく":'<path d="M2 9c6 2 13 2 20-4-2 11-7 16-13 16C5 21 3 17 2 9z"/><path d="M11 12l4-1-2 5z"/>',
"はがね":'<path d="M8 2h8l6 10-6 10H8L2 12z"/><circle cx="12" cy="12" r="4"/>',
"フェアリー":'<path d="M12 12C7 1 1 5 3 12c2 5 7 5 9 0zm0 0c5-11 11-7 9 0-2 5-7 5-9 0zM12 12v9M5 3l1 2M19 3l-1 2"/>'
};
const TILE_COLORS={
"ノーマル":"#8e949a","ほのお":"#ef6a32","みず":"#238add","でんき":"#efb918","くさ":"#41a64b","こおり":"#20bade",
"かくとう":"#dd6a29","どく":"#8651a0","じめん":"#a27745","ひこう":"#69aee8","エスパー":"#e86b8b","むし":"#8cae31",
"いわ":"#b3a16b","ゴースト":"#6a4b91","ドラゴン":"#4c59ae","あく":"#414148","はがね":"#498da7","フェアリー":"#eb8fbc"
};
function symbol(name){
 const span=document.createElement("span");span.className="type-symbol";span.style.setProperty("--tile",TILE_COLORS[name]);
 span.innerHTML='<svg viewBox="0 0 24 24" role="img" aria-label="'+name+'のアイコン">'+SVG_ICONS[name]+'</svg>';
 return span;
}


const attack=document.getElementById("attack"),first=document.getElementById("first"),second=document.getElementById("second");
for(const select of [attack,first,second]){
 NAMES.forEach(name=>{const option=document.createElement("option");option.value=name;option.textContent=name;select.appendChild(option)});
}
attack.value="いわ";first.value="ほのお";second.value="ひこう";
function preview(node,names){
 node.replaceChildren();
 for(const name of names){const el=document.createElement("span");el.className="chosen-one";el.append(symbol(name),document.createTextNode(name));node.appendChild(el)}
}
function render(changed){
 if(first.value===second.value){
  const other=NAMES.find(name=>name!==first.value);
  if(changed==="first")second.value=other;else first.value=other;
 }
 const a=attack.value,b=first.value,c=second.value;
 preview(document.getElementById("attack-preview"),[a]);
 preview(document.getElementById("defense-preview"),[b,c]);
 const m1=MATRIX[a][b],m2=MATRIX[a][c],mult=m1*m2;
 const label=mult===4?"とても こうかばつぐん！":mult===2?"こうかばつぐん！":mult===1?"ふつうの こうか":mult===0.5?"こうかは いまひとつ":mult===0.25?"とても いまひとつ":"こうかが ない";
 document.getElementById("result-label").textContent=label;
 document.getElementById("result-mult").textContent="×"+mult;
 document.getElementById("calc-detail").textContent=a+"のわざ → "+b+" ×"+m1+" × "+c+" ×"+m2+" ＝ ×"+mult;
}
attack.addEventListener("change",()=>render("attack"));
first.addEventListener("change",()=>render("first"));
second.addEventListener("change",()=>render("second"));
document.getElementById("random").addEventListener("click",()=>{
 const old=attack.value+"|"+first.value+"|"+second.value;
 let chosen;
 do{
  const a=Math.floor(Math.random()*NAMES.length);
  const b=Math.floor(Math.random()*NAMES.length);
  let c=Math.floor(Math.random()*(NAMES.length-1));
  if(c>=b)c++;
  chosen=[NAMES[a],NAMES[b],NAMES[c]];
 }while(chosen.join("|")===old);
 [attack.value,first.value,second.value]=chosen;
 render("random");
});
render("initial");
</script></body></html>
