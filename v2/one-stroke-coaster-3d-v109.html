/* Kussoon one-stroke coaster: world-space bridge support clearance v79.
 * Keeps the approved ride geometry, vehicle, rails and physics untouched.
 * Omits a support when another section of the route passes through its
 * vertical occupied space. Spatial grid keeps checks cheap during animation.

(function(root){

   const s=finish*i/samples,p=sample(s),entry={s,x:p.x,y:p.y,z:p.z};

   // for a ground-supported trestle. No beam is ever put above the car.
   const upY=dir.z*right.x-dir.x*right.z;

   }
   const beamY=p.y-.52,rad=3.3;

     // section at the same (x,z), even from a different lap, is checked.

(function(root){

   let pivot=c;for(let r=c+1;r<3;r++)if(Math.abs(a[r][c])>Math.abs(a[pivot][c]))pivot=r;
   if(Math.abs(a[pivot][c])<1e-9)return null;

function runningAcceleration(slope,v){
 const normalFraction=Math.sqrt(Math.max(0,1-slope*slope));
 return -gravity*slope-gravity*rollingCoefficient*normalFraction-dragPerMetre*v*v;
}
function advanceRidePosition(dt){
 if(dt<=0)return;
 const brakeMark=finish*brakeStartFraction;
 if(ridePos<brakeMark){
  const tangent=railTangent(Math.min(brakeMark,ridePos+speed*dt*.5));
  const slope=clamp(tangent.y,-1,1),floor=slope>1e-6?minimumClimbSpeed:0;
  const initial=Math.max(floor,speed);
  const acceleration=runningAcceleration(slope,initial);
  const activeTime=acceleration<0?Math.min(dt,(initial-floor)/-acceleration):dt;
  const endSpeed=Math.max(floor,initial+acceleration*activeTime);
  const activeDistance=(initial+endSpeed)*.5*activeTime;
  const distance=activeDistance+endSpeed*(dt-activeTime);
  const remaining=brakeMark-ridePos;
  if(distance<remaining){
   rideLongitudinalG=clamp((endSpeed-speed)/(dt*gravity),-2,2);
   ridePos+=distance;speed=endSpeed;
   return;
  }
  if(remaining<=activeDistance){
   brakeEntrySpeed=Math.sqrt(Math.max(0,initial*initial+2*acceleration*remaining));
   dt-=2*remaining/(initial+brakeEntrySpeed);
  }else{
   brakeEntrySpeed=endSpeed;
   dt-=activeTime+(remaining-activeDistance)/endSpeed;
  }
  ridePos=brakeMark;dt=Math.max(0,dt);
 }
 const deceleration=brakingDeceleration();
 const approachSpeed=brakingSpeedAt(ridePos);
 const timeToStop=deceleration>0?approachSpeed/deceleration:Infinity;
 rideLongitudinalG=clamp(-deceleration/9.81,-2,0);
 const next=ridePos+(approachSpeed+Math.max(0,approachSpeed-deceleration*dt))*.5*dt;
 if(dt>=timeToStop||next>=finish){
  ridePos=finish;
  speed=0;
  rideLongitudinalG=0;
  startFlash=0;
 }else{
  speed=approachSpeed-deceleration*dt;
  ridePos=next;
 }
}
function loop(t){
 const dt=clamp((t-last)/1000||0,0,.05);last=t;
 if(mode==="countdown"){
  countdown=Math.max(0,countdown-dt);
  if(countdown<=0){mode="ride";speed=releaseSpeed;startFlash=1.05;pause.hidden=false;quit.hidden=false;status.textContent="乗車中・手描きコース";}
  render();
 }else if(mode==="ride"){
  updateGoalConfetti(dt);
  if(!paused){
   if(startFlash>0)startFlash=Math.max(0,startFlash-dt);
   advanceRidePosition(dt);
  }
  render();
 }
 requestAnimationFrame(loop);
}
updateLoopControls();size();requestAnimationFrame(loop);
})();
