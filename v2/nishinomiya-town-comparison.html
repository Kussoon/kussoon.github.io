function fontScale(){const factor=Math.min(2,Math.max(.75,Math.pow(1.18,map.getZoom()-initialZoom)*fontPct/100));$('map').style.setProperty('--town-font',(8*factor).toFixed(2)+'px')}
function endBlink(){if(blinkTimer)clearInterval(blinkTimer);blinkTimer=null;if(selected)selected.layer.setStyle(normal);selected=null}
function choose(it,zoom){if(selected===it){endBlink();$('status').textContent=it.name+' の点滅を停止しました。';return}
endBlink();selected=it;blinkOn=true;it.layer.setStyle(highlight);if(zoom)map.fitBounds(it.layer.getBounds(),{padding:[50,50],maxZoom:15,animate:false});
$('status').textContent=it.name+(READINGS[it.name]?'（'+READINGS[it.name]+'）':'')+' を選択中です。';
blinkTimer=setInterval(()=>{if(!selected)return;blinkOn=!blinkOn;it.layer.setStyle(blinkOn?highlight:normal)},500)}
function candidateList(){const query=$('search').value.trim();$('matches').replaceChildren();if(!query)return;
const results=items.filter(it=>it.name.includes(query)||(READINGS[it.name]||'').includes(query)).slice(0,35);
for(const it of results){const b=document.createElement('button');b.type='button';b.textContent=it.name;b.addEventListener('click',()=>choose(it,true));$('matches').appendChild(b)}}
function makeTooltip(layer,name,at,offset){let t=L.tooltip({permanent:true,direction:'center',interactive:false,className:'town-label',offset:L.point(...offset)});if(at)t.setLatLng(at).setContent(labelHTML(name)).addTo(map);else layer.bindTooltip(t);if(!at)t=layer.getTooltip();t.setContent(labelHTML(name));return t}
Promise.all([fetch('/nishinomiya/data/nishinomiya-towns.topojson').then(r=>{if(!r.ok)throw Error('町域データ');return r.json()}),fetch('/nishinomiya/data/community-town-map.json').then(r=>{if(!r.ok)throw Error('コミュニティデータ');return r.json()})])
.then(([topology,mapping])=>{
const obj=topology.objects.town||topology.objects[Object.keys(topology.objects)[0]], valid=new Set(mapping.communities||[]);
const geometries=(obj.geometries||[]).filter(g=>rawName(g)==='岡田山'||valid.has(mapping.towns?.[rawName(g)]?.community));
const grouped=new Map();for(const g of geometries){const name=groupedName(rawName(g));if(!grouped.has(name))grouped.set(name,[]);grouped.get(name).push(g)}
const features=[...grouped].map(([name,members])=>{const feature=topojson.merge(topology,members);feature.properties={S_NAME:name};return feature});
allLayer=L.geoJSON({type:'FeatureCollection',features},{style:normal,onEachFeature:(f,layer)=>{
const name=f.properties.S_NAME,it={name,layer,labels:[]};items.push(it);layer.on('click',()=>choose(it,false));
const multiple=MULTI_LABELS[name];if(multiple){for(const pos of multiple)it.labels.push(makeTooltip(layer,name,pos,[0,0]))}
else{it.labels.push(makeTooltip(layer,name,null,LABEL_OFFSETS[name]||[0,0]));for(const pos of EXTRA_LABELS[name]||[])it.labels.push(makeTooltip(layer,name,pos,[0,0]))}
}}).addTo(map);
allBounds=allLayer.getBounds();map.fitBounds(allBounds,{padding:[10,10],animate:false});initialZoom=map.getZoom();fontScale();
$('status').textContent='比較試作：'+items.length+'町名を描画しました。町名を押すと点滅します。'+(items.length!==321?' ※想定321町名と差があります。':'');
}).catch(e=>{$('status').textContent='データの読み込みに失敗しました：'+e.message;console.error(e)});
map.on('zoomend',fontScale);
$('zoomIn').onclick=()=>map.zoomIn(1);$('zoomOut').onclick=()=>map.zoomOut(1);
$('reset').onclick=()=>{if(allBounds)map.fitBounds(allBounds,{padding:[10,10],animate:false})};
$('smaller').onclick=()=>{fontPct=Math.max(75,fontPct-25);$('size').textContent='文字 '+fontPct+'%';fontScale()};
$('larger').onclick=()=>{fontPct=Math.min(200,fontPct+25);$('size').textContent='文字 '+fontPct+'%';fontScale()};
$('size').onclick=()=>{fontPct=100;$('size').textContent='文字 100%';fontScale()};
$('reading').onclick=()=>{readingOn=!readingOn;$('reading').textContent='よみがな '+(readingOn?'ON':'OFF');$('reading').setAttribute('aria-pressed',String(readingOn));refreshLabels()};
$('search').addEventListener('input',candidateList);
$('fullscreen').onclick=()=>{document.body.classList.toggle('map-full');$('fullscreen').textContent=document.body.classList.contains('map-full')?'戻る':'全画面';setTimeout(()=>map.invalidateSize({animate:false}),50)};
document.addEventListener('pointerdown',e=>{if(!e.target.closest('#map'))map.scrollWheelZoom.disable()});
map.on('click',()=>map.scrollWheelZoom.enable());
})();
</script><script defer src="/common/site-footer.js"></script></body></html>
