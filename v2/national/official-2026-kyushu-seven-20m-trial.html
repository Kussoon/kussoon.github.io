:root{font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans",Meiryo,sans-serif;color:#173a54;background:#f1f8fc}*{box-sizing:border-box}body{margin:0}main{max-width:960px;margin:auto;padding:14px 12px 45px}h1{font-size:clamp(21px,4vw,29px)}.panel{background:#fff;border:1px solid #b9d0df;border-radius:13px;padding:13px;margin:12px 0}button,select{font:inherit;min-height:44px;border:1px solid #9bbacb;border-radius:8px;background:#fff;padding:7px 10px;color:inherit}button[aria-pressed=true]{background:#245d82;color:#fff}.controls{display:flex;flex-wrap:wrap;gap:7px;margin:9px 0}label{display:grid;gap:4px;font-weight:bold;flex:1 1 210px}svg{width:100%;height:auto;background:#edf6fb;border:1px solid #acc8da;border-radius:10px;display:block}.land{fill:#a8d5eb;stroke:white;stroke-width:1.1;stroke-linejoin:round;fill-rule:evenodd;cursor:pointer}.land.selected{fill:#ffc36e;stroke:none}.pref{fill:none;stroke:#376383;stroke-width:2.1;stroke-linejoin:round;pointer-events:none}.sel{fill:none;stroke:#88420f;stroke-width:2.5;pointer-events:none}.reference{fill:none;stroke:#e23636;stroke-width:1.5;stroke-dasharray:4 3;pointer-events:none}.note{font-size:13px;background:#fff7e7;padding:10px}.info{font-weight:700;background:#e6f1f8;padding:9px;border-radius:8px}table{border-collapse:collapse;width:100%;font-size:13px}td,th{border-bottom:1px solid #c9dbe5;padding:7px 4px;text-align:right}th:first-child,td:first-child{text-align:left}small{color:#526d7f}

/* Local minimal TopoJSON polygon decoder for this independent pilot.
   No CDN is required. Every shared arc is decoded once per topology. */
window.topojson=(()=>{
 function decode(t){const tr=t.transform;return t.arcs.map(a=>{let x=0,y=0;return a.map(p=>{if(tr){x+=p[0];y+=p[1];return [x*tr.scale[0]+tr.translate[0],y*tr.scale[1]+tr.translate[1]];}return [p[0],p[1]];});});}
 function ring(ids,arcs){const out=[];for(const id of ids){const a=arcs[id<0?~id:id];const pts=id<0?a.slice().reverse():a;out.push(...(out.length?pts.slice(1):pts));}return out;}
 function geometry(g,arcs){if(g.type==='Polygon')return {type:'Polygon',coordinates:g.arcs.map(r=>ring(r,arcs))};if(g.type==='MultiPolygon')return {type:'MultiPolygon',coordinates:g.arcs.map(poly=>poly.map(r=>ring(r,arcs)))};throw Error('Unsupported geometry: '+g.type);}
 function feature(t,obj){const arcs=decode(t);return {type:'FeatureCollection',features:obj.geometries.map(g=>({type:'Feature',properties:g.properties||{},id:g.id,geometry:geometry(g,arcs)}))};}
 function mesh(t,obj,filter){const arcs=decode(t),owners=new Map();for(const g of obj.geometries){const polygons=g.type==='Polygon'?[g.arcs]:g.type==='MultiPolygon'?g.arcs:[];for(const poly of polygons)for(const r of poly)for(const id of r){const k=id<0?~id:id;if(!owners.has(k))owners.set(k,[]);owners.get(k).push(g);}}
 const lines=[];for(const [id,gs] of owners){const unique=[...new Set(gs)];let include=false;if(unique.length===1)include=filter(unique[0],unique[0]);else for(let i=0;i<unique.length&&!include;i++)for(let j=i+1;j<unique.length;j++)if(filter(unique[i],unique[j])){include=true;break;}if(include)lines.push(arcs[id]);}
 return {type:'MultiLineString',coordinates:lines};}
 return {feature,mesh};
})();
</script></head>
<body><main><a href="./official-2026-shiga-kyoto-20m-trial.html">← 中国・四国9県の試作へ</a>
<h1>2026年・九州7県20m軽量配信試験</h1>
<p>九州7県の市区町村を、事前生成した20m版TopoJSONだけで表示します。精密版の読み込みや端末内での簡略化は行いません。</p>
<section class="panel"><div class="controls"><label>表示範囲<select id="area"><option value="sango">北部九州</option><option value="taishi">南部九州</option><option value="wide">九州7県（広域）</option></select></label>
<label>区域選択<select id="selection"><option value="40133">福岡市中央区</option><option value="42201">長崎市</option><option value="43101">熊本市中央区</option><option value="44201">大分市</option><option value="46201">鹿児島市</option><option value="">選択なし</option></select></label></div>
<svg id="map" viewBox="0 0 850 720" aria-label="2026年行政区域境界比較地図"></svg><p id="status" class="info" role="status">20m軽量データを読み込み中です。</p>
<small>軽量データのみを通信で取得します。地図をタップすると区域を選択できます。</small></section>
<section class="panel"><h2>計測結果</h2><div style="overflow-x:auto"><table><thead><tr><th>版</th><th>頂点数</th><th>JSON容量</th><th>読み込み時間</th><th>描画時間</th></tr></thead><tbody id="metrics"></tbody></table></div>
<p class="note">容量は配信する20m版TopoJSONの非圧縮UTF-8バイト数です。実際の転送量は圧縮・キャッシュに依存します。読み込み時間と描画時間は端末依存です。</p></section>
</main>
<script>
(()=>{'use strict';
const $=id=>document.getElementById(id),NS='http://www.w3.org/2000/svg',W=850,H=720;
const BOX={sango:[129.25,32.70,131.40,34.10],taishi:[129.30,30.75,132.35,32.85],wide:[127.40,26.15,132.60,34.35]};
const versions=new Map();let active=20;
function decode(t){const tr=t.transform;return t.arcs.map(arc=>{let x=0,y=0;return arc.map(pt=>{if(tr){x+=pt[0];y+=pt[1];return [x*tr.scale[0]+tr.translate[0],y*tr.scale[1]+tr.translate[1]];}return pt.slice(0,2);});});}
function dist2(p,a,b,lat){const cx=111320*Math.cos(lat*Math.PI/180),cy=111195,dx=(b[0]-a[0])*cx,dy=(b[1]-a[1])*cy,px=(p[0]-a[0])*cx,py=(p[1]-a[1])*cy,den=dx*dx+dy*dy;const t=den?Math.max(0,Math.min(1,(px*dx+py*dy)/den)):0;return (px-t*dx)**2+(py-t*dy)**2;}
function dp(points,m){if(m===0||points.length<=2)return points;if(points[0][0]===points[points.length-1][0]&&points[0][1]===points[points.length-1][1])return points;const keep=new Uint8Array(points.length);keep[0]=keep[points.length-1]=1;const stack=[[0,points.length-1]],lat=(points[0][1]+points[points.length-1][1])/2;
while(stack.length){const [a,b]=stack.pop();let best=-1,index=-1;for(let i=a+1;i<b;i++){const d=dist2(points[i],points[a],points[b],lat);if(d>best){best=d;index=i;}}if(best>m*m){keep[index]=1;stack.push([a,index],[index,b]);}}
const result=points.filter((_,i)=>keep[i]);return result.length>=2?result:points;}
function build(source,arcs,m){if(m===0)return source;const obj={type:'Topology',objects:source.objects,arcs:arcs.map(a=>dp(a,m))};if(source.bbox)obj.bbox=source.bbox;return obj;}
function count(t){return t.arcs.reduce((n,a)=>n+a.length,0);}
function auditArc(src,dst){let sum=0,max=0,over=0;const lat=src.reduce((n,p)=>n+p[1],0)/src.length;for(const p of src){let best=Infinity;for(let i=1;i<dst.length;i++){const d=dist2(p,dst[i-1],dst[i],lat);if(d<best)best=d;}const meters=Math.sqrt(best);sum+=meters;max=Math.max(max,meters);if(meters>20)over++;}return {sum,max,over,n:src.length};}
async function audit(sourceArcs){const body=$('audit');body.replaceChildren();for(const m of [5,10,20]){const arcs=versions.get(m).topo.arcs;let total=0,max=0,over=0,n=0;const started=performance.now();for(let i=0;i<sourceArcs.length;i++){const src=sourceArcs[i],dst=arcs[i];if(src.length===dst.length&&src.every((p,j)=>p[0]===dst[j][0]&&p[1]===dst[j][1])){n+=src.length;}else{const v=auditArc(src,dst);total+=v.sum;max=Math.max(max,v.max);over+=v.over;n+=v.n;}if(i%100===0){$('auditProgress').textContent=m+'mを検証中：'+i.toLocaleString()+'／'+sourceArcs.length.toLocaleString()+'アーク';await new Promise(r=>setTimeout(r,0));}}const tr=document.createElement('tr');for(const value of [m+'m',max.toFixed(2)+' m',(total/n).toFixed(2)+' m',over.toLocaleString(),n.toLocaleString()]){const td=document.createElement('td');td.textContent=value;tr.append(td);}body.append(tr);$('auditProgress').textContent=m+'m完了（'+(performance.now()-started).toFixed(0)+'ms）';} $('auditProgress').textContent='3種類の片方向距離検証が完了しました。';}

function project(box){const c=Math.cos((box[1]+box[3])/2*Math.PI/180),scale=Math.min((W-36)/((box[2]-box[0])*c),(H-40)/(box[3]-box[1])),lon=(box[0]+box[2])/2,lat=(box[1]+box[3])/2;return ([x,y])=>[W/2+(x-lon)*c*scale,H/2-(y-lat)*scale];}
function path(g,p){let s='';if(g.type==='MultiLineString'){for(const line of g.coordinates){line.forEach((xy,i)=>{const [x,y]=p(xy);s+=(i?'L':'M')+x.toFixed(2)+','+y.toFixed(2);});}return s;}const polys=g.type==='Polygon'?[g.coordinates]:g.type==='MultiPolygon'?g.coordinates:[];for(const poly of polys)for(const ring of poly){ring.forEach((xy,i)=>{const [x,y]=p(xy);s+=(i?'L':'M')+x.toFixed(2)+','+y.toFixed(2)});s+='Z';}return s;}
function bounds(g){let a=Infinity,b=Infinity,c=-Infinity,d=-Infinity;function walk(v){if(typeof v[0]==='number'){a=Math.min(a,v[0]);b=Math.min(b,v[1]);c=Math.max(c,v[0]);d=Math.max(d,v[1]);}else v.forEach(walk);}walk(g.coordinates);return [a,b,c,d];}
function svg(tag,attrs,parent=$('map')){const e=document.createElementNS(NS,tag);for(const [k,v] of Object.entries(attrs))e.setAttribute(k,v);parent.append(e);return e;}
function render(){const model=versions.get(20);if(!model)return;const begin=performance.now(),t=model.topo,obj=t.objects.municipalities,features=topojson.feature(t,obj).features,outline=topojson.mesh(t,obj,(a,b)=>a===b||String(a.properties.N03_007).slice(0,2)!==String(b.properties.N03_007).slice(0,2)),box=BOX[$('area').value],p=project(box),chosen=$('selection').value;const map=$('map');map.replaceChildren();const base=svg('g',{}),pref=svg('g',{}),reference=svg('g',{}),sel=svg('g',{});let drawn=0,selected=null;
for(const f of features){const b=bounds(f.geometry);if(b[0]>=box[2]||b[2]<=box[0]||b[1]>=box[3]||b[3]<=box[1])continue;const code=String(f.properties.N03_007),hit=code===chosen;svg('path',{d:path(f.geometry,p),class:'land'+(hit?' selected':''),'data-code':code,'data-name':f.properties.N03_004},base);if(hit)selected=f.geometry;drawn++;}
svg('path',{d:path(outline,p),class:'pref'},pref);if(false){const original=versions.get(20).topo,originalFeatures=topojson.feature(original,original.objects.municipalities).features;for(const f of originalFeatures){const b=bounds(f.geometry);if(b[0]>=box[2]||b[2]<=box[0]||b[1]>=box[3]||b[3]<=box[1])continue;svg('path',{d:path(f.geometry,p),class:'reference'},reference);}}if(selected)svg('path',{d:path(selected,p),class:'sel'},sel);
model.renderMs=performance.now()-begin;$('status').textContent='20m軽量配信版'+'：表示区域 '+drawn+'／全'+obj.geometries.length+'区域。描画 '+model.renderMs.toFixed(1)+'ms。';document.querySelectorAll('[data-t]').forEach(b=>b.setAttribute('aria-pressed',String(Number(b.dataset.t)===active)));metrics();}
function metrics(){const tbody=$('metrics');tbody.replaceChildren();for(const m of [20]){const d=versions.get(m);if(!d)continue;const tr=document.createElement('tr');for(const val of [m===0?'20m版':m+'m',d.vertices.toLocaleString(),(d.bytes/1024).toFixed(1)+' KB',d.buildMs.toFixed(1)+' ms',d.renderMs===undefined?'未計測':d.renderMs.toFixed(1)+' ms']){const td=document.createElement('td');td.textContent=val;tr.append(td);}tbody.append(tr);}}
async function load(){if(!window.topojson)throw Error('TopoJSONライブラリが利用できません');const started=performance.now();const response=await fetch('../data/national/2026-common/kyushu-seven-20m.topojson');if(!response.ok)throw Error('HTTP '+response.status);const raw=await response.text();const bytes=new TextEncoder().encode(raw).length;const t=JSON.parse(raw),obj=t.objects.municipalities;if(obj.geometries.length<180)throw Error('区域数が想定より少なすぎます');versions.set(20,{topo:t,vertices:count(t),bytes,buildMs:performance.now()-started});render();}
$('area').addEventListener('change',render);$('selection').addEventListener('change',render);$('map').addEventListener('click',e=>{const el=e.target.closest('[data-code]');if(!el)return;const code=el.dataset.code,select=$('selection');if(![...select.options].some(o=>o.value===code)){const opt=document.createElement('option');opt.value=code;opt.textContent=el.dataset.name+'（'+code+'）';select.append(opt);}select.value=code;render();});
load().catch(e=>{$('status').textContent='読み込みに失敗しました：'+e.message;console.error(e);});
})();
</script></body></html>
