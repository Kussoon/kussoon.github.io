<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>全国市区町村マップ｜吹き出し操作の比較試作</title>
<style>
:root{color-scheme:light;--ink:#183b50;--blue:#245c78;--line:#b9ceda;--bg:#eef5f8}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Noto Sans JP",sans-serif}
main{max-width:1120px;margin:auto;padding:12px}
h1{font-size:clamp(20px,4vw,28px);margin:4px 0 8px}
p{margin:4px 0 10px;line-height:1.6}
.mode-row,.sample-row{display:flex;flex-wrap:wrap;gap:7px;margin:8px 0}
button{min-height:44px;padding:8px 12px;border:1px solid #9db8c7;border-radius:8px;background:#fff;color:var(--ink);font:inherit;font-weight:700;cursor:pointer}
button[aria-pressed=true]{background:#245c78;color:#fff;border-color:#245c78}
button:focus-visible,a:focus-visible{outline:3px solid #e0a933;outline-offset:2px}
.sample-row button{font-size:14px}
.note{font-size:13px;color:#405f70}
.frame-shell{margin-top:8px;border:1px solid var(--line);border-radius:12px;background:#fff;padding:6px}
iframe{display:block;width:100%;height:min(780px,calc(100dvh - 195px));min-height:560px;border:0;border-radius:8px;background:#edf6fb}
@media(max-width:600px){main{padding:8px}.frame-shell{padding:3px;border-radius:9px}iframe{height:max(570px,calc(100dvh - 225px));min-height:570px}.sample-row{gap:5px}.sample-row button{flex:1 1 calc(50% - 5px);padding-inline:6px}}
</style>
</head>
<body>
<main>
<h1>吹き出し操作の比較試作</h1>
<p>地図本体は正式ページと同じものです。上の切替で現行表示と試作表示を比べ、自治体を選んでグリップ・折り畳み・閉じる操作をお試しください。</p>
<div class="mode-row" role="group" aria-label="吹き出し表示方式">
<button id="currentMode" type="button" aria-pressed="false">現行表示</button>
<button id="trialMode" type="button" aria-pressed="true">試作表示</button>
<a href="/maps/national-municipalities.html" target="_blank" rel="noopener"><button type="button">正式ページを別タブで開く</button></a>
</div>
<p class="note" id="modeNote">試作表示では、タイトル左の点をつかんで上下移動できます。右の山形ボタンで本文を折り畳み、×で閉じます。折り畳み中に別の自治体を選ぶと、その情報を見られるよう展開します。</p>
<div class="sample-row" role="group" aria-label="確認用自治体">
<button type="button" data-pref="28" data-code="28204">西宮市・3リンク</button>
<button type="button" data-pref="28" data-code="28110">神戸市中央区・6リンク</button>
<button type="button" data-pref="13" data-code="13104">東京都新宿区</button>
<button type="button" data-pref="01" data-code="01400">虻田郡倶知安町</button>
<button type="button" data-pref="02" data-code="02408">上北郡東北町</button>
</div>
<div class="frame-shell"><iframe id="mapPreview" title="全国市区町村マップ吹き出し比較"></iframe></div>
</main>
<script src="/v2/national/popup-controls-trial.js?v=20261110-1"></script>
</body>
</html>
