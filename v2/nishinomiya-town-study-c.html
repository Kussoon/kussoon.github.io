  if(parts.length!==(co==='上ヶ原'?4:2))throw Error('上甲東園の丁目区分が不一致: '+co);
  const f=topojson.merge(subtopology,parts);
  f.properties={S_NAME:'上甲東園',community:co};
  const overlay=L.geoJSON(f,{style:normal}).getLayers()[0];
  if(!overlay)throw Error('分割区域が空です: '+co);
  overlay.on('click',()=>choose(town,false));
  town.regionLayers[co]=overlay;
  town.labels.push(makeTooltip(overlay,'上甲東園',null,[0,0]));
 }
}
function specialBoundaryNote(){
 const note=$('regionBoundaryNote');
 const relevant=communityChoice==='上ヶ原'||communityChoice==='広田';
 note.hidden=!relevant;
 if(relevant)note.textContent=okadaExplanation()+' 番地ごとの境界線は描かず、紫色で町全体を表示します。';
}
/* 地域以外の町域とラベルを地図レイヤーから外す。ラベル位置・縮尺計算はB版のまま。 */
function syncRegionLayers(){
 const visible=new Set(scopeItems());
 for(const it of items){
  const show=visible.has(it);
  const desired=(communityChoice&&it.regionLayers?.[communityChoice])||it.fullLayer||it.layer;
  if(desired!==it.layer){
   if(allLayer.hasLayer(it.layer))allLayer.removeLayer(it.layer);
   it.layer=desired;
  }
  const attached=allLayer.hasLayer(it.layer);
  if(show&&!attached)allLayer.addLayer(it.layer);
  else if(!show&&attached)allLayer.removeLayer(it.layer);
  if(it.name==='岡田山'&&show)it.layer.setStyle(communityBaseStyle(it));
  for(const marker of it.labels){
   if(it.layer.getTooltip()===marker||it.fullLayer?.getTooltip()===marker||Object.values(it.regionLayers||{}).some(l=>l.getTooltip()===marker))continue;
   if(show&&!map.hasLayer(marker))marker.addTo(map);
   else if(!show&&map.hasLayer(marker))map.removeLayer(marker);
  }
 }
}
function showRegion(){stopQuiz(false);endBlink();syncRegionLayers();specialBoundaryNote();$('reset').textContent=communityChoice?'区域全体':'市の全体';const its=scopeItems();if(its.length)map.fitBounds(regionBounds(its),{padding:[22,22],animate:false});$('communityCount').textContent=communityChoice?(regionLabel(communityChoice)+'：'+its.length+'町名'):'市全域：'+items.length+'町名';$('communitySelected').textContent=communityChoice?regionLabel(communityChoice):'西宮市全域（321町名）';for(const button of $('communityOptions').querySelectorAll('button')){const selected=button.dataset.community===communityChoice;button.classList.toggle('active',selected);button.setAttribute('aria-pressed',String(selected))}}
function closeCommunityOptions(){ $('communityOptions').hidden=true;$('communitySelect').setAttribute('aria-expanded','false') }
function readyStudy(){
 if(communities.length!==26||communities.some(co=>!COMMUNITY_READINGS[co]))throw Error('26地域の読み仮名が不足しています');
 const menu=$('communityOptions');
 for(const co of ['',...communities]){
  const button=document.createElement('button');button.type='button';button.dataset.community=co;
  if(co){const name=document.createElement('strong');name.textContent=co;const reading=document.createElement('small');reading.className='community-reading';reading.textContent=COMMUNITY_READINGS[co];button.append(name,reading)}
  else button.textContent='西宮市全域';
  button.addEventListener('click',()=>{communityChoice=co;closeCommunityOptions();showRegion();$('communitySelect').focus()});
  menu.appendChild(button);
 }
 $('communitySelect').disabled=false;
 for(const id of ['quizOne','quizTwo'])$(id).disabled=false;showRegion();
}
function clearQuizBlink(){if(quizTimer!==null)clearInterval(quizTimer);quizTimer=null;if(selected){selected.layer.setStyle(communityBaseStyle(selected));selected=null}quizBlink=false}
function stopQuiz(back){endBlink();clearQuizBlink();quizMode=0;quizLocked=false;document.body.classList.remove('town-quiz-mode');$('quizPanel').hidden=true;$('quizResults').hidden=true;if(back)showRegion()}
function resetQuiz(){clearQuizBlink();quizWrongPlaces.clear();for(const it of items)it.layer.setStyle(communityBaseStyle(it));$('quizChoices').replaceChildren();$('quizNext').hidden=true;$('quizReveal').hidden=true;$('quizFeedback').textContent=''}
function startQuiz(mode,forcedNames){stopQuiz(false);syncRegionLayers();quizMode=mode;document.body.classList.add('town-quiz-mode');quizLastMode=mode;quizScope=communityChoice;const pool=forcedNames?.length?forcedNames:scopeItems().map(it=>it.name);quizOrder=shuffleQuiz(pool);quizOriginalOrder=pool.slice();quizIndex=0;quizScore=quizOrder.length;quizWrong=new Set();$('quizResults').hidden=true;$('quizPanel').hidden=false;loadQuizQuestion()}
function choiceCandidates(target){const it=items.find(x=>x.name===target);const others=scopeItems().filter(x=>x.name!==target),allOthers=items.filter(x=>x.name!==target);const pool=new Set(),order=[];const add=arr=>{for(const x of arr){if(!pool.has(x.name)&&x.name!==target){pool.add(x.name);order.push(x.name)}}};const distance=x=>map.distance(it.layer.getBounds().getCenter(),x.layer.getBounds().getCenter());const rank=a=>[...a].sort((a,b)=>distance(a)-distance(b));const direct=allOthers.filter(x=>adjacency.get(target)?.has(x.name));add(rank(direct.filter(x=>communityByTown.get(x.name)===communityByTown.get(target))));add(rank(direct));add(rank(others.filter(x=>communityByTown.get(x.name)===communityByTown.get(target))));add(rank(others));add(rank(allOthers));return shuffleQuiz([target,...order.slice(0,3)])}
function loadQuizQuestion(){if(quizIndex>=quizOrder.length){finishQuiz();return}quizLocked=false;resetQuiz();const target=quizOrder[quizIndex],it=items.find(x=>x.name===target);$('quizProgress').textContent=(quizIndex+1)+' / '+quizOrder.length+'問　得点 '+quizScore;
if(quizIndex===0){const bounds=communityChoice?regionBounds(scopeItems()):allBounds;if(bounds)map.fitBounds(bounds,{padding:[22,22],animate:false});}
if(quizMode===1){$('quizQuestion').textContent='「'+quizTownName(target)+'」の場所を押してください。';$('quizFeedback').textContent='地図の区域を押してください。';$('quizReveal').hidden=false;}
else{$('quizQuestion').textContent='黄色く点滅する町名を選んでください。';const choices=choiceCandidates(target);for(const name of choices){const button=document.createElement('button');button.type='button';button.textContent=quizTownName(name);button.onclick=()=>quizChoiceAnswer(name,button);$('quizChoices').append(button)}startQuizBlink(it);}
}
function startQuizBlink(it){clearQuizBlink();selected=it;quizBlink=true;it.layer.setStyle(highlight);quizTimer=setInterval(()=>{quizBlink=!quizBlink;it.layer.setStyle(quizBlink?highlight:communityBaseStyle(it))},500)}
function quizMapAnswer(it){if(quizMode!==1||quizLocked)return;const target=quizOrder[quizIndex];if(it.name!==target){if(quizWrongPlaces.has(it.name))return;quizScore=Math.max(0,quizScore-1);quizWrong.add(target);quizWrongPlaces.add(it.name);$('quizFeedback').textContent='違います。そこは「'+quizTownName(it.name)+'」です。';it.layer.setStyle(wrongFill);$('quizProgress').textContent=(quizIndex+1)+' / '+quizOrder.length+'問　得点 '+quizScore;return}quizCorrect(it)}
function quizChoiceAnswer(name,button){if(quizMode!==2||quizLocked||button.disabled)return;const target=quizOrder[quizIndex];if(name!==target){quizScore=Math.max(0,quizScore-1);quizWrong.add(target);button.disabled=true;button.classList.add('quiz-wrong');$('quizFeedback').textContent='違います。「'+quizTownName(name)+'」ではありません。もう一度選んでください。';$('quizProgress').textContent=(quizIndex+1)+' / '+quizOrder.length+'問　得点 '+quizScore;return}quizCorrect(items.find(x=>x.name===name));button.classList.add('quiz-correct');for(const b of $('quizChoices').children)b.disabled=true}
function quizCorrect(it){quizLocked=true;clearQuizBlink();it.layer.setStyle(highlight);$('quizFeedback').textContent='正解です！ '+quizTownName(it.name)+(it.name==='岡田山'&&communityChoice?' '+okadaExplanation():'');$('quizReveal').hidden=true;$('quizNext').hidden=false;$('quizProgress').textContent=(quizIndex+1)+' / '+quizOrder.length+'問　得点 '+quizScore}
function quizReveal(){if(quizLocked)return;quizScore=Math.max(0,quizScore-1);const name=quizOrder[quizIndex];quizWrong.add(name);quizCorrect(items.find(x=>x.name===name));$('quizFeedback').textContent='答えは「'+quizTownName(name)+'」です。'+(name==='岡田山'&&communityChoice?' '+okadaExplanation():'')}
function finishQuiz(quitEarly=false){
 const answered=quizIndex+(quizLocked?1:0);
 resetQuiz();quizMode=0;document.body.classList.remove('town-quiz-mode');
 $('quizPanel').hidden=true;$('quizResults').hidden=false;
 $('quizResult').textContent=quitEarly
  ?'途中終了：'+answered+' / '+quizOrder.length+'問終了（間違えた問題 '+quizWrong.size+'件）'
  :quizOrder.length+'問中 '+quizScore+'点（間違えた問題 '+quizWrong.size+'件）';
 $('quizRetryWrong').hidden=false;
 $('quizRetryWrong').disabled=quizWrong.size===0;
}
$('communitySelect').onclick=()=>{const panel=$('communityOptions');panel.hidden=!panel.hidden;$('communitySelect').setAttribute('aria-expanded',String(!panel.hidden))};
document.addEventListener('pointerdown',e=>{if(!$('communityOptions').hidden&&!e.target.closest('#communityOptions')&&!e.target.closest('#communitySelect'))closeCommunityOptions()});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('communityOptions').hidden){closeCommunityOptions();$('communitySelect').focus()}});
$('quizOne').onclick=()=>startQuiz(1);
$('quizTwo').onclick=()=>startQuiz(2);
$('quizReveal').onclick=quizReveal;
$('quizNext').onclick=()=>{quizIndex++;loadQuizQuestion()};
$('quizQuit').onclick=()=>finishQuiz(true);
$('quizRetryWrong').onclick=()=>startQuiz(quizLastMode,[...quizWrong]);
$('quizRetryAll').onclick=()=>startQuiz(quizLastMode);
$('quizBack').onclick=()=>stopQuiz(true);

Promise.all([fetch('/v2/data/nishinomiya-town-v2-premerged.topojson').then(r=>{if(!r.ok)throw Error('事前統合済み町域データ');return r.json()}),fetch('/nishinomiya/data/community-town-map.json').then(r=>{if(!r.ok)throw Error('コミュニティデータ');return r.json()}),fetch('/v2/data/nishinomiya-uekoto-community.topojson').then(r=>{if(!r.ok)throw Error('上甲東園の地域分割データ');return r.json()})])
.then(([topology,mapping,subtopology])=>{
const features=topojson.feature(topology,topology.objects.town).features;initStudyData(topology,mapping);
allLayer=L.geoJSON({type:'FeatureCollection',features},{style:normal,onEachFeature:(f,layer)=>{
const name=f.properties.S_NAME,it={name,layer,labels:[]};items.push(it);layer.on('click',()=>choose(it,false));
const multiple=MULTI_LABELS[name];if(multiple){for(const pos of multiple)it.labels.push(makeTooltip(layer,name,pos,[0,0]))}
else{it.labels.push(makeTooltip(layer,name,null,LABEL_OFFSETS[name]||[0,0]));for(const pos of EXTRA_LABELS[name]||[])it.labels.push(makeTooltip(layer,name,pos,[0,0]))}
}}).addTo(map);
allBounds=allLayer.getBounds();map.fitBounds(allBounds,{padding:[10,10],animate:false});initialZoom=map.getZoom();fontScale();initRegionalShapes(subtopology);readyStudy();
$('status').textContent='地域学習C版：'+items.length+'町名、初回表示 '+Math.round(performance.now()-bootStart)+'ms。町名を押すと点滅します。'+(items.length!==321?' ※想定321町名と差があります。':'');
}).catch(e=>{$('status').textContent='データの読み込みに失敗しました：'+e.message;console.error(e)});
map.on('zoomend',fontScale);
$('zoomIn').onclick=()=>map.zoomIn(1);$('zoomOut').onclick=()=>map.zoomOut(1);
$('reset').onclick=()=>{if(communityChoice){endBlink();const its=scopeItems();if(its.length)map.fitBounds(regionBounds(its),{padding:[22,22],animate:false})}else if(allBounds)map.fitBounds(allBounds,{padding:[22,22],animate:false})};
$('smaller').onclick=()=>{fontPct=Math.max(75,fontPct-25);$('size').textContent='文字 '+fontPct+'%';fontScale()};
$('larger').onclick=()=>{fontPct=Math.min(200,fontPct+25);$('size').textContent='文字 '+fontPct+'%';fontScale()};
$('size').onclick=()=>{fontPct=100;$('size').textContent='文字 100%';fontScale()};
$('reading').onclick=()=>{readingOn=!readingOn;$('reading').textContent='よみがな '+(readingOn?'ON':'OFF');$('reading').setAttribute('aria-pressed',String(readingOn));refreshLabels()};
$('fullscreen').onclick=()=>{document.body.classList.toggle('map-full');$('fullscreen').textContent=document.body.classList.contains('map-full')?'戻る':'全画面';setTimeout(()=>map.invalidateSize({animate:false}),50)};
document.addEventListener('pointerdown',e=>{if(!e.target.closest('#map'))map.scrollWheelZoom.disable()});
map.on('click',()=>map.scrollWheelZoom.enable());
})();
