<body><main><p><a href="/v2/">← V2試験トップ</a></p><h1>西宮市4町：ラベル配置候補の比較</h1>
<p>既存の西宮市町域TopoJSONを使用し、すみれ台・宝生ケ丘・仁川町・一ケ谷町を<strong>丁目統合の町単位</strong>で表示します。いずれの候補も地形から自動計算し、表示位置は固定します。</p>
<div class="controls"><label>配置方法<select id="method"><option value="multi" selected>複数水平断面から選ぶ（新案）</option><option value="mid">南北中央の水平断面</option><option value="poly">Polylabel（基準）</option></select></label><label>文字サイズ<input id="size" type="range" min="10" max="24" value="16"><output id="fontsize">16px</output></label><label>候補点<select id="dots"><option value="on">3方式を表示</option><option value="off">非表示</option></select></label></div>
<p id="status" role="status">町域データを読み込み中です…</p><div id="cards" class="cards"></div>
<p class="small">色点：橙＝Polylabel、紫＝南北中央、緑＝複数断面。いずれも各町域内部の点です。一般地図サービスの実際のラベル位置を模写・転載したものではありません。</p>
<p class="small">地理データ：<a href="/nishinomiya/all-area-labeled.html">西宮市全域町名図</a>と同じ町域TopoJSONを利用。出典・ライセンスは西宮市リポジトリの出典台帳を参照してください。</p></main></body></html>
