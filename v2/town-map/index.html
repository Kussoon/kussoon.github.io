<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,follow"><title>Kussoon V2 町名マップ｜比較試作</title><style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans",Meiryo,sans-serif;color:#163750;background:#f2f8fc}*{box-sizing:border-box}body{margin:0}main{max-width:1120px;margin:auto;padding:13px}h1{font-size:clamp(22px,4vw,30px);margin:8px 0}.note{font-size:13px;color:#425c71}.tools{display:flex;gap:7px;align-items:center;flex-wrap:wrap;margin:12px 0}button,input{font:inherit;min-height:42px;border-radius:7px;border:1px solid #94b3c5;background:#fff;padding:7px}button{cursor:pointer}input{width:min(100%,270px)}#mapWrap{border:1px solid #a9c5d5;border-radius:12px;position:relative;overflow:hidden;background:#eaf5fb}#map{width:100%;height:min(67vh,650px);min-height:360px;display:block;touch-action:none}.map-controls{position:absolute;right:8px;bottom:8px;z-index:5;display:flex;flex-direction:column;gap:5px;width:108px}.map-controls button{min-height:40px;background:#fff;color:#163750;font-weight:700;box-shadow:0 1px 4px #56778966;font-size:13px}.zoom{display:grid;grid-template-columns:1fr 1fr;gap:5px}.region{stroke:#375f79;stroke-width:.75;fill:#f6d28b;vector-effect:non-scaling-stroke;cursor:pointer}.region:nth-child(2n){fill:#f5dfa7}.region.active{fill:#ff9b61;stroke:#a74619;stroke-width:2}.label{font-size:12px;font-weight:700;paint-order:stroke;stroke:#fff;stroke-width:2.6;stroke-linejoin:round;fill:#15354a;pointer-events:auto;cursor:pointer}.reading{font-size:.7em;stroke-width:2}#matches{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:12px}#matches button{font-size:13px;min-height:38px;padding:6px 9px}#status,#selected{font-size:14px;margin:8px 0;min-height:1.5em}.warning{border:1px solid #d8c390;background:#fff7df;padding:10px;border-radius:8px}@media(max-width:550px){#map{height:60vh;min-height:320px}.map-controls{width:102px}}
</style></head><body><main><h1 id="title">町名マップ（共通エンジン比較試作）</h1><p class="warning">比較試作・noindexです。CODH/e-Statの2020年統計境界を使用しており、現行住所境界を保証しません。正式ページ・既存5市・全国V2は変更していません。</p><div class="tools"><label>地名検索 <input id="search" type="search" placeholder="例：中央町、小花 ※最大35件表示"></label><label><input id="labels" type="checkbox" checked>町名表示</label><label><input id="readings" type="checkbox">読み仮名</label></div><div id="matches" aria-label="検索候補"></div><div id="mapWrap"><svg id="map" viewBox="0 0 1000 650" role="img" aria-label="町丁・字境界図"><g data-layer="shapes"></g><g data-layer="labels"></g></svg><div class="map-controls"><div class="zoom"><button id="plus" type="button">＋</button><button id="minus" type="button">−</button></div><div class="zoom"><button id="smaller" type="button">文字 −</button><button id="larger" type="button">文字 ＋</button></div><button id="size" type="button">文字 100%</button><button id="reset" type="button">市全体</button></div></div><p id="status" role="status">データを読み込み中です…</p><p id="selected" aria-live="polite">区域を選ぶと名称を表示します。</p><p id="note" class="note"></p></main><script src="../common/js/label-engine.js?v=town-map-20261114-2"></script><script src="../common/js/readable-labels.js?v=town-map-20261114-2"></script><script src="../progressive-preview/map-viewport.js?v=town-map-20261114-2"></script><script src="../common/js/town-map-engine.js?v=town-map-20261114-2"></script><script>
(async()=>{const q=new URLSearchParams(location.search),code=q.get('code')||'28217';try{const r=await fetch('../data/town-maps/'+encodeURIComponent(code)+'.json',{cache:'no-store'});if(!r.ok)throw Error('データ取得失敗 '+r.status);const d=await r.json();document.title=d.municipalityName+' 町名マップ｜共通エンジン比較試作｜Kussoon';document.getElementById('title').textContent=d.municipalityName+' 町名マップ（共通エンジン比較試作）';document.getElementById('map').setAttribute('aria-label',d.municipalityName+'の2020年町丁・字境界図');document.getElementById('note').textContent='境界出典：'+d.source.name+'（'+d.source.doi+'、'+d.source.license+'）。読み仮名：'+d.readingSource.name+'照合済み'+d.readingSource.matchedCount+'/'+d.kana.nameEntryCount+'候補。統計区画数と表示地名数は異なります。2020年統計境界は現行住所境界と一致するとは限りません。';KussoonV2TownMap.create({svg:document.getElementById('map'),topo:d.topo,kana:d.kana,controls:{plus:document.getElementById('plus'),minus:document.getElementById('minus'),smaller:document.getElementById('smaller'),larger:document.getElementById('larger'),size:document.getElementById('size'),reset:document.getElementById('reset'),search:document.getElementById('search'),labels:document.getElementById('labels'),readings:document.getElementById('readings')}});const town=q.get('town');if(town){const input=document.getElementById('search');input.value=town;input.dispatchEvent(new Event('input'));}}catch(e){document.getElementById('status').textContent='データを読み込めませんでした。'+e.message;console.error(e);}})();
</script></body></html>
