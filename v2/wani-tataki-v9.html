<script>(()=>{

const crocodile='<svg viewBox="0 0 270 125" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><defs><linearGradient id="cGreen" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#39db75"/><stop offset="1" stop-color="#0b873c"/></linearGradient><linearGradient id="cRed" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#f35964"/><stop offset=".55" stop-color="#be2643"/><stop offset="1" stop-color="#791a31"/></linearGradient></defs><path d="M2 29Q20 10 53 17L96 22L112 96Q53 119 17 95Q2 84 2 29Z" fill="#16994d" stroke="#136a34" stroke-width="5"/><g class="jaw-open"><path d="M77 49Q119 39 177 42L247 39Q264 38 269 51Q268 75 241 88Q179 125 104 111Q77 103 69 81Z" fill="url(#cRed)" stroke="#75182c" stroke-width="5"/><ellipse cx="167" cy="80" rx="52" ry="21" fill="#8f1630" opacity=".8"/><path d="M97 93Q165 117 256 74" fill="none" stroke="#f99189" stroke-width="8"/><path d="M73 87Q119 114 177 113Q225 109 267 70Q257 104 227 117Q157 133 93 116Q76 109 70 97Z" fill="url(#cGreen)" stroke="#146934" stroke-width="4"/><path d="M88 96L96 83L107 103M116 108L124 93L134 111M146 114L156 98L166 113M182 110L192 93L201 106M218 100L230 81L238 92" fill="#fffce9" stroke="#efeddd" stroke-width="2" stroke-linejoin="round"/><path d="M71 41Q88 21 129 19Q193 21 249 30Q263 33 268 51Q261 61 240 61L123 60Q82 60 71 46Z" fill="url(#cGreen)" stroke="#136934" stroke-width="5"/><path d="M108 57L116 72L124 58M137 59L146 73L156 59M170 60L179 75L188 60M205 60L214 74L225 59M238 60L246 69L255 57" fill="#fffdec" stroke="#dfe8d8" stroke-width="1.7" stroke-linejoin="round"/></g><g class="jaw-closed"><path d="M72 55Q98 41 140 40L248 40Q266 44 269 58Q269 76 247 79L124 81Q94 79 72 67Z" fill="url(#cGreen)" stroke="#136a34" stroke-width="5"/><path d="M93 66Q153 72 257 65" fill="none" stroke="#166832" stroke-width="4"/><path d="M118 69L126 76L133 70M157 70L164 78L170 70M203 69L211 77L217 69" fill="#fff9e5"/></g><ellipse cx="103" cy="31" rx="22" ry="23" fill="#1fbb5c" stroke="#176c36" stroke-width="4"/><ellipse cx="153" cy="30" rx="22" ry="24" fill="#1fbb5c" stroke="#176c36" stroke-width="4"/><g class="eyes-normal"><ellipse cx="106" cy="29" rx="13" ry="16" fill="#f6fff0"/><ellipse cx="154" cy="29" rx="13" ry="16" fill="#f6fff0"/><ellipse cx="111" cy="30" rx="6" ry="9" fill="#256635"/><ellipse cx="159" cy="30" rx="6" ry="9" fill="#256635"/><circle cx="112" cy="26" r="2.4" fill="white"/><circle cx="160" cy="26" r="2.4" fill="white"/></g><g class="eyes-hit" stroke="#173d24" stroke-width="6" stroke-linecap="round"><path d="M94 20L116 41M116 20L94 41M143 20L165 41M165 20L143 41"/></g><circle cx="238" cy="49" r="4" fill="#136a32"/><circle cx="256" cy="49" r="4" fill="#136a32"/><ellipse cx="80" cy="64" rx="9" ry="7" fill="#ffaa9e" opacity=".7"/></svg>';
const lanes=Array.from({length:5},(_,i)=>{const lane=document.createElement('div');lane.className='lane';lane.innerHTML='<span class="num">0'+(i+1)+'</span><div class="grass"></div><div class="hole"></div>';const croc=document.createElement('button');croc.type='button';croc.className='croc';croc.innerHTML=crocodile;croc.setAttribute('aria-label',(i+1)+'段目のワニ');lane.append(croc);$('field').append(lane);return {lane,croc,active:false,hit:false,born:0,life:0,exposure:0,hitWord:null}});
let mode='ready',score=0,best=0,remaining=17,t=0,lastWall=0,raf=0,nextEvent=450,events=[],lastLane=-1,muted=true,audio=null,stage='normal',stageClock=0,endTimer=null;
try{best=Number(localStorage.getItem('kussoon-wani-tataki-v9-best'))||0}catch{}
const rnd=(a,b)=>a+Math.random()*(b-a);
const pickExposure=(multi)=>stage==='frenzy'?(Math.random()<.7?1:.5):multi?(Math.random()<.7?1:.5):((r)=>r<.7?1:r<.9?.5:.3)(Math.random());

function idle(l){l.active=false;l.hit=false;l.croc.classList.remove('live','hit');l.croc.style.left='-300px'}

function showDialog(title,body,button,canClose){$('dialogTitle').textContent=title;$('dialogMessage').textContent=body;$('play').textContent=button;$('closeDialog').hidden=!canClose;$('overlay').hidden=false}
function updateButtons(){$('start').textContent=mode==='playing'?'プレイ中':mode==='ending'?'終了演出中':mode==='ended'?'もう一度':'スタート';$('start').disabled=mode==='ending'||mode==='playing';$('reset').disabled=mode==='ending';$('pause').disabled=!(mode==='playing'||mode==='paused');$('pause').textContent=mode==='paused'?'再開':'一時停止'}
function end(){
 $('challenge').hidden=true;mode='ending';cancelAnimationFrame(raf);remaining=0;hud();clearField();events=[];updateButtons();
 $('message').textContent='ゲーム終了！';$('overlay').hidden=true;$('endScreen').hidden=false;

  if(mode!=='ending')return;
  $('endScreen').hidden=true;mode='ended';updateButtons();
  showDialog('ゲーム終了！','今回 '+score+'点！　ベスト '+best+'点','もう一度遊ぶ',true);
 },5000);
}
function reset(){if(mode==='ending')return;clearTimeout(endTimer);$('endScreen').hidden=true;cancelAnimationFrame(raf);mode='ready';stage='normal';stageClock=0;$('challenge').hidden=true;score=0;remaining=17;t=0;events=[];clearField();hud();updateButtons();$('message').textContent='右の草むらから出るワニをタップ！';showDialog('ワニたたき','左の草むらから右へ飛び出すワニをタップ！ 17秒のあと怒涛モード！ 何点取れるかな？','ゲームスタート',true)}
function start(){if(mode==='ending')return;clearTimeout(endTimer);$('endScreen').hidden=true;cancelAnimationFrame(raf);mode='playing';stage='normal';stageClock=0;$('challenge').hidden=true;score=0;remaining=17;t=0;events=[];nextEvent=400;clearField();hud();$('overlay').hidden=true;updateButtons();$('message').textContent='左から出てくるワニをタップ！';lastWall=performance.now();raf=requestAnimationFrame(frame)}
function pause(){if(mode==='playing'){mode='paused';cancelAnimationFrame(raf);$('message').textContent='一時停止中';updateButtons();}else if(mode==='paused'){mode='playing';lastWall=performance.now();$('message').textContent='再開！';updateButtons();raf=requestAnimationFrame(frame)}}
function queue(at,indices){events.push({at,indices});events.sort((a,b)=>a.at-b.at)}
function wave(){if(stage==='frenzy'){const possible=[0,1,2,3,4].filter(i=>!lanes[i].active);if(possible.length){const pick=possible[Math.floor(Math.random()*possible.length)];queue(t,[pick]);}nextEvent=t+rnd(135,270);return}const c=config[$('level').value];let n=1,r=Math.random();if(r<c.triple)n=3;else if(r<c.triple+c.double)n=2;
const indices=[0,1,2,3,4];for(let i=indices.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[indices[i],indices[j]]=[indices[j],indices[i]]}queue(t,indices.slice(0,n));lastLane=indices[0];
const burst=Math.random()<c.burst;
if(burst){ // five crocodiles, sequentially across five lanes
 const order=[0,1,2,3,4];for(let i=order.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[order[i],order[j]]=[order[j],order[i]]}
 const base=t+350;for(let i=0;i<5;i++)queue(base+i*rnd(250,330),[order[i]]);
 nextEvent=t+2600;
}else{nextEvent=t+rnd(...c.gap);if(Math.random()<c.pause)nextEvent=t+1900+rnd(0,400)}
}
function appear(indices){const c=config[$('level').value];for(const i of indices){const l=lanes[i];if(l.active)continue;l.active=true;l.hit=false;l.born=t;l.life=stage==='frenzy'?rnd(440,700):rnd(...c.stay);l.exposure=pickExposure(indices.length>1);l.croc.classList.add('live');l.croc.classList.remove('hit')}}
function draw(l){const u=(t-l.born)/l.life;if(u>=1){idle(l);return}
const p=l.hit?Math.max(0,1-(t-l.hitAt)/420):u<.19?u/.19:u<.7?1:Math.max(0,(1-u)/.3);
const w=l.lane.clientWidth,head=l.croc.offsetWidth||170;const boundary=w*.5;const max=Math.min(head*l.exposure,w-boundary-4);const visible=max*p;
// head starts concealed within left hillside, extends RIGHT; leftmost part of head is hidden beneath mask
l.croc.style.left=(boundary-head+visible)+'px';
}
function frame(now){
 if(mode!=='playing')return;
 const delta=Math.min(100,Math.max(0,now-lastWall));lastWall=now;
 if(stage==='announcement'||stage==='silence'){
  stageClock+=delta;
  if(stage==='announcement'&&stageClock>=3000){
   stage='silence';stageClock=0;$('challenge').hidden=true;$('message').textContent='あと少しで連続モード！';
  }else if(stage==='silence'&&stageClock>=2000){
   stage='frenzy';stageClock=0;t=0;remaining=10;nextEvent=0;events=[];$('message').textContent='連続モード！ ひたすら叩け！';$('challenge').hidden=true;
  }
  hud();raf=requestAnimationFrame(frame);return;
 }
 t+=delta;
 const limit=stage==='frenzy'?10000:17000;
 remaining=Math.max(0,Math.ceil((limit-t)/1000));hud();
 if(t>=limit){
  if(stage==='normal'){
   stage='announcement';stageClock=0;events=[];clearField();$('challenge').hidden=false;$('message').textContent='おこったぞー！';remaining=10;hud();
  }else{end();return}
  raf=requestAnimationFrame(frame);return;
 }
 if(t>=nextEvent)wave();
 while(events.length&&events[0].at<=t){appear(events.shift().indices)}
 for(const l of lanes)if(l.active)draw(l);
 raf=requestAnimationFrame(frame);
}
function wow(){if(muted)return;try{const C=window.AudioContext||window.webkitAudioContext;if(!C)return;audio=audio||new C();if(audio.state==='suspended')audio.resume();const now=audio.currentTime,o=audio.createOscillator(),g=audio.createGain();o.type='triangle';o.frequency.setValueAtTime(390,now);o.frequency.exponentialRampToValueAtTime(700,now+.09);o.frequency.exponentialRampToValueAtTime(260,now+.28);g.gain.setValueAtTime(.001,now);g.gain.linearRampToValueAtTime(.14,now+.02);g.gain.exponentialRampToValueAtTime(.001,now+.3);o.connect(g).connect(audio.destination);o.start(now);o.stop(now+.31)}catch{}}
function hit(l){if(mode!=='playing'||!l.active||l.hit)return;l.hit=true;score+=10;if(score>best){best=score;try{localStorage.setItem('kussoon-wani-tataki-v9-best',String(best))}catch{}}hud();wow();if(navigator.vibrate)navigator.vibrate(22);const word=document.createElement('span');word.className='hitword';word.textContent='ヒット！';l.lane.append(word);l.hitWord=word;setTimeout(()=>{word.remove();if(l.hitWord===word)l.hitWord=null},1000);l.hitAt=t;l.life=Math.max(l.life,t-l.born+420);l.croc.classList.add('hit');l.lane.classList.remove('impact');void l.lane.offsetWidth;l.lane.classList.add('impact');setTimeout(()=>l.lane.classList.remove('impact'),400)}
lanes.forEach(l=>l.croc.addEventListener('pointerdown',e=>{e.preventDefault();hit(l)}));
$('play').addEventListener('click',start);$('closeDialog').addEventListener('click',()=>{$('overlay').hidden=true});$('start').addEventListener('click',()=>{if(mode!=='playing'&&mode!=='ending')start()});$('pause').addEventListener('click',pause);$('reset').addEventListener('click',reset);
$('sound').addEventListener('click',()=>{muted=!muted;$('sound').textContent=muted?'OFF':'ON';$('sound').classList.toggle('on',!muted);$('sound').setAttribute('aria-pressed',String(!muted))});
document.addEventListener('visibilitychange',()=>{if(document.hidden&&mode==='playing')pause()});
hud();updateButtons();
})();</script></body></html>
