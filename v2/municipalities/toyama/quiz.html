<section class="panel"><div id="rangeHeading"><strong>出題地域を選んでください</strong></div><div id="rangeChoices" role="group" aria-label="出題地域"></div>
<div id="quizStartAnchor"></div>
<div class="actions"><button id="start" type="button" disabled>クイズを開始</button></div>
<div id="question" class="question" aria-live="polite" hidden></div>
<div class="map-frame"><svg id="map" viewBox="0 0 850 700" role="img" aria-label="富山県の市区町村クイズ地図"></svg>

<div id="choices" role="group" aria-label="光っている市区町村の名前を選ぶ" hidden></div>
<div id="replayArea" class="actions" hidden><button id="retryMissed" type="button" hidden><span>間違えた問題を</span><span>もう一度</span></button><button id="replay" type="button"><span>最初から</span><span>もう一度</span></button><button id="returnRegions" type="button">地域選択に戻る</button></div>
