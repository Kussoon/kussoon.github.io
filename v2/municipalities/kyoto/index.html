<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,follow">
<title>京都府V2・地域データ検証｜Kussoon</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans",Meiryo,sans-serif;color:#193b51;background:#f0f7fc}*{box-sizing:border-box}
body{margin:0}main{max-width:960px;margin:auto;padding:20px 14px 52px}h1{font-size:clamp(1.5rem,4vw,2.2rem)}
p{line-height:1.7}.panel{background:white;border:1px solid #bdd2df;border-radius:18px;padding:18px;margin:14px 0}
.regions{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}@media(min-width:680px){.regions{grid-template-columns:repeat(4,minmax(0,1fr))}}
button{border:1px solid #97b7ca;border-radius:12px;min-height:48px;padding:8px 6px;background:#fff;color:inherit;font:inherit;font-weight:650}
button[aria-pressed="true"]{background:#d9ecf7;border:2px solid #34799d}
.regions button ruby{ruby-position:over;white-space:nowrap}
.regions button rt{font-size:.65em;font-weight:700;letter-spacing:.02em}
.regions button .count{white-space:nowrap}
.items{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:12px}
@media(min-width:680px){.items{grid-template-columns:repeat(3,minmax(0,1fr))}}
.item{padding:10px 6px;border-radius:9px;background:#eef6fa;text-align:center;overflow-wrap:anywhere}
.item ruby{font-size:1.05rem;font-weight:650}rt{font-size:.65em}a{color:#155a7c}small{color:#476272}
</style></head><body><main>
<p><a href="/v2/">← V2試験トップへ戻る</a></p>
<h1>京都府V2・8地域の検証</h1>
<p>2026年版の全国共通データから京都府36区域（京都市11区を含む）を読み込み、府公式の地域区分を細分した8地域に漏れなく割り当てられるか確認するための試験ページです。<strong>クイズ1・2は別ページで検証中</strong>です。</p>
<div class="panel"><h2>地域を選択</h2><div id="regions" class="regions" aria-label="京都府の地域を選択"></div>
<h3 id="selection">読み込み中…</h3><div id="items" class="items" aria-live="polite"></div>
<p id="status" role="status"></p></div>
<div class="panel"><h2>京都府V2のクイズ（検証版）</h2><p>兵庫県の確定仕様を踏まえた共通処理による試作です。実機確認前のため、公開版への置換は行いません。</p>
<p><a href="./quiz.html?mode=1">クイズ1：地名から場所を当てる</a></p>
<p><a href="./quiz.html?mode=2">クイズ2：光っている場所は？</a></p></div>
<p><small>地域区分出典：<a href="https://www.pref.kyoto.jp/tokei/analysis/chiiki/index.html">京都府 毎月推計人口・利用上の注意</a></small></p>
</main><script>
(async function(){
const box=document.getElementById('regions'),list=document.getElementById('items'),heading=document.getElementById('selection'),status=document.getElementById('status');
try{
 const [cr,ir]=await Promise.all([fetch('./regions.json'),fetch('/v2/progressive-preview/label-index.json')]);
 if(!cr.ok||!ir.ok)throw Error('地域データを読み込めません');
 const cfg=await cr.json(),idx=await ir.json();
 const osaka=idx.entries.filter(e=>e.pref==='26'),byCode=new Map(osaka.map(e=>[e.code,e]));
 const codes=cfg.regions.flatMap(r=>r.codes);
 if(osaka.length!==36||idx.count!==1905||cfg.expectedAreaCount!==36||codes.length!==36||
    new Set(codes).size!==36||codes.some(c=>!byCode.has(c)))throw Error('京都府36区域の照合に失敗しました');
 const make=(tag,content)=>{const el=document.createElement(tag);el.textContent=content;return el;};
 function select(r){
  for(const btn of box.children)btn.setAttribute('aria-pressed',String(btn.dataset.key===r.key));
  heading.textContent=r.name+'：'+r.codes.length+'区域';
  list.replaceChildren();
  for(const code of r.codes){
   const e=byCode.get(code),county=cfg.countyByTown[e.name],tile=make('div','');tile.className='item';
   const ruby=document.createElement('ruby');ruby.append(make('span',(county?county[0]:'')+(e.fullName||e.name)));
   if(e.reading){const rt=make('rt',(county?county[1]:'')+e.reading);ruby.append(rt);}
   tile.append(ruby);list.append(tile);
  }
 }
 for(const r of cfg.regions){
  const b=make('button',''),ruby=make('ruby',r.name),count=make('span','（'+r.codes.length+'）');
  if(r.reading)ruby.append(make('rt',r.reading));
  count.className='count';b.append(ruby,count);
  b.dataset.key=r.key;b.type='button';b.setAttribute('aria-pressed','false');b.onclick=()=>select(r);box.append(b);
 }
 select(cfg.regions[0]);status.textContent='2026年版36区域・8地域のコード照合：合格';
}catch(e){heading.textContent='読み込みエラー';status.textContent=e.message;console.error(e);}
})();
</script><script defer src="/common/site-footer.js"></script></body></html>
