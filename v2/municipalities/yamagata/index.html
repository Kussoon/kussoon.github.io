<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,follow"><title>山形県V2・4地域と市町村名｜Kussoon</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans",Meiryo,sans-serif;color:#193b51;background:#f0f7fc}*{box-sizing:border-box}
body{margin:0}main{max-width:960px;margin:auto;padding:20px 14px 52px}h1{font-size:clamp(1.5rem,4vw,2.2rem)}
p{line-height:1.7}.panel{background:white;border:1px solid #bdd2df;border-radius:18px;padding:18px;margin:14px 0}
.regions{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}@media(min-width:680px){.regions{grid-template-columns:repeat(3,minmax(0,1fr))}}
button{border:1px solid #97b7ca;border-radius:12px;min-height:48px;padding:8px 6px;background:#fff;color:inherit;font:inherit;font-weight:650}
button[aria-pressed="true"]{background:#d9ecf7;border:2px solid #34799d}
.regions button ruby{ruby-position:over;white-space:nowrap}
.regions button rt{font-size:.65em;font-weight:700;letter-spacing:.02em}
.regions button .count{white-space:nowrap}
.items{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:12px}
@media(min-width:680px){.items{grid-template-columns:repeat(3,minmax(0,1fr))}}
.item{padding:10px 6px;border-radius:9px;background:#eef6fa;text-align:center;overflow-wrap:anywhere}
.item ruby{font-size:1.05rem;font-weight:650}rt{font-size:.65em}a{color:#155a7c}small{color:#476272}
</style></head><body><main>
<p><a href="/v2/">← V2試験トップへ戻る</a></p>
<h1>山形県V2・4地域と市町村名</h1>
<p>地域を選ぶと、含まれる市町村名を一覧で確認できます。山形県の地域区分に基づく4地域・全35区域を出題します。「全域」を選ぶと35区域すべてを表示します。</p>
<section class="panel"><h2>地域を選択</h2><div id="regions" class="regions" aria-label="山形県の地域を選択"></div>
<h3 id="selection">読み込み中…</h3><div id="items" class="items" aria-live="polite"></div>
<p id="status" role="status"></p></section>
<section class="panel"><h2>山形県V2のクイズ（検証版）</h2>
<p><a href="./quiz.html?mode=1">クイズ1：地名から場所を当てる</a></p>
<p><a href="./quiz.html?mode=2">クイズ2：光っている場所は？</a></p></section>
<p><small>地域区分：<a href="https://www3.pref.yamagata.jp/webdb/view/outside/s14Tokei/link.html">山形県：4地域</a> ／ 郡名：<a href="https://www.pref.yamagata.jp/kensei/toukei/toukei/1012206.html">山形県：市町村の郡名</a></small></p>
</main><script>
(async function(){'use strict';
const box=document.getElementById('regions'),list=document.getElementById('items'),heading=document.getElementById('selection'),status=document.getElementById('status');
try{
 const [cr,ir]=await Promise.all([fetch('./regions.json'),fetch('/v2/progressive-preview/label-index.json')]);
 if(!cr.ok||!ir.ok)throw Error('地域データを読み込めません');
 const cfg=await cr.json(),idx=await ir.json(),prefAreas=idx.entries.filter(e=>e.pref==='06'),byCode=new Map(prefAreas.map(e=>[e.code,e]));
 const codes=cfg.regions.flatMap(r=>r.codes);
 if(prefAreas.length!==35||idx.count!==1905||cfg.expectedAreaCount!==35||cfg.regions.length!==4||codes.length!==35||
    new Set(codes).size!==35||codes.some(c=>!byCode.has(c)))throw Error('山形県35区域の照合に失敗しました');
 const make=(tag,content)=>{const el=document.createElement(tag);el.textContent=content;return el;};
 function select(region){
  for(const button of box.children)button.setAttribute('aria-pressed',String(button.dataset.key===region.key));
  heading.textContent=region.name+'：'+region.codes.length+'区域';list.replaceChildren();
  for(const code of region.codes){
   const item=byCode.get(code),county=cfg.countyByTown[item.name],tile=make('div','');tile.className='item';
   const ruby=document.createElement('ruby');
   ruby.append(make('span',(county?county[0]:'')+(item.fullName||item.name)));
   if(item.reading)ruby.append(make('rt',(county?county[1]:'')+item.reading));
   tile.append(ruby);list.append(tile);
  }
 }
 const options=[...cfg.regions,{key:'all',name:'全域',reading:'ぜんいき',codes:[...new Set(codes)]}];
 for(const region of options){
  const button=make('button',''),ruby=make('ruby',region.name),count=make('span','（'+region.codes.length+'）');
  if(region.reading)ruby.append(make('rt',region.reading));
  count.className='count';button.append(ruby,count);
  button.dataset.key=region.key;button.type='button';button.setAttribute('aria-pressed','false');button.onclick=()=>select(region);box.append(button);
 }
 select(cfg.regions[0]);status.textContent='2026年版35区域・4地域のコード照合：合格';
}catch(error){heading.textContent='読み込みエラー';status.textContent=error.message;console.error(error);}
})();
</script><script defer src="/common/site-footer.js"></script></body></html>
