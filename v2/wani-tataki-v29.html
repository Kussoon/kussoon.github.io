/* The shoreline passes these x coordinates at the center of each row. */
const bankCenters = [188, 195, 183, 193, 181];
const lanes = bankCenters.map((bankX, index) => {

let mode='ready',score=0,best=0,remaining=27,t=0,lastWall=0,raf=0,nextEvent=450,events=[],quietSince=null,muted=true,audio=null,stage='normal',stageClock=0,endTimer=null;
try{best=Number(localStorage.getItem('kussoon-wani-tataki-v29-best')||localStorage.getItem('kussoon-wani-tataki-v28-best')||localStorage.getItem('kussoon-wani-tataki-v27-best')||localStorage.getItem('kussoon-wani-tataki-v26-best')||localStorage.getItem('kussoon-wani-tataki-v25-best')||localStorage.getItem('kussoon-wani-tataki-v24-best')||localStorage.getItem('kussoon-wani-tataki-v23-best')||localStorage.getItem('kussoon-wani-tataki-v22-best'))||0}catch{}
const rnd=(a,b)=>a+Math.random()*(b-a);
const pickExposure=()=>{const r=Math.random();return r<.7?1:r<.9?.7:.4;}; // 100%:70%, 70%:20%, 40%:10%

function clearField(){for(const l of lanes){idle(l);if(l.hitWord){l.hitWord.remove();l.hitWord=null}l.lane.classList.remove('impact')}}

function updateButtons(){$('start').textContent=mode==='playing'?'プレイ中':mode==='ending'?'終了演出中':mode==='ended'?'もう一度':'スタート';$('start').disabled=mode==='ending'||mode==='playing';$('reset').disabled=mode==='ending';$('pause').disabled=!(mode==='playing'||mode==='paused');$('pause').innerHTML=mode==='paused'?'<svg viewBox="0 0 20 20" width="18" height="18" aria-hidden="true"><path d="M6 3.5v13l10-6.5z" fill="currentColor"/></svg>':'<svg viewBox="0 0 20 20" width="18" height="18" aria-hidden="true"><path d="M6 4h3v12H6zm5 0h3v12h-3z" fill="currentColor"/></svg>';$('pause').setAttribute('aria-label',mode==='paused'?'再開':'一時停止');$('pause').title=mode==='paused'?'再開':'一時停止'}
function end(){

  if(mode!=='ending')return;

}

function start(){if(mode==='ending')return;if(!muted)unlockAudio();clearTimeout(endTimer);$('endScreen').hidden=true;cancelAnimationFrame(raf);mode='playing';stage='normal';stageClock=0;quietSince=null;$('challenge').hidden=true;score=0;remaining=27;t=0;events=[];nextEvent=300;clearField();openNormalLane();hud();$('overlay').hidden=true;updateButtons();$('message').textContent=PLAY_MESSAGE;lastWall=performance.now();raf=requestAnimationFrame(frame)}

function queue(at,index){events.push({at,index});events.sort((a,b)=>a.at-b.at)}
function shuffledLanes(){
 const indices=lanes.map((_, index)=>index);
 for(let i=indices.length-1;i>0;i--){
  const j=Math.floor(Math.random()*(i+1));
  [indices[i],indices[j]]=[indices[j],indices[i]];
 }
 return indices;
}
function makeFrenzySchedule(holdRange){
 const minimumGap=FRENZY_LAUNCH_GAP_MS;
 const fullTripsMs=MAX_CROC_WIDTH/FRENZY_SPEED*1000;
 function randomLaneOrder(){
  const remaining=lanes.map((_,index)=>Math.floor(FRENZY_COUNT/lanes.length)+(index<FRENZY_COUNT%lanes.length?1:0));
  const order=[];
  function fill(){
   if(order.length===FRENZY_COUNT)return true;
   let candidates=remaining.map((count,index)=>count>0&&!order.slice(-4).includes(index)?index:-1).filter(index=>index>=0);
   for(let i=candidates.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[candidates[i],candidates[j]]=[candidates[j],candidates[i]]}
   for(const index of candidates){
    remaining[index]--;order.push(index);
    if(fill())return true;
    order.pop();remaining[index]++;
   }
   return false;
  }
  return fill()?order:null;
 }
 for(let attempt=0;attempt<500;attempt++){
  const order=randomLaneOrder();
  if(!order)continue;
  const holds=order.map(()=>rnd(...holdRange));
  const latestFinalStart=FRENZY_MS-holds[FRENZY_COUNT-1]-fullTripsMs;
  const slack=latestFinalStart-minimumGap*(FRENZY_COUNT-1);
  if(slack<0)continue;
  const weights=Array.from({length:FRENZY_COUNT-1},()=>rnd(.8,1.2));
  const weightTotal=weights.reduce((sum,weight)=>sum+weight,0);
  const laneReady=Array(lanes.length).fill(0);
  const schedule=[];
  let at=0,valid=true;
  for(let i=0;i<FRENZY_COUNT;i++){
   if(i)at+=minimumGap+slack*weights[i-1]/weightTotal;
   at=Math.max(at,laneReady[order[i]]);
   if(i===FRENZY_COUNT-1&&at>latestFinalStart){valid=false;break}
   schedule.push({at,index:order[i],holdMs:holds[i],finale:i===FRENZY_COUNT-1});
   laneReady[order[i]]=at+holds[i]+fullTripsMs;
  }
  if(valid)return schedule;
 }
 // Keep a safe, staggered fallback if random holds and lane cooldowns are unusually tight.
 const order=randomLaneOrder()||shuffledLanes();
 const holds=order.map(()=>rnd(...holdRange));
 const latestFinalStart=FRENZY_MS-holds[FRENZY_COUNT-1]-fullTripsMs;
 const slack=Math.max(0,latestFinalStart-minimumGap*(FRENZY_COUNT-1));
 const weights=Array.from({length:FRENZY_COUNT-1},()=>rnd(.8,1.2));
 const weightTotal=weights.reduce((sum,weight)=>sum+weight,0);
 const schedule=[];let at=0;
 for(let i=0;i<FRENZY_COUNT;i++){
  schedule.push({at,index:order[i],holdMs:holds[i],finale:i===FRENZY_COUNT-1});
  if(i<FRENZY_COUNT-1)at+=minimumGap+slack*weights[i]/weightTotal;

}
function openNormalLane(){
 const index=shuffledLanes().find(i=>!lanes[i].active);

}
function keepLaneVisible(isFrenzy){
 if(lanes.some(lane=>lane.active&&lane.visiblePx>=SHORE_HANDOFF_PX))return;
 // Bring the next nose past the bank while the previous one is still retreating.
 const speed=isFrenzy?FRENZY_SPEED:CROC_SPEED;
 const emerging=lanes.find(lane=>lane.active&&!lane.hit&&t-lane.born<SHORE_REVEAL_PX*1000/speed);
 if(emerging){
  emerging.born=t-SHORE_REVEAL_PX*1000/speed;
  draw(emerging);
 }else if(isFrenzy){
  const nextIndex=events.findIndex(event=>!lanes[event.index].active);
  if(nextIndex>=0){
   const [next]=events.splice(nextIndex,1);
   appear(next,true);
  }

  openNormalLane();

}
function wave(){
 const c=config[$('level').value];
 const r=Math.random();
 const count=r<c.triple?3:r<c.triple+c.double?2:1;
 let at=t;
 for(const index of shuffledLanes().slice(0,count)){
  queue(at,index);

 }
 if(Math.random()<c.burst){
  let burstAt=at+290;
  for(const index of shuffledLanes()){
   queue(burstAt,index);
   burstAt+=rnd(210,275);
  }
  nextEvent=t+2200;
 }else{
  nextEvent=t+rnd(...c.gap)/1.2;
  if(Math.random()<c.pause)nextEvent=t+950+rnd(0,200);
 }
}
function appear(event,showImmediately=false){
 const lane=lanes[event.index];
 if(lane.active)return;
 const frenzy=stage==='frenzy';
 lane.active=true;
 lane.hit=false;
 const speed=frenzy?FRENZY_SPEED:CROC_SPEED;
 lane.born=showImmediately?t-SHORE_REVEAL_PX*1000/speed:frenzy?event.at:t;
 lane.finale=Boolean(event.finale);
 lane.holdMs=frenzy?event.holdMs:rnd(...config[$('level').value].stay);
 lane.visiblePx=0;
 lane.exposure=frenzy?1:pickExposure();
 lane.croc.classList.add('live');
 lane.croc.classList.remove('hit');
 draw(lane);
}
function draw(l){
 const width = l.lane.clientWidth;
 const boundary = width * l.bankX / 380;
 const bodyWidth = l.croc.getBoundingClientRect().width;
 // Full exposure shows the front half; the shared den hides the back half.
 const maxVisible=bodyWidth*.5,maxTravel=maxVisible*l.exposure;
 const speed=stage==='frenzy'?FRENZY_SPEED:CROC_SPEED;
 const travelMs=maxTravel*1000/speed,age=t-l.born;
 let visible;
 if(l.hit)visible=l.finale
  ?l.hitFrom*Math.max(0,(FRENZY_MS-t)/Math.max(1,FRENZY_MS-l.hitAt))
  :Math.max(0,l.hitFrom-speed*(t-l.hitAt)/1000);
 else if(age<travelMs)visible=Math.min(maxTravel,speed*age/1000);
 else if(age<travelMs+l.holdMs)visible=maxTravel;
 else if(l.finale)visible=maxTravel*Math.max(0,(FRENZY_MS-t)/Math.max(1,FRENZY_MS-l.born-travelMs-l.holdMs));
 else visible=Math.max(0,maxTravel-speed*(age-travelMs-l.holdMs)/1000);
 if(visible<=0&&(l.hit||age>travelMs+l.holdMs)){idle(l);return}
 l.visiblePx=visible;l.croc.style.left=(boundary-bodyWidth+visible)+'px';
}
function frame(now){
 if(mode!=='playing')return;
 const delta=Math.min(100,Math.max(0,now-lastWall));lastWall=now;
 if(stage==='announcement'||stage==='silence'){
  stageClock+=delta;
  if(stage==='announcement'&&stageClock>=3000){
   stage='silence';stageClock=0;$('challenge').hidden=true;$('message').textContent=PLAY_MESSAGE;
  }else if(stage==='silence'&&stageClock>=2000){
   stage='frenzy';stageClock=0;t=0;remaining=10;events=makeFrenzySchedule(config[$('level').value].frenzyStay);
   $('message').textContent=PLAY_MESSAGE;$('challenge').hidden=true;
   appear(events.shift(),true);
  }
  hud();raf=requestAnimationFrame(frame);return;
 }
 t+=delta;
 const isFrenzy=stage==='frenzy';
 const limit=isFrenzy?FRENZY_MS:NORMAL_MS;
 remaining=Math.max(0,Math.ceil((limit-t)/1000));
 for(const lane of lanes)if(lane.active)draw(lane);
 if(!isFrenzy&&t<limit){
  while(t>=nextEvent)wave();
 }
 if(isFrenzy||t<limit){
  while(events.length&&events[0].at<=t){
   appear(events.shift());
  }
 }
 if(t<limit&&!isFrenzy)keepLaneVisible(false);
 if(t>=limit){
  // Let visible crocodiles retreat normally, then leave a clear beat before the card.
  events.length=0;
  if(!lanes.some(lane=>lane.active)){
   if(quietSince===null){
    clearField();
    quietSince=t;
   }
   if(t-quietSince>=EMPTY_FIELD_MS){
    quietSince=null;
    if(isFrenzy){end();return;}
    stage='announcement';
    stageClock=0;
    $('challenge').hidden=false;
    playAngerSound();
    $('message').textContent='おこったぞー！';
    remaining=10;
   }
  }
 }
 raf=requestAnimationFrame(frame);
}

function unlockAudio(){
 try{const C=window.AudioContext||window.webkitAudioContext;if(!C)return false;audio=audio||new C();if(audio.state==='suspended')audio.resume().catch(()=>{});return true}catch(e){return false}
}
function voiceBurst(at,duration,f0,f1,bands,volume){
 if(!audio)return;
 const ctx=audio,source=ctx.createOscillator(),pre=ctx.createGain(),out=ctx.createGain();
 source.type='sawtooth';source.frequency.setValueAtTime(f0,at);source.frequency.exponentialRampToValueAtTime(f1,at+duration);pre.gain.value=.27;source.connect(pre);
 out.gain.setValueAtTime(.0001,at);out.gain.linearRampToValueAtTime(volume,at+.015);out.gain.exponentialRampToValueAtTime(.0001,at+duration);
 out.connect(ctx.destination);
 for(const [freq,q,amplitude] of bands){const filter=ctx.createBiquadFilter(),gain=ctx.createGain();filter.type='bandpass';filter.frequency.value=freq;filter.Q.value=q;gain.gain.value=amplitude;pre.connect(filter);filter.connect(gain);gain.connect(out)}
 source.start(at);source.stop(at+duration+.01);
}
function playImpactSound(){

 voiceBurst(now+.125,.17,1000,680,[[550,2.7,.65],[1740,3.8,.85],[2900,4.2,.38]],.19);
}

 // Optional spoken line from the user's device. Some iPhones suppress system speech.
 try{if('speechSynthesis' in window){const u=new SpeechSynthesisUtterance('おこったぞー！');u.lang='ja-JP';u.pitch=1.55;u.rate=1.3;u.volume=.75;const v=speechSynthesis.getVoices().find(x=>x.lang.toLowerCase().startsWith('ja'));if(v)u.voice=v;speechSynthesis.cancel();speechSynthesis.speak(u)}}catch(e){}
}
function wow(){playImpactSound()}
function hit(l){if(mode!=='playing'||!l.active||l.hit)return;l.hit=true;score+=10;if(score>best){best=score;try{localStorage.setItem('kussoon-wani-tataki-v29-best',String(best))}catch{}}hud();wow();if(navigator.vibrate)navigator.vibrate(22);const word=document.createElement('span');word.className='hitword';word.textContent='ヒット！';l.lane.append(word);l.hitWord=word;setTimeout(()=>{word.remove();if(l.hitWord===word)l.hitWord=null},1000);l.hitAt=t;l.hitFrom=l.visiblePx||0;l.croc.classList.add('hit');l.lane.classList.remove('impact');void l.lane.offsetWidth;l.lane.classList.add('impact');setTimeout(()=>l.lane.classList.remove('impact'),400)}
lanes.forEach(l=>l.croc.addEventListener('pointerdown',e=>{e.preventDefault();hit(l)}));
