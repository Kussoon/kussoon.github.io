function safeText(tag,txt,cls){const e=document.createElement(tag);e.textContent=txt;if(cls)e.className=cls;return e}
function renderList(){const list=$('list');list.replaceChildren();const total=shown.length;$('listcount').textContent='（'+total+'件）';const pages=Math.max(1,Math.ceil(total/perPage));page=Math.min(page,pages-1);let segment=shown.slice(page*perPage,(page+1)*perPage);if(!segment.length)list.append(safeText('p','条件に合う店舗がありません。','empty'));for(const s of segment){let b=document.createElement('button');b.type='button';b.className='item'+(s.store_id===selectedId?' selected':'');b.append(safeText('b',s.store_name),safeText('span',s.city+' · '+categoryOf(s)+(s.facility_name&&s.facility_name!=='路面店'?' · '+s.facility_name:''),'meta'),makeTag(s));b.addEventListener('click',()=>goToStore(s));list.append(b)}$('pageinfo').textContent=(page+1)+' / '+pages;$('prev').disabled=page<=0;$('next').disabled=page>=pages-1}
function groupKey(s){const lat=s.latitude.toFixed(5),lng=s.longitude.toFixed(5);const fac=s.facility_name&&s.facility_name!=='路面店'?s.facility_name:'地点';return [s.city,fac,lat,lng].join('|')}
function groupName(arr){if(arr.length===1)return arr[0].store_name;const f=arr[0].facility_name;return f&&f!=='路面店'?f:arr[0].city+'の同一地点'}
function openFacility(arr){const el=$('facilityPanel');el.replaceChildren();const head=document.createElement('div');head.className='head';const heading=document.createElement('div');heading.className='facility-heading';heading.append(safeText('strong','🏬 '+groupName(arr)),safeText('small','この施設・地点にある '+arr.length+' 店舗'));head.append(heading);let closer=document.createElement('button');closer.type='button';closer.className='close-facility';closer.textContent='閉じる';closer.onclick=()=>{el.hidden=true};const collapse=document.createElement('button');collapse.type='button';collapse.className='collapse-facility';collapse.textContent='一覧をたたむ';collapse.setAttribute('aria-expanded','true');head.append(collapse);head.append(closer);el.append(head);const items=document.createElement('div');items.className='facility-items';collapse.onclick=()=>{items.hidden=!items.hidden;collapse.textContent=items.hidden?'一覧を開く':'一覧をたたむ';collapse.setAttribute('aria-expanded',String(!items.hidden))};for(const s of arr){const b=document.createElement('button');b.type='button';b.textContent=s.store_name;b.onclick=()=>{showDetail(s);event('sweets-facility-shop-open')};items.append(b)}el.append(items);el.hidden=false;event('sweets-facility-open');if(!isInMapView(arr[0]))centerStore(arr[0]);}
function isInMapView(s){return map.getBounds().pad(-0.12).contains([s.latitude,s.longitude])}
function centerStore(s){map.invalidateSize({pan:false});map.setView([s.latitude,s.longitude],Math.max(14,Math.min(16,map.getZoom())),{animate:false})}

function popupEscape(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function shortAddress(s){const a=String(s.address||'').trim();if(!a)return s.city||'住所未登録';let v=a.replace(/^兵庫県\s*/, '');const facility=s.facility_name&&s.facility_name!=='路面店'?s.facility_name:'';if(facility){const street=v.split(/(?:\s|　)(?=[^\s]*?(?:館|階|F|店|ビル))/)[0];return street.length>48?street.slice(0,47)+'…':street;}return v.length>48?v.slice(0,47)+'…':v}
let activeSweetMarker=null;
function closeSweetPreview(){dismissSweetMapReturn();const el=$('sweetPinPanel');el.hidden=true;el.replaceChildren();activeSweetMarker=null}
function placeSweetPreview(){
 const el=$('sweetPinPanel');if(el.hidden||!activeSweetMarker||!map)return;
 const mapEl=$('map'), box=document.querySelector('.mapbox');
 const pt=map.latLngToContainerPoint(activeSweetMarker.getLatLng());
 const mapW=mapEl.clientWidth;
 // Reserve the rightmost 60px for + / - / 全体; never pan/zoom the map.
 const w=Math.min(245,Math.max(175,mapW-84));
 el.style.width=w+'px';
 const left=Math.max(8,Math.min(pt.x-w/2,Math.max(8,mapW-w-66)));
 el.style.left=left+'px';
 // Always below the selected pin, even for markers at the bottom of the map.
 el.style.top=(mapEl.offsetTop+pt.y+26)+'px';
}

function markerFor(arr){const s=arr[0],multiple=arr.length>1,hasRef=arr.every(x=>x.map_display==='reference');let icon=L.divIcon({className:'',html:'<div class="pin '+(multiple?'multi ':'')+(hasRef?'ref':'')+'">'+(multiple?arr.length:'●')+'</div>',iconSize:[multiple?36:29,29],iconAnchor:[multiple?18:14,14]});const marker=L.marker([s.latitude,s.longitude],{icon,title:groupName(arr)});marker.on('click',()=>openSweetPreview(arr,marker));return marker}
function renderMap(){
  closeSweetPreview();
  clusters.clearLayers();
  facilityPins.clearLayers();
  groups=new Map();
  for(const s of shown){const k=groupKey(s);if(!groups.has(k))groups.set(k,[]);groups.get(k).push(s)}
  const points=[];
  for(const arr of groups.values()){
    const marker=markerFor(arr);
    // A numbered facility pin is a single fixed geographical place, not a proximity cluster.
    // Keep it outside MarkerClusterGroup to prevent cluster zoom/spiderfy from closing its popup.
    if(arr.length>1){marker.options.pane='sweetFacilityPane';facilityPins.addLayer(marker)}
    else clusters.addLayer(marker);
    points.push([arr[0].latitude,arr[0].longitude]);
  }
  return points;
}
function fitVisible(points){map.invalidateSize({pan:false});if(points.length===1){map.setView(points[0],16,{animate:false})}else if(points.length){map.fitBounds(L.latLngBounds(points),{padding:[45,45],maxZoom:16,animate:false})}else{map.setView([34.756,135.37],11,{animate:false})}}

map=L.map('map',{scrollWheelZoom:false,zoomControl:false}).setView([34.756,135.37],11);

const allControl=L.Control.extend({options:{position:'topright'},onAdd:function(){

// v0.1.17: initial view is one zoom level closer; the 「全体」 button restores THIS view, not the wider fitBounds view.
