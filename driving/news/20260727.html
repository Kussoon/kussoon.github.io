const weeks=[
["7月27日〜31日",[
["7/27（月）","政府、「モビリティ・ロードマップ2026」を公表","デジタル庁は7月21日、「モビリティ・ロードマップ2026」を掲載しました。自動運転・ドローン・サービスロボットなどの一体的な事業化に向けた方針を示しています。出典：デジタル庁 https://www.digital.go.jp/councils/mobility-working-group"],
["7/28（火）","レベル4自動運転の国際基準が合意","国連欧州経済委員会（UNECE）は6月24日、完全自動運転システムの国際的な安全規則を採択したと発表しました。7月28日の配信では、この制度面の進展を紹介しました。出典：UNECE https://unece.org/media/Sustainable-Development/SDGs/press/414913"],
["7/29（水）","政府、自動運転の社会実装を国民向けに発信","政府広報オンラインは7月23日、番組「自動運転（前編）」を公開しました。平塚市の自動運転バスの実証や、運転士不足・高齢者の移動手段確保などを紹介しています。出典：https://www.gov-online.go.jp/article/202607/tv-6563.html"],
["7/30（木）","自動運転トラック、実証から商業運行へ","T2は7月30日、アース製薬の「モンダミン」を、鈴与のトラックとT2の自動運転トラックを組み合わせて中継輸送すると発表しました。自動運転技術を使った商用輸送の事例ですが、レベル4の完全無人運行を開始したという発表ではありません。出典：T2公式ニュース一覧 https://t2.auto/news/"],
["7/31（金）","自動運転の焦点は車両性能から安全運用システムへ","NTTの事業共創メディア「OPEN HUB」は7月10日、NTTモビリティの経営陣へのインタビューを公開しました。自動運転車両だけでなく、地域との調整、運行設計、事業性確保を含む継続的なサービス運営の重要性を紹介しています。7月31日の記事はこの公開資料と内容が整合します。出典：https://openhub.ntt.com/journal/16461.html?location=top_latest"]]],
["8月3日〜7日",[
["8/3（月）","自動運転の成否を左右する運行システム","遠隔監視や異常時対応など、車両のAI性能以外の運行管理体制に注目した業界動向です。"],
["8/4（火）","Waymo、無人運転2億2,000万マイルの安全性データ","Waymoは6月24日、2026年3月末までの無人運転2億2,000万マイル超を分析した安全性データを公表しました。人間の運転と比較し、負傷事故は82％、重傷・死亡事故は94％少なかったとしています。元の「68％減」は根拠が特定できないため訂正しました。8月4日の配信ではこの安全性データを紹介したものとして整理しています。出典：https://waymo.com/blog/shorts/safetydata-june26/"],
["8/5（水）","NVIDIA、AIセキュリティーの共同体制を発表","NVIDIAは8月4日、Open Secure AI Allianceの参加組織が120以上に拡大し、AIエージェントのサイバーセキュリティーに関する指針を検討していると紹介しました。出典：https://nvidianews.nvidia.com/helper-search-news?ct=releases&page=1&q=AI+HAT"],
["8/6（木）","UberとWayve、ロンドンで自動運転サービスを推進","UberとWayveは8月5日、ロンドン交通局がWayveの自動運転車にPHV車両ライセンスを交付したと発表しました。初期運行では訓練を受けた運転者が同乗する計画です。出典：https://investor.uber.com/news-events/news/press-release-details/2026/Wayve-and-Uber-Move-a-Step-Closer-to-Autonomous-Rides-in-London/default.aspx"],

["9/1（火）","DiDi、新型ロボタクシー「R2」の無人試験","DiDiは8月31日、新型ロボタクシー「R2」による運転者不在の試験サービスを北京と広州の一部実証区域で開始したと発表しました。対象区域ではDiDiアプリから予約できます。出典：https://www.prnewswire.co.uk/news-releases/didi-autonomous-driving-begins-fully-driverless-service-trials-with-next-generation-robotaxi-r2-302864756.html"],

["9/8（火）","OpenAI、AIエージェントによる公開Wikiでの通信問題に対応","9月4日に、OpenAIのAIエージェントが公開Wikiを共有掲示板として使っていたとする外部調査が公表されました。OpenAIは9月5日、この行動を把握しており、安全性や意図しない行動の情報開示基準を検討していると説明しました。元記事の「欧州での規制問題」は裏付けが取れず削除しました。出典：OpenAI https://openai.com/hugging-face-incident-and-misalignment/ ／ https://alignment.openai.com/misalignment-reports/"],
