name: Coaster v94 rail frame
on:
  push:
    paths:
      - 'v2/one-stroke-coaster-3d-v94.html'
      - 'scripts/test-coaster-v94-browser.cjs'
      - '.github/workflows/coaster-v94-rail-frame.yml'
  pull_request:
    paths:
      - 'v2/one-stroke-coaster-3d-v94.html'
      - 'scripts/test-coaster-v94-browser.cjs'
      - '.github/workflows/coaster-v94-rail-frame.yml'
jobs:
  rail-frame:
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/playwright:v1.56.1-noble
    env:
      NODE_PATH: ${{ github.workspace }}/v2/tests/browser/node_modules
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install browser test dependencies
        run: npm ci --prefix v2/tests/browser --no-audit --no-fund
      - name: Exercise track generation and rail frames
        run: node scripts/test-coaster-v94-browser.cjs
      - name: Check inline game script syntax
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          html = Path('v2/one-stroke-coaster-3d-v94.html').read_text()
          scripts = re.findall(r'<script[^>]*>([\s\S]*?)</script>', html)
          Path('/tmp/coaster-v94-inline.js').write_text('\n'.join(scripts))
          PY
          node --check /tmp/coaster-v94-inline.js
