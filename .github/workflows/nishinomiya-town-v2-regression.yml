name: Nishinomiya town V2 regression
on:
  push:
    paths:
      - 'v2/nishinomiya-town-study-c.html'
      - 'v2/nishinomiya-town-comparison-b.html'
      - 'v2/data/nishinomiya-town-v2-premerged.topojson'
      - 'v2/data/nishinomiya-uekoto-community.topojson'
      - 'scripts/audit-nishinomiya-town-v2.cjs'
      - 'scripts/check-nishinomiya-town-v2-timestamp.cjs'
      - 'scripts/smoke-nishinomiya-town-v2.cjs'
      - 'scripts/audit-geography-ui.cjs'
      - 'scripts/smoke-geography-ui-comparison.cjs'
      - 'v2/geography/**'
      - 'v2/docs/geography-five-city-standard.md'
      - 'v2/docs/geography-hierarchy-pilot.md'
      - '.github/workflows/nishinomiya-town-v2-regression.yml'
  pull_request:
    paths:
      - 'v2/nishinomiya-town-study-c.html'
      - 'v2/nishinomiya-town-comparison-b.html'
      - 'v2/data/nishinomiya-town-v2-premerged.topojson'
      - 'v2/data/nishinomiya-uekoto-community.topojson'
      - 'scripts/audit-nishinomiya-town-v2.cjs'
      - 'scripts/check-nishinomiya-town-v2-timestamp.cjs'
      - 'scripts/smoke-nishinomiya-town-v2.cjs'
      - 'scripts/audit-geography-ui.cjs'
      - 'scripts/smoke-geography-ui-comparison.cjs'
      - 'v2/geography/**'
      - 'v2/docs/geography-five-city-standard.md'
      - 'v2/docs/geography-hierarchy-pilot.md'
permissions:
  contents: read
jobs:
  verify-town-map:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Kussoon site
        uses: actions/checkout@v4
        with:
          path: site
          fetch-depth: 2
      - name: Checkout original Nishinomiya data and quiz sources
        uses: actions/checkout@v4
        with:
          repository: Kussoon/nishinomiya
          path: nishinomiya
          persist-credentials: false
      - name: Checkout original Takarazuka town sources
        uses: actions/checkout@v4
        with:
          repository: Kussoon/takarazuka
          path: takarazuka
          persist-credentials: false
      - name: Checkout original Amagasaki town source
        uses: actions/checkout@v4
        with:
          repository: Kussoon/amagasaki
          path: amagasaki
          persist-credentials: false
      - name: Checkout original Itami town source
        uses: actions/checkout@v4
        with:
          repository: Kussoon/itami
          path: itami
          persist-credentials: false
      - name: Checkout original Ashiya town source
        uses: actions/checkout@v4
        with:
          repository: Kussoon/ashiya
          path: ashiya
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Audit town geometry, readings, community coverage, and quiz options
        run: node site/scripts/audit-nishinomiya-town-v2.cjs site nishinomiya
      - name: Check C-page update timestamp on HTML changes
        run: cd site && node scripts/check-nishinomiya-town-v2-timestamp.cjs
      - name: Verify geography hierarchy and city town adapters
        run: node site/v2/geography/test-hierarchy.cjs site nishinomiya takarazuka amagasaki itami ashiya
      - name: Verify A/B changes only touch requested UI
        run: node site/v2/geography/test-ui-comparison.cjs site

  browser-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Kussoon site
        uses: actions/checkout@v4
        with:
          path: site
          fetch-depth: 2
      - name: Checkout Nishinomiya community mapping
        uses: actions/checkout@v4
        with:
          repository: Kussoon/nishinomiya
          path: nishinomiya
          persist-credentials: false
      - name: Checkout Takarazuka town information and search
        uses: actions/checkout@v4
        with:
          repository: Kussoon/takarazuka
          path: takarazuka
          persist-credentials: false
      - name: Checkout Amagasaki legacy SVG town search
        uses: actions/checkout@v4
        with:
          repository: Kussoon/amagasaki
          path: amagasaki
          persist-credentials: false
      - name: Checkout Itami legacy SVG town search
        uses: actions/checkout@v4
        with:
          repository: Kussoon/itami
          path: itami
          persist-credentials: false
      - name: Checkout Ashiya legacy SVG town search
        uses: actions/checkout@v4
        with:
          repository: Kussoon/ashiya
          path: ashiya
          persist-credentials: false
      - name: Setup local community data
        run: |
          mkdir -p site/nishinomiya/data
          cp nishinomiya/data/community-town-map.json site/nishinomiya/data/community-town-map.json
          cp nishinomiya/data/maniac-readings.json site/nishinomiya/data/maniac-readings.json
          mkdir -p site/takarazuka/data
          cp takarazuka/data/takarazuka-town-info.json site/takarazuka/data/takarazuka-town-info.json
          cp takarazuka/town-search.html site/takarazuka/town-search.html
          mkdir -p site/amagasaki
          cp amagasaki/town-search.html site/amagasaki/town-search.html
          mkdir -p site/itami
          cp itami/town-search.html site/itami/town-search.html
          mkdir -p site/ashiya
          cp ashiya/town-search.html site/ashiya/town-search.html
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install browser testing tools
        run: |
          npm install --no-save --prefix site playwright
          cd site
          npx playwright install --with-deps chromium webkit
      - name: Start local site and run Chromium/WebKit smoke tests
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 --directory site &
          sleep 2
          SMOKE_SCREENSHOTS=site-smoke-screenshots node site/scripts/smoke-nishinomiya-town-v2.cjs
      - name: Audit five-city geography usability at phone, tablet, desktop widths
        run: GEOGRAPHY_AUDIT_DIR=geography-ui-audit node site/scripts/audit-geography-ui.cjs
      - name: Compare reading sizes and breadcrumb accessibility across five cities
        run: GEOGRAPHY_AB_SCREENSHOTS=geography-ab-screenshots node site/scripts/smoke-geography-ui-comparison.cjs
      - name: Upload A/B comparison screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: geography-ui-ab-comparison
          path: geography-ab-screenshots/
          if-no-files-found: warn
          retention-days: 14
      - name: Upload five-city usability audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: geography-five-city-ui-audit
          path: geography-ui-audit/
          if-no-files-found: warn
          retention-days: 14
      - name: Save desktop and mobile screenshot evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nishinomiya-v2-c-browser-screenshots
          path: site-smoke-screenshots/
          if-no-files-found: warn
          retention-days: 14
