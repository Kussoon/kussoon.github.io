name: Nationwide town-map unified source contract
on:
  pull_request:
    paths:
      - 'v2/common/js/town-svg-data-contract.js'
      - 'v2/takarazuka-town-svg-unified-source-20261118-pilot.html'
      - 'v2/common/js/town-map-unified-source-takarazuka-20261118-pilot.js'
      - 'scripts/test-town-svg-unified-source-unit.cjs'
      - 'scripts/test-town-svg-unified-source-125-lossless.cjs'
      - 'scripts/test-town-svg-unified-source-browser.cjs'
      - 'scripts/audit-takarazuka-unified-source-125-regions.cjs'
      - 'scripts/test-takarazuka-unified-source-exceptions.cjs'
      - '.github/workflows/town-svg-unified-source.yml'
  workflow_dispatch:
jobs:
  unit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/test-town-svg-unified-source-unit.cjs
      - name: Fetch original SVG and metadata for complete lossless audit
        run: |
          mkdir -p takarazuka/data
          curl --fail --location --retry 3 --silent --show-error https://raw.githubusercontent.com/Kussoon/takarazuka/main/town-search.html -o takarazuka/town-search.html
          curl --fail --location --retry 3 --silent --show-error https://raw.githubusercontent.com/Kussoon/takarazuka/main/data/takarazuka-town-info.json -o takarazuka/data/takarazuka-town-info.json
      - run: node scripts/test-town-svg-unified-source-125-lossless.cjs
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 28
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium webkit
      - name: Fetch Takarazuka source data unchanged
        run: |
          mkdir -p takarazuka/data
          curl --fail --location --retry 3 --silent --show-error https://raw.githubusercontent.com/Kussoon/takarazuka/main/town-search.html -o takarazuka/town-search.html
          curl --fail --location --retry 3 --silent --show-error https://raw.githubusercontent.com/Kussoon/takarazuka/main/data/takarazuka-town-info.json -o takarazuka/data/takarazuka-town-info.json
      - run: |
          python3 -m http.server 8765 --bind 127.0.0.1 &
          sleep 3
          node scripts/test-town-svg-unified-source-browser.cjs
      - run: node scripts/test-takarazuka-unified-source-exceptions.cjs
      - run: node scripts/audit-takarazuka-unified-source-125-regions.cjs
