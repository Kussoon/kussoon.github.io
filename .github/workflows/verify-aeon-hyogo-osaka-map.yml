name: Aeon Hyogo Osaka 318 map verification
on:
  pull_request:
    paths:
      - 'v2/verification/aeon-hyogo-osaka-map/index.html'
      - 'v2/verification/aeon-hyogo-osaka-map/map.js'
      - 'v2/verification/aeon-hyogo-osaka-map/map.css'
      - 'v2/verification/aeon-hyogo-osaka-map/verify.cjs'
      - 'v2/verification/aeon-hyogo-osaka-map/vendor/**'
      - '.github/workflows/verify-aeon-hyogo-osaka-map.yml'
permissions:
  contents: read
jobs:
  browsers:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    container:
      image: mcr.microsoft.com/playwright:v1.56.1-noble
      options: --ipc=host
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: v2/tests/browser/package-lock.json
      - run: npm ci --no-audit --no-fund
        working-directory: v2/tests/browser
      - name: Verify 318 stores, filters, coordinates and responsive layouts
        run: node v2/verification/aeon-hyogo-osaka-map/verify.cjs
        env:
          KUSSOON_BROWSER_ARTIFACTS: ${{ runner.temp }}/aeon-hyogo-osaka-browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: aeon-hyogo-osaka-browser-verification
          path: ${{ runner.temp }}/aeon-hyogo-osaka-browser
          retention-days: 14
          if-no-files-found: ignore
