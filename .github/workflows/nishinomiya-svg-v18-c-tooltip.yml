name: Nishinomiya SVG V18 Tooltip Anchor Comparison
on:
  pull_request:
    paths:
      - 'v2/nishinomiya-town-svg-master-v18-20261117-pilot.html'
      - 'scripts/*v18*'
      - '.github/workflows/nishinomiya-svg-v18-c-tooltip.yml'
  workflow_dispatch:
jobs:
  comparison:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Chromium and WebKit
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium webkit
      - name: Retrieve community data
        run: |
          mkdir -p nishinomiya/data
          curl --fail --location --retry 3 --silent --show-error https://raw.githubusercontent.com/Kussoon/nishinomiya/main/data/community-town-map.json -o nishinomiya/data/community-town-map.json
      - name: Compare C and V18 for 26 regions, reading and font settings
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 &
          sleep 3
          node scripts/audit-nishinomiya-c-v18-comprehensive.cjs
      - name: Verify all town quiz questions
        run: node scripts/audit-nishinomiya-v18-321-quiz-contract.cjs
      - name: Verify 15-step UI state transitions
        run: node scripts/smoke-nishinomiya-v18-state-matrix.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nishinomiya-v18-c-tooltip-evidence
          path: |
            nishinomiya-c-v18-comprehensive/
            nishinomiya-v18-321-quiz-contract/
            nishinomiya-v18-state-matrix/
          if-no-files-found: ignore
