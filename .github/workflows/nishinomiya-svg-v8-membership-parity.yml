name: Nishinomiya SVG V8 Membership Parity
on:
  pull_request:
    paths:
      - 'v2/common/js/town-svg-membership.js'
      - 'v2/nishinomiya-town-svg-master-v8-20261117-pilot.html'
      - 'scripts/test-town-svg-membership.cjs'
      - 'scripts/smoke-nishinomiya-svg-v8-membership-parity.cjs'
      - 'scripts/audit-nishinomiya-v8-321-quiz-contract.cjs'
      - '.github/workflows/nishinomiya-svg-v8-membership-parity.yml'
  workflow_dispatch:
jobs:
  membership:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser engines
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium webkit
      - name: Get Nishinomiya community source
        run: |
          mkdir -p nishinomiya/data
          curl --fail --location --retry 3 --silent --show-error https://raw.githubusercontent.com/Kussoon/nishinomiya/main/data/community-town-map.json -o nishinomiya/data/community-town-map.json
      - name: Validate 321 towns times 26 regions
        run: node scripts/test-town-svg-membership.cjs
      - name: Compare V7 and V8 DOM and labels
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 &
          sleep 3
          node scripts/smoke-nishinomiya-svg-v8-membership-parity.cjs
      - name: Exhaustive 321-town quizzes on V8
        run: node scripts/audit-nishinomiya-v8-321-quiz-contract.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nishinomiya-v8-membership-evidence
          path: |
            nishinomiya-v8-membership-parity/
            nishinomiya-v8-321-quiz-contract/
          if-no-files-found: ignore
