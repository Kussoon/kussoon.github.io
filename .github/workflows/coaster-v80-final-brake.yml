name: Coaster v80 95 percent final approach
on:
  pull_request:
    paths:
      - 'v2/one-stroke-coaster-3d-v80.html'
      - 'scripts/test-coaster-v80-final-brake.cjs'
      - 'scripts/test-coaster-v79-support-clearance.cjs'
      - '.github/workflows/coaster-v80-final-brake.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  contract:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/test-coaster-v80-final-brake.cjs
      - run: node scripts/test-coaster-v79-support-clearance.cjs
