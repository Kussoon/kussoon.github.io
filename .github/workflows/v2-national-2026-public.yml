name: V2 nationwide 2026 public release validation
on:
  pull_request:
    paths:
      - 'v2/national/map.html'
      - 'v2/tests/national-2026-public.browser.cjs'
      - 'local/index.html'
      - 'index.html'
      - '.github/workflows/v2-national-2026-public.yml'
      - 'maps/national-municipalities.html'
      - 'v2/progressive-preview/prefecture-colors.js'
      - 'v2/tests/prefecture-colors-public.browser.cjs'
      - 'v2/tests/fixtures/prefecture-adjacencies.cjs'
permissions:
  contents: read
jobs:
  map-and-navigation:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: v2/tests/browser/package-lock.json
      - run: npm ci --no-audit --no-fund
        working-directory: v2/tests/browser
      - run: npx playwright install --with-deps chromium webkit
        working-directory: v2/tests/browser
      - name: Validate nationwide public page and home/local links in Chromium and WebKit
        run: node v2/tests/national-2026-public.browser.cjs
      - name: Verify fixed adjacent-prefecture colors in all public modes
        run: node v2/tests/prefecture-colors-public.browser.cjs
