name: Nishinomiya V34 quiz status crossover regression
on:
  pull_request:
    paths:
      - 'v2/nishinomiya-town-svg-master-v34-20261117-pilot.html'
      - 'scripts/test-nishinomiya-v34-quiz-status-crossover.cjs'
      - '.github/workflows/nishinomiya-v34-quiz-status-crossover.yml'
  workflow_dispatch:
jobs:
  crossover:
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium webkit
      - run: |
          mkdir -p nishinomiya/data
          curl --fail --location --retry 3 --silent --show-error https://raw.githubusercontent.com/Kussoon/nishinomiya/main/data/community-town-map.json -o nishinomiya/data/community-town-map.json
      - name: Quiz1 to Quiz2 and reverse interruption-state tests
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 &
          sleep 3
          node scripts/test-nishinomiya-v34-quiz-status-crossover.cjs
      - name: Full state matrix
        run: node scripts/smoke-nishinomiya-v34-state-matrix.cjs
      - name: Exhaustive 321-town quiz contracts
        run: node scripts/audit-nishinomiya-v34-321-quiz-contract.cjs
