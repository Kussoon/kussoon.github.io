name: One-shot build Hokkaido office directory
on:
  push:
    branches:
      - v2/hokkaido-office-autobuild-20261102
    paths:
      - v2/scripts/build-hokkaido-offices.py
      - .github/workflows/v2-hokkaido-office-build.yml
permissions:
  contents: write
jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate and validate Hokkaido 189 offices
        run: |
          python v2/scripts/build-hokkaido-offices.py
          node v2/common/js/test-office-directory-data.cjs
      - name: Commit generated data to branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add v2/data/offices/01.json
          if ! git diff --cached --quiet; then
            git commit -m "Generate Hokkaido 189 verified municipality offices"
            git push
          fi
