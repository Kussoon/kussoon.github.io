name: Nishinomiya SVG V10 Shared Quiz Choices
on:
  pull_request:
    paths:
      - 'v2/common/js/town-svg-quiz-choices.js'
      - 'v2/nishinomiya-town-svg-master-v10-20261117-pilot.html'
      - 'scripts/test-town-svg-quiz-choices.cjs'
      - 'scripts/audit-nishinomiya-v10-candidate-parity.cjs'
      - 'scripts/smoke-nishinomiya-svg-v10-choices-parity.cjs'
      - 'scripts/audit-nishinomiya-v10-321-quiz-contract.cjs'
      - 'scripts/smoke-nishinomiya-v10-state-matrix.cjs'
      - '.github/workflows/nishinomiya-svg-v10-quiz-choices.yml'
  workflow_dispatch:
jobs:
  choices:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser engines
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium webkit
      - name: Retrieve Nishinomiya region data
        run: |
          mkdir -p nishinomiya/data
          curl --fail --location --retry 3 --silent --show-error https://raw.githubusercontent.com/Kussoon/nishinomiya/main/data/community-town-map.json -o nishinomiya/data/community-town-map.json
      - name: Pure choice priority contract
        run: node scripts/test-town-svg-quiz-choices.cjs
      - name: Compare V9/V10 all 321 choices and display
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 &
          sleep 3
          node scripts/audit-nishinomiya-v10-candidate-parity.cjs
          node scripts/smoke-nishinomiya-svg-v10-choices-parity.cjs
      - name: Test all 321 quiz problems on V10
        run: node scripts/audit-nishinomiya-v10-321-quiz-contract.cjs
      - name: Run mixed quiz and fullscreen state matrix
        run: node scripts/smoke-nishinomiya-v10-state-matrix.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nishinomiya-v10-choices-evidence
          path: |
            nishinomiya-v10-candidate-parity/
            nishinomiya-v10-quiz-parity/
            nishinomiya-v10-321-quiz-contract/
            nishinomiya-v10-state-matrix/
          if-no-files-found: ignore
