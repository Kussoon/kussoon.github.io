name: National town Takarazuka master spec full audit
on:
  pull_request:
    paths:
      - 'scripts/audit-takarazuka-town-map-master-spec.cjs'
      - '.github/workflows/national-town-takarazuka-master-spec-audit.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  town-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    container:
      image: mcr.microsoft.com/playwright:v1.56.1-noble
    env:
      NODE_PATH: ${{ github.workspace }}/v2/tests/browser/node_modules
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: v2/tests/browser/package-lock.json
      - run: npm ci --prefix v2/tests/browser --no-audit --no-fund
      - name: Fetch shared input data (read-only)
        run: |
          mkdir -p takarazuka/data
          curl --fail --location --retry 3 --silent --show-error https://raw.githubusercontent.com/Kussoon/takarazuka/main/town-search.html -o takarazuka/town-search.html
          curl --fail --location --retry 3 --silent --show-error https://raw.githubusercontent.com/Kussoon/takarazuka/main/data/takarazuka-town-info.json -o takarazuka/data/takarazuka-town-info.json
      - name: Run all 125 town quiz and region contracts in Chromium and WebKit
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 &
          sleep 3
          node scripts/audit-takarazuka-town-map-master-spec.cjs
      - name: Retain named-town evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: takarazuka-125-town-master-spec-audit
          path: artifacts/takarazuka-125-town-master-spec-audit/
          if-no-files-found: ignore
