name: National town phase E label scheduler parity
on:
  pull_request:
    paths:
      - 'v2/common/js/town-svg-label-update-scheduler.js'
      - 'v2/common/js/town-map-takarazuka-label-scheduler-e-20261119-pilot.js'
      - 'v2/takarazuka-town-svg-label-scheduler-e-20261119-pilot.html'
      - 'scripts/test-town-label-scheduler-*.cjs'
      - '.github/workflows/national-town-label-scheduler-e.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  contract:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/test-town-label-scheduler-contract.cjs
      - run: node scripts/test-town-map-master-spec.cjs
  browser:
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/playwright:v1.56.1-noble
    timeout-minutes: 25
    env:
      NODE_PATH: ${{ github.workspace }}/v2/tests/browser/node_modules
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --prefix v2/tests/browser --no-audit --no-fund
      - name: Fetch source data
        run: |
          mkdir -p takarazuka/data
          curl --fail --location --retry 3 --silent --show-error https://raw.githubusercontent.com/Kussoon/takarazuka/main/town-search.html -o takarazuka/town-search.html
          curl --fail --location --retry 3 --silent --show-error https://raw.githubusercontent.com/Kussoon/takarazuka/main/data/takarazuka-town-info.json -o takarazuka/data/takarazuka-town-info.json
      - name: Confirm label geometry and visibility parity at rest
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          sleep 3
          node scripts/test-town-label-scheduler-browser.cjs
