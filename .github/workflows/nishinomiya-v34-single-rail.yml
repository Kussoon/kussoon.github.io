name: Nishinomiya V34 national single-rail UI and 321 quiz parity
on:
  pull_request:
    paths:
      - 'v2/nishinomiya-town-svg-single-rail-20261119-pilot.html'
      - 'scripts/test-nishinomiya-single-rail-ui.cjs'
      - 'scripts/test-nishinomiya-pointer-slider-20261119.cjs'
      - 'v2/common/js/town-svg-zoom-slider-drag.js'
      - 'scripts/audit-nishinomiya-single-rail-321-quiz.cjs'
      - '.github/workflows/nishinomiya-v34-single-rail.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    container:
      image: mcr.microsoft.com/playwright:v1.56.1-noble
    env:
      NODE_PATH: ${{ github.workspace }}/v2/tests/browser/node_modules
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: v2/tests/browser/package-lock.json
      - run: npm ci --prefix v2/tests/browser --no-audit --no-fund
      - name: Fetch Nishinomiya source mapping (read only)
        run: |
          mkdir -p nishinomiya/data
          curl --fail --location --retry 3 --silent --show-error https://raw.githubusercontent.com/Kussoon/nishinomiya/main/data/community-town-map.json -o nishinomiya/data/community-town-map.json
      - name: Verify national slider layout and unchanged V34 labels
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 &
          sleep 3
          node scripts/test-nishinomiya-single-rail-ui.cjs
      - name: Verify finger drag, framed step buttons and city-full slider minimum
        run: |
          node scripts/test-nishinomiya-pointer-slider-20261119.cjs
      - name: Verify all 321 quiz1 and quiz2 on new UI page
        run: |
          python3 -m http.server 8766 --bind 127.0.0.1 &
          sleep 3
          NISHINOMIYA_TEST_BASE=http://127.0.0.1:8766 node scripts/audit-nishinomiya-single-rail-321-quiz.cjs
