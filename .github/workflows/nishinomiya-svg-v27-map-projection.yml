name: Nishinomiya SVG V27 map-geometry displacement audit
on:
  pull_request:
    paths:
      - 'scripts/audit-nishinomiya-v27-map-projection.cjs'
      - '.github/workflows/nishinomiya-svg-v27-map-projection.yml'
  workflow_dispatch:
jobs:
  map-projection:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium webkit
      - name: Download community mapping
        run: |
          mkdir -p nishinomiya/data
          curl --fail --location --retry 3 --silent --show-error https://raw.githubusercontent.com/Kussoon/nishinomiya/main/data/community-town-map.json -o nishinomiya/data/community-town-map.json
      - name: Compare C and V25 map-projection coordinates
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 &
          sleep 3
          node scripts/audit-nishinomiya-v27-map-projection.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nishinomiya-v27-map-projection
          path: nishinomiya-v27-map-projection/
          if-no-files-found: error
