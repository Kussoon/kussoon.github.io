name: V2 2026 cross-region prefecture seam diagnostics
on:
  pull_request:
    paths:
      - 'v2/tools/shared-topology/audit-cross-region-2026.py'
      - '.github/workflows/v2-2026-cross-region-seams.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install geometric diagnostics
        run: python -m pip install --disable-pip-version-check 'shapely==2.1.2'
      - name: Validate all cross-region land-border pairs (diagnostic only)
        run: |
          python -m py_compile v2/tools/shared-topology/audit-cross-region-2026.py
          python v2/tools/shared-topology/audit-cross-region-2026.py v2/data/national/2026-common /tmp/national-cross-region-2026.json
          python - <<'PY'
          import json
          r=json.load(open('/tmp/national-cross-region-2026.json'))
          assert len(r['pairs'])>=20
          assert all(x['samples']>0 for x in r['pairs']), [x for x in r['pairs'] if x['samples']==0]
          assert all(x['medianDistanceM']>=0 for x in r['pairs'])
          print('PASS read-only cross-region diagnostic for',len(r['pairs']),'pairs; need review',r['needReview'])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: national-cross-region-seam-diagnostic-2026
          path: /tmp/national-cross-region-2026.json
          retention-days: 30
