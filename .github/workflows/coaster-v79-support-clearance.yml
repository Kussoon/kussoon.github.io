name: Coaster v79 bridge support clearance comparison
on:
  pull_request:
    paths:
      - 'v2/common/js/one-stroke-coaster-support-clearance.js'
      - 'v2/one-stroke-coaster-3d-v79.html'
      - 'scripts/test-coaster-v79-support-clearance.cjs'
      - '.github/workflows/coaster-v79-support-clearance.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  contract:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/test-coaster-v79-support-clearance.cjs
