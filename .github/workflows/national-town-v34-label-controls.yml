name: National town V34 label and control parity comparison
on:
  pull_request:
    paths:
      - 'v2/data/town-maps/28204-v34-labels.json'
      - 'v2/data/town-maps/28204-approved-preview.json'
      - 'v2/common/js/town-svg-approved-anchors.js'
      - 'v2/common/js/town-svg-topo-projection.js'
      - 'v2/common/js/town-svg-dataset-browser-approved-pilot.js'
      - 'v2/common/css/town-svg-approved-controls-compare.css'
      - 'v2/town-map-shared-browser-approved-20261119-pilot.html'
      - 'scripts/test-national-town-v34-label-control-browser.cjs'
      - '.github/workflows/national-town-v34-label-controls.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  contract:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/test-town-map-master-spec.cjs
      - run: node scripts/test-national-town-dataset-ready.cjs
      - run: node scripts/test-national-town-ready-runtime.cjs
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    container:
      image: mcr.microsoft.com/playwright:v1.56.1-noble
    env:
      NODE_PATH: ${{ github.workspace }}/v2/tests/browser/node_modules
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --prefix v2/tests/browser --no-audit --no-fund
      - name: Fetch approved municipality community source
        run: |
          mkdir -p nishinomiya/data
          curl --fail --location --retry 3 --silent --show-error https://raw.githubusercontent.com/Kussoon/nishinomiya/main/data/community-town-map.json -o nishinomiya/data/community-town-map.json
      - name: Check 324 approved V34 label candidates and compact rail on desktop / mobile
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          sleep 3
          node scripts/test-national-town-v34-label-control-browser.cjs
