name: National Nishinomiya V34 verified data bridge
on:
  pull_request:
    paths:
      - 'v2/common/js/town-svg-verified-membership.js'
      - 'v2/data/town-maps/28204-preview.json'
      - 'scripts/test-national-nishinomiya-accepted-data.cjs'
      - '.github/workflows/national-nishinomiya-accepted-data.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  contract:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Download verified source registry from the existing municipal repository
        run: |
          mkdir -p nishinomiya/data
          curl --fail --location --retry 3 --silent --show-error https://raw.githubusercontent.com/Kussoon/nishinomiya/main/data/community-town-map.json -o nishinomiya/data/community-town-map.json
      - run: node scripts/test-national-nishinomiya-accepted-data.cjs
      - run: node scripts/test-town-map-master-spec.cjs
      - run: node scripts/test-national-town-dataset-ready.cjs
