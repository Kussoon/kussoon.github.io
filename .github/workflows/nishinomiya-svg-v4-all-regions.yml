name: Nishinomiya SVG V4 All 26 Communities
on:
  pull_request:
    paths:
      - 'scripts/smoke-nishinomiya-svg-v4-all-regions.cjs'
      - '.github/workflows/nishinomiya-svg-v4-all-regions.yml'
  workflow_dispatch:
jobs:
  region-matrix:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Chromium and WebKit
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium webkit
      - name: Fetch Nishinomiya region source data
        run: |
          mkdir -p nishinomiya/data
          curl --fail --location --retry 3 --silent --show-error https://raw.githubusercontent.com/Kussoon/nishinomiya/main/data/community-town-map.json -o nishinomiya/data/community-town-map.json
          node scripts/audit-nishinomiya-svg-master-data.cjs
      - name: Run 26-region real-browser matrix
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 &
          sleep 3
          node scripts/smoke-nishinomiya-svg-v4-all-regions.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nishinomiya-svg-v4-26-region-results
          path: nishinomiya-all-regions-shots/
          if-no-files-found: ignore
