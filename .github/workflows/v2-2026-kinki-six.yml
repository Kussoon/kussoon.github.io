name: V2 official 2026 Kinki six prefectures 20m pilot
on:
  pull_request:
    paths:
      - 'v2/tools/shared-topology/prepare-2026-kinki-six.py'
      - '.github/workflows/v2-2026-kinki-six.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install GIS tooling
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends gdal-bin
      - name: Install topology tools
        working-directory: v2/tools/shared-topology
        run: npm install --no-audit --no-fund
      - name: Download official six Kinki prefectures data
        run: python3 v2/tools/shared-topology/prepare-2026-kinki-six.py "$RUNNER_TEMP/n03-input"
      - name: Build one shared topology
        working-directory: v2/tools/shared-topology
        run: |
          node build.mjs --input "$RUNNER_TEMP/n03-input/kinki-six-2026.geojson" --output "$RUNNER_TEMP/v2-2026-kinki-six" --quantization 1000000 --keep 0.02 --expect-prefectures 6 --emit-combined kinki-six.topojson
      - name: Validate prefecture topology
        working-directory: v2/tools/shared-topology
        run: node validate.mjs --dir "$RUNNER_TEMP/v2-2026-kinki-six"
      - name: Generate 20m version and verify region identifiers
        run: |
          python scripts/v2/simplify_topojson.py "$RUNNER_TEMP/v2-2026-kinki-six/kinki-six.topojson" "$RUNNER_TEMP/v2-2026-kinki-six/kinki-six-20m.topojson" --meters 20
          python - <<'PY'
          import json,os,pathlib
          root=pathlib.Path(os.environ['RUNNER_TEMP'])/'v2-2026-kinki-six'
          original=json.loads((root/'kinki-six.topojson').read_text())
          light=json.loads((root/'kinki-six-20m.topojson').read_text())
          assert original['objects']==light['objects']
          assert len(original['arcs'])==len(light['arcs'])
          geometries=light['objects']['municipalities']['geometries']
          assert len(geometries)>200
          codes=[str(g['properties']['N03_007']) for g in geometries]
          assert all(c.startswith(('25','26','27','28','29','30')) for c in codes)
          assert len(set(codes))==len(codes)
          assert len({c[:2] for c in codes})==6
          print('PASS',len(codes),'regions, original', (root/'kinki-six.topojson').stat().st_size,'bytes, light',(root/'kinki-six-20m.topojson').stat().st_size,'bytes')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: kinki-six-2026-20m-pilot
          path: |
            ${{ runner.temp }}/v2-2026-kinki-six/kinki-six.topojson
            ${{ runner.temp }}/v2-2026-kinki-six/kinki-six-20m.topojson
            ${{ runner.temp }}/v2-2026-kinki-six/manifest.json
          retention-days: 14
