name: National town SVG shared 4-choice parity
on:
  pull_request:
    paths:
      - 'v2/common/js/town-svg-quiz-choices.js'
      - 'v2/common/js/town-map-national-choices-takarazuka-20261118-pilot.js'
      - 'v2/takarazuka-town-svg-national-choices-20261118-pilot.html'
      - 'scripts/test-town-map-national-choices-unit.cjs'
      - 'scripts/test-town-map-national-choices-parity.cjs'
      - 'scripts/test-town-map-national-choices-2625-node.cjs'
      - 'scripts/test-takarazuka-national-choices-exceptions.cjs'
      - 'scripts/audit-takarazuka-national-choices-125-regions.cjs'
      - '.github/workflows/town-map-national-choices-parity.yml'
  workflow_dispatch:
jobs:
  parity-fast:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Fetch original Takarazuka SVG and town registry
        run: |
          mkdir -p takarazuka/data
          curl --fail --location --retry 3 --silent --show-error https://raw.githubusercontent.com/Kussoon/takarazuka/main/town-search.html -o takarazuka/town-search.html
          curl --fail --location --retry 3 --silent --show-error https://raw.githubusercontent.com/Kussoon/takarazuka/main/data/takarazuka-town-info.json -o takarazuka/data/takarazuka-town-info.json
      - run: node scripts/test-town-map-national-choices-unit.cjs
      - run: node scripts/test-town-map-national-choices-2625-node.cjs
  parity:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Unit test nationwide selector, including old Nishinomiya contract
        run: node scripts/test-town-map-national-choices-unit.cjs
      - run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium webkit
      - name: Fetch original Takarazuka shape/data input
        run: |
          mkdir -p takarazuka/data
          curl --fail --location --retry 3 --silent --show-error https://raw.githubusercontent.com/Kussoon/takarazuka/main/town-search.html -o takarazuka/town-search.html
          curl --fail --location --retry 3 --silent --show-error https://raw.githubusercontent.com/Kussoon/takarazuka/main/data/takarazuka-town-info.json -o takarazuka/data/takarazuka-town-info.json
      - name: Compare every town choice and every region on before and after
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 &
          sleep 3
          node scripts/test-town-map-national-choices-parity.cjs
      - name: Exercise incorrect answers and interruptions
        run: node scripts/test-takarazuka-national-choices-exceptions.cjs
      - name: Exhaustive 125 town quiz1 and quiz2
        run: node scripts/audit-takarazuka-national-choices-125-regions.cjs
