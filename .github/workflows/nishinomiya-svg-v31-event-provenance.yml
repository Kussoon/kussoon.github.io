name: Nishinomiya SVG V31 zoom event provenance
on:
  pull_request:
    paths:
      - 'scripts/audit-nishinomiya-v31-event-provenance.cjs'
      - '.github/workflows/nishinomiya-svg-v31-event-provenance.yml'
  workflow_dispatch:
jobs:
  trace:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Setup Chromium and WebKit
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium webkit
      - name: Download membership data
        run: |
          mkdir -p nishinomiya/data
          curl --fail --location --retry 3 --silent --show-error https://raw.githubusercontent.com/Kussoon/nishinomiya/main/data/community-town-map.json -o nishinomiya/data/community-town-map.json
      - name: Trace event source and reflow call sites
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 &
          sleep 3
          node scripts/audit-nishinomiya-v31-event-provenance.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nishinomiya-v31-event-trace
          path: nishinomiya-v31-event-provenance/
          if-no-files-found: error
