name: Nishinomiya SVG V29 label state sequence audit
on:
  pull_request:
    paths:
      - 'scripts/audit-nishinomiya-v29-label-state.cjs'
      - '.github/workflows/nishinomiya-svg-v29-label-state.yml'
  workflow_dispatch:
jobs:
  measure:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium webkit
      - name: Community mapping
        run: |
          mkdir -p nishinomiya/data
          curl --fail --location --retry 3 --silent --show-error https://raw.githubusercontent.com/Kussoon/nishinomiya/main/data/community-town-map.json -o nishinomiya/data/community-town-map.json
      - name: Compare V25 and V28 cached anchor states
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 &
          sleep 3
          node scripts/audit-nishinomiya-v29-label-state.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nishinomiya-v29-label-state-evidence
          path: nishinomiya-v29-label-state/
          if-no-files-found: error
