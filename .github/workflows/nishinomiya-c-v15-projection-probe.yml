name: Nishinomiya C vs V15 Projection Cause
on:
  pull_request:
    paths:
      - 'scripts/audit-nishinomiya-c-v15-projection-probe.cjs'
      - '.github/workflows/nishinomiya-c-v15-projection-probe.yml'
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Browser engines
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium webkit
      - name: Retrieve region data
        run: |
          mkdir -p nishinomiya/data
          curl --fail --location --retry 3 --silent --show-error https://raw.githubusercontent.com/Kussoon/nishinomiya/main/data/community-town-map.json -o nishinomiya/data/community-town-map.json
      - name: Compare actual map coordinate transforms
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 &
          sleep 3
          node scripts/audit-nishinomiya-c-v15-projection-probe.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nishinomiya-c-v15-projection-evidence
          path: nishinomiya-c-v15-projection-probe/
          if-no-files-found: ignore
