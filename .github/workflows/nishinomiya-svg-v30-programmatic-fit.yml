name: Nishinomiya SVG V30 distinguish programmatic fit
on:
  pull_request:
    paths:
      - 'v2/nishinomiya-town-svg-master-v30-20261117-pilot.html'
      - 'scripts/*v30*'
      - '.github/workflows/nishinomiya-svg-v30-programmatic-fit.yml'
  workflow_dispatch:
jobs:
  compare:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser engines
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium webkit
      - name: Download town membership data
        run: |
          mkdir -p nishinomiya/data
          curl --fail --location --retry 3 --silent --show-error https://raw.githubusercontent.com/Kussoon/nishinomiya/main/data/community-town-map.json -o nishinomiya/data/community-town-map.json
      - name: Compare C against V30 across 32 map states
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 &
          sleep 3
          node scripts/audit-nishinomiya-c-v30-glyph-metrics.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nishinomiya-v30-glyph-geometry
          path: nishinomiya-c-v30-glyph-metrics/
          if-no-files-found: error
      - name: Exhaustive quiz1 and quiz2 contracts
        run: node scripts/audit-nishinomiya-v30-321-quiz-contract.cjs
      - name: 15-transition UI state matrix
        run: node scripts/smoke-nishinomiya-v30-state-matrix.cjs
