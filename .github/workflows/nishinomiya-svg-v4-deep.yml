name: Nishinomiya SVG V4 Deep Acceptance
on:
  pull_request:
    paths:
      - 'scripts/smoke-nishinomiya-svg-v4-deep-acceptance.cjs'
      - '.github/workflows/nishinomiya-svg-v4-deep.yml'
  workflow_dispatch:
jobs:
  browser-deep:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Chromium
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Fetch external Nishinomiya community mapping
        run: |
          mkdir -p nishinomiya/data
          curl --fail --location --retry 3 --silent --show-error https://raw.githubusercontent.com/Kussoon/nishinomiya/main/data/community-town-map.json -o nishinomiya/data/community-town-map.json
          node scripts/audit-nishinomiya-svg-master-data.cjs
      - name: Run detailed acceptance in real Chromium
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 &
          sleep 3
          node scripts/smoke-nishinomiya-svg-v4-deep-acceptance.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nishinomiya-svg-v4-deep-audit-screenshots
          path: nishinomiya-svg-deep-shots/
          if-no-files-found: ignore
