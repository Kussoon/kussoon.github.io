name: National town one-label SSOT v1.5 integrated comparison
on:
  pull_request:
    paths:
      - 'v2/docs/town-map/TOWN_MAP_MASTER_SPEC.md'
      - 'v2/common/js/town-svg-dataset-browser-one-label-pilot.js'
      - 'v2/town-map-shared-browser-one-label-20261120-pilot.html'
      - 'scripts/test-town-one-label-ssot-integration.cjs'
      - '.github/workflows/town-one-label-ssot-integration.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  contract:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/test-town-map-master-spec.cjs
      - run: node scripts/test-town-one-label-fit.cjs
      - run: node scripts/test-national-town-question-scoped-colors.cjs
      - run: node scripts/test-national-town-dataset-ready.cjs
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    container:
      image: mcr.microsoft.com/playwright:v1.56.1-noble
    env:
      NODE_PATH: ${{ github.workspace }}/v2/tests/browser/node_modules
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --prefix v2/tests/browser --no-audit --no-fund
      - name: Fetch certified source town registry
        run: |
          mkdir -p nishinomiya/data
          curl --fail --location --retry 3 --silent --show-error https://raw.githubusercontent.com/Kussoon/nishinomiya/main/data/community-town-map.json -o nishinomiya/data/community-town-map.json
      - name: Check one-label page and historical quiz state in WebKit and Chromium
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          sleep 3
          node scripts/test-town-one-label-ssot-integration.cjs
