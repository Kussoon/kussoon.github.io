name: Nishinomiya SVG Master V1 Regression
on:
  pull_request:
    paths:
      - 'v2/nishinomiya-town-svg-master-v1-20261116-pilot.html'
      - 'v2/tests/nishinomiya-svg-master-v1-20261116.test.cjs'
      - 'v2/tests/nishinomiya-svg-master-contract-20261116.test.cjs'
      - 'v2/docs/town-map/NISHINOMIYA_SVG_MASTER_SPEC_20261116.md'
      - 'scripts/smoke-nishinomiya-svg-master-v1.cjs'
      - '.github/workflows/nishinomiya-svg-master-v1.yml'
  workflow_dispatch:

jobs:
  audit-and-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Source contracts
        run: |
          node v2/tests/nishinomiya-svg-master-v1-20261116.test.cjs
          node v2/tests/nishinomiya-svg-master-contract-20261116.test.cjs
      - name: Install browser test runner
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium webkit
      - name: Fetch primary city community data for local route
        run: |
          mkdir -p nishinomiya/data
          curl --fail --location --retry 3 --silent --show-error https://raw.githubusercontent.com/Kussoon/nishinomiya/main/data/community-town-map.json -o nishinomiya/data/community-town-map.json
          test -s nishinomiya/data/community-town-map.json
      - name: Launch local static server and run browser smoke
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 &
          sleep 3
          node scripts/smoke-nishinomiya-svg-master-v1.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nishinomiya-svg-master-v1-screenshots
          path: svg-master-v1-screenshots/
          if-no-files-found: ignore
