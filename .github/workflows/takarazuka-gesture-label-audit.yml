name: Takarazuka gesture and label zoom acceptance
on:
  pull_request:
    paths:
      - 'scripts/audit-takarazuka-gestures-label-zoom.cjs'
      - '.github/workflows/takarazuka-gesture-label-audit.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    container:
      image: mcr.microsoft.com/playwright:v1.56.1-noble
    env:
      NODE_PATH: ${{ github.workspace }}/v2/tests/browser/node_modules
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: v2/tests/browser/package-lock.json
      - run: npm ci --prefix v2/tests/browser --no-audit --no-fund
      - name: Fetch source data (read-only)
        run: |
          mkdir -p takarazuka/data
          curl --fail --location --retry 3 --silent --show-error https://raw.githubusercontent.com/Kussoon/takarazuka/main/town-search.html -o takarazuka/town-search.html
          curl --fail --location --retry 3 --silent --show-error https://raw.githubusercontent.com/Kussoon/takarazuka/main/data/takarazuka-town-info.json -o takarazuka/data/takarazuka-town-info.json
      - name: Test gestures and label visibility
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 &
          sleep 3
          node scripts/audit-takarazuka-gestures-label-zoom.cjs
      - name: Preserve diagnostic report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: takarazuka-gesture-label-zoom-report
          path: artifacts/takarazuka-gesture-label-check/
          if-no-files-found: ignore
