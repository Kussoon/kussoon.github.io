name: National town shared SVG label renderer parity
on:
  pull_request:
    paths:
      - 'v2/common/js/town-map-common-render-takarazuka-20261118-pilot.js'
      - 'v2/takarazuka-town-svg-common-render-20261118-pilot.html'
      - 'scripts/test-national-town-shared-render-browser-parity.cjs'
      - '.github/workflows/national-town-shared-label-render-parity.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  parity:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      NODE_PATH: ${{ github.workspace }}/v2/tests/browser/node_modules
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: v2/tests/browser/package-lock.json
      - run: npm ci --prefix v2/tests/browser --no-audit --no-fund
      - run: ./v2/tests/browser/node_modules/.bin/playwright install --with-deps chromium webkit
      - name: Fetch approved Takarazuka source
        run: |
          mkdir -p takarazuka/data
          curl --fail --location --retry 3 --silent --show-error https://raw.githubusercontent.com/Kussoon/takarazuka/main/town-search.html -o takarazuka/town-search.html
          curl --fail --location --retry 3 --silent --show-error https://raw.githubusercontent.com/Kussoon/takarazuka/main/data/takarazuka-town-info.json -o takarazuka/data/takarazuka-town-info.json
      - name: Compare all labels in 10 states across 3 browsers
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 &
          sleep 3
          node scripts/test-national-town-shared-render-browser-parity.cjs
      - name: Preserve 125 town and 20 region quiz contracts
        run: |
          node scripts/audit-takarazuka-multipart-label-125-regions.cjs
          node scripts/test-takarazuka-multipart-label-exceptions.cjs
