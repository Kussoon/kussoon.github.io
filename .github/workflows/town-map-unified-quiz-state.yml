name: National town SVG shared quiz state comparison
on:
  pull_request:
    paths:
      - 'v2/takarazuka-town-svg-unified-quiz-state-20261118-pilot.html'
      - 'v2/common/js/town-map-unified-quiz-takarazuka-20261118-pilot.js'
      - 'scripts/test-town-map-unified-quiz-contract.cjs'
      - 'scripts/test-takarazuka-ssot-unified-quiz-exceptions.cjs'
      - 'scripts/audit-takarazuka-unified-quiz-125-regions.cjs'
      - '.github/workflows/town-map-unified-quiz-state.yml'
  workflow_dispatch:
jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 28
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Common quiz contract
        run: node scripts/test-town-map-unified-quiz-contract.cjs
      - name: Browser engines
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium webkit
      - name: Fetch source town data
        run: |
          mkdir -p takarazuka/data
          curl --fail --location --retry 3 --silent --show-error https://raw.githubusercontent.com/Kussoon/takarazuka/main/town-search.html -o takarazuka/town-search.html
          curl --fail --location --retry 3 --silent --show-error https://raw.githubusercontent.com/Kussoon/takarazuka/main/data/takarazuka-town-info.json -o takarazuka/data/takarazuka-town-info.json
      - name: Run quiz exception transitions in shared module trial
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 &
          sleep 3
          node scripts/test-takarazuka-ssot-unified-quiz-exceptions.cjs
      - name: All 125 towns, two quiz modes, 20 regions
        run: node scripts/audit-takarazuka-ssot-125-quiz-regions.cjs
