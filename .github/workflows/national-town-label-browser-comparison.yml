name: National town label real-browser comparison
on:
  pull_request:
    paths:
      - 'scripts/test-national-town-label-browser-comparison.cjs'
      - '.github/workflows/national-town-label-browser-comparison.yml'
      - 'v2/common/js/town-svg-*.js'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    container:
      image: mcr.microsoft.com/playwright:v1.56.1-noble
    env:
      NODE_PATH: ${{ github.workspace }}/v2/tests/browser/node_modules
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: v2/tests/browser/package-lock.json
      - run: npm ci --prefix v2/tests/browser --no-audit --no-fund
      - name: Fetch linked source data read-only
        run: |
          mkdir -p nishinomiya/data takarazuka/data
          curl --fail --location --retry 3 --silent --show-error https://raw.githubusercontent.com/Kussoon/nishinomiya/main/data/community-town-map.json -o nishinomiya/data/community-town-map.json
          curl --fail --location --retry 3 --silent --show-error https://raw.githubusercontent.com/Kussoon/takarazuka/main/town-search.html -o takarazuka/town-search.html
          curl --fail --location --retry 3 --silent --show-error https://raw.githubusercontent.com/Kussoon/takarazuka/main/data/takarazuka-town-info.json -o takarazuka/data/takarazuka-town-info.json
      - name: Capture labels at desktop / mobile / small screen
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 &
          sleep 3
          node scripts/test-national-town-label-browser-comparison.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: national-town-label-comparison
          path: artifacts/national-town-label-comparison/
          if-no-files-found: ignore
