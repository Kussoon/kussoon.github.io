name: Nishinomiya SVG V28 label reset
on:
  pull_request:
    paths:
      - 'v2/nishinomiya-town-svg-master-v28-20261117-pilot.html'
      - 'scripts/*v28*'
      - '.github/workflows/nishinomiya-svg-v28-reading-reset.yml'
  workflow_dispatch:
jobs:
  compare:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium webkit
      - name: Community map data
        run: |
          mkdir -p nishinomiya/data
          curl --fail --location --retry 3 --silent --show-error https://raw.githubusercontent.com/Kussoon/nishinomiya/main/data/community-town-map.json -o nishinomiya/data/community-town-map.json
      - name: C versus V28 glyph
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 &
          sleep 3
          node scripts/audit-nishinomiya-c-v28-glyph-metrics.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nishinomiya-v28-geometry
          path: nishinomiya-c-v28-glyph-metrics/
          if-no-files-found: error
      - name: Quiz all 321 towns
        run: node scripts/audit-nishinomiya-v28-321-quiz-contract.cjs
      - name: UI transition matrix
        run: node scripts/smoke-nishinomiya-v28-state-matrix.cjs
