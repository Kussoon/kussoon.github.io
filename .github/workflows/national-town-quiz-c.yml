name: National town phase C quiz UI parity
on:
  pull_request:
    paths:
      - 'v2/nishinomiya-town-svg-quiz-c-20261119-pilot.html'
      - 'v2/takarazuka-town-svg-quiz-c-20261119-pilot.html'
      - 'scripts/test-national-town-quiz-c-browser.cjs'
      - '.github/workflows/national-town-quiz-c.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  contract:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/test-national-town-quiz-ui-contract.cjs
      - run: node scripts/test-town-map-master-spec.cjs
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    # Use Playwright's version-matched image: browser binaries and OS deps are
    # already installed, so CI cannot stall before reaching app/browser tests.
    container:
      image: mcr.microsoft.com/playwright:v1.56.1-noble
    env:
      NODE_PATH: ${{ github.workspace }}/v2/tests/browser/node_modules
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: v2/tests/browser/package-lock.json
      - run: npm ci --prefix v2/tests/browser --no-audit --no-fund
      - name: Fetch source datasets
        run: |
          mkdir -p nishinomiya/data takarazuka/data
          curl --fail --location --retry 3 --silent --show-error https://raw.githubusercontent.com/Kussoon/nishinomiya/main/data/community-town-map.json -o nishinomiya/data/community-town-map.json
          curl --fail --location --retry 3 --silent --show-error https://raw.githubusercontent.com/Kussoon/takarazuka/main/town-search.html -o takarazuka/town-search.html
          curl --fail --location --retry 3 --silent --show-error https://raw.githubusercontent.com/Kussoon/takarazuka/main/data/takarazuka-town-info.json -o takarazuka/data/takarazuka-town-info.json
      - name: Compare B versus C browser states for both municipalities
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 &
          sleep 3
          node scripts/test-national-town-quiz-c-browser.cjs
      - name: Preserve complete 321-town quiz regression
        # A server started in a previous Actions step is not guaranteed to
        # survive its process cleanup. Own the server for this entire audit.
        run: |
          python3 -m http.server 8877 --bind 127.0.0.1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          sleep 3
          NISHINOMIYA_TEST_BASE=http://127.0.0.1:8877 node scripts/audit-nishinomiya-v34-shared-update-321-quiz.cjs
