name: Nishinomiya SVG V14 Shared Polygon Render
on:
  pull_request:
    paths:
      - 'v2/common/js/town-svg-render.js'
      - 'v2/nishinomiya-town-svg-master-v14-20261117-pilot.html'
      - 'scripts/*v14*'
      - 'scripts/test-town-svg-render.cjs'
      - '.github/workflows/nishinomiya-svg-v14-render.yml'
  workflow_dispatch:
jobs:
  render:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser engines
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium webkit
      - name: Retrieve Nishinomiya region data
        run: |
          mkdir -p nishinomiya/data
          curl --fail --location --retry 3 --silent --show-error https://raw.githubusercontent.com/Kussoon/nishinomiya/main/data/community-town-map.json -o nishinomiya/data/community-town-map.json
      - name: Shared polygon rendering unit contract
        run: node scripts/test-town-svg-render.cjs
      - name: Compare V13 and V14 visual layout and quiz choices
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 &
          sleep 3
          node scripts/smoke-nishinomiya-svg-v14-render-parity.cjs
          node scripts/audit-nishinomiya-v14-candidate-parity.cjs
      - name: Test all 321 towns in quizzes 1 and 2
        run: node scripts/audit-nishinomiya-v14-321-quiz-contract.cjs
      - name: Test 15-step UI state transitions
        run: node scripts/smoke-nishinomiya-v14-state-matrix.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nishinomiya-v14-render-evidence
          path: |
            nishinomiya-v14-candidate-parity/
            nishinomiya-v14-quiz-parity/
            nishinomiya-v14-321-quiz-contract/
            nishinomiya-v14-state-matrix/
          if-no-files-found: ignore
