name: Coaster v83 loop join and goal celebration
on:
  pull_request:
    paths:
      - 'v2/one-stroke-coaster-3d-v82.html'
      - 'v2/one-stroke-coaster-3d-v83.html'
      - 'scripts/test-coaster-v83-loop-join-confetti.cjs'
      - '.github/workflows/coaster-v83-loop-join-confetti.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  coaster-v83:
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/playwright:v1.56.1-noble
    timeout-minutes: 20
    env:
      NODE_PATH: ${{ github.workspace }}/v2/tests/browser/node_modules
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --prefix v2/tests/browser --no-audit --no-fund
      - name: Compare actual loop clearance, curvature, and goal confetti in Chromium and WebKit
        run: node scripts/test-coaster-v83-loop-join-confetti.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coaster-v83-goal-visual-check
          path: v2/verification/coaster-v83/goal-confetti.png
          if-no-files-found: ignore
