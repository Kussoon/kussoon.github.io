name: National town cross-city SVG interaction audit
on:
  pull_request:
    paths:
      - 'scripts/audit-national-town-cross-city-interactions.cjs'
      - '.github/workflows/national-town-cross-city-interactions.yml'
      - 'v2/common/js/town-svg-*.js'
      - 'v2/nishinomiya-town-svg-multipart-label-20261118-pilot.html'
      - 'v2/takarazuka-town-svg-multipart-label-20261118-pilot.html'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cross-city:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      NODE_PATH: ${{ github.workspace }}/v2/tests/browser/node_modules
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: v2/tests/browser/package-lock.json
      - name: Install pinned Playwright
        run: npm ci --prefix v2/tests/browser --no-audit --no-fund
      - name: Install two browser engines
        run: ./v2/tests/browser/node_modules/.bin/playwright install --with-deps chromium webkit
      - name: Fetch approved town source datasets
        run: |
          mkdir -p nishinomiya/data takarazuka/data
          curl --fail --location --retry 3 --silent --show-error https://raw.githubusercontent.com/Kussoon/nishinomiya/main/data/community-town-map.json -o nishinomiya/data/community-town-map.json
          curl --fail --location --retry 3 --silent --show-error https://raw.githubusercontent.com/Kussoon/takarazuka/main/town-search.html -o takarazuka/town-search.html
          curl --fail --location --retry 3 --silent --show-error https://raw.githubusercontent.com/Kussoon/takarazuka/main/data/takarazuka-town-info.json -o takarazuka/data/takarazuka-town-info.json
      - name: Cross-city label, zoom, region and fullscreen matrix
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 &
          sleep 3
          node scripts/audit-national-town-cross-city-interactions.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: national-town-cross-city-operation-states
          path: national-town-cross-city-audit/
          if-no-files-found: ignore
