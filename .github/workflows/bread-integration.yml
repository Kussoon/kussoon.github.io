name: Bread final integration verification
on:
  pull_request:
    paths:
      - 'v2/verification/bread-integration/**'
      - 'v2/tests/*bread-integration*'
      - 'v2/tests/bread-marker-refresh.browser.cjs'
      - '.github/workflows/bread-integration.yml'
permissions:
  contents: read
jobs:
  browser-and-data:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        engine: [chromium, webkit]
    steps:
      - uses: actions/checkout@v4
      - name: Fetch pinned comparison sources without changing any branch
        run: |
          python3 - <<'PY'
          import subprocess,json
          d=json.load(open('v2/verification/bread-integration/20261111/sources.json'))
          subprocess.run(['git','fetch','--no-tags','--depth=3','origin',d['main'],d['pr414'],d['pr415']],check=True)
          PY
      - run: python3 v2/tests/verify-bread-master.py
      - run: python3 v2/tests/verify-bread-integration.py
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: v2/tests/browser/package-lock.json
      - run: npm ci --no-audit --no-fund
        working-directory: v2/tests/browser
      - run: npx playwright install --with-deps ${{ matrix.engine }}
        working-directory: v2/tests/browser
      - name: Fetch and verify MarkerCluster 1.5.3
        run: |
          curl -fsSL --retry 3 --max-time 30 'https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js' -o "$RUNNER_TEMP/leaflet.markercluster.js"
          echo "1e4e1d22972a3926f48598e0caf14e3fe7049835d428a344fed4f9e3665b3508  $RUNNER_TEMP/leaflet.markercluster.js" | sha256sum -c -
      - name: PR415 before-after and unchanged regression
        run: node v2/tests/bread-integration.browser.cjs
        env:
          KUSSOON_BROWSER_ENGINES: ${{ matrix.engine }}
          KUSSOON_BROWSER_ARTIFACTS: ${{ runner.temp }}/bread-integration
          KUSSOON_CLUSTER_FIXTURE: ${{ runner.temp }}/leaflet.markercluster.js
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bread-integration-${{ matrix.engine }}
          path: |
            ${{ runner.temp }}/bread-integration
            v2/verification/bread-integration/20261111/validation.json
            v2/verification/bread-integration/20261111/all-263-diff.csv
          retention-days: 14
