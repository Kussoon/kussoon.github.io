name: Nationwide town-map shared region navigation B
on:
  pull_request:
    paths:
      - 'v2/common/js/town-svg-community-navigation.js'
      - 'v2/nishinomiya-town-svg-community-b-20261119-pilot.html'
      - 'v2/takarazuka-town-svg-community-b-20261119-pilot.html'
      - 'v2/common/js/town-map-result-navigation-takarazuka-community-b-20261119-pilot.js'
      - 'scripts/test-town-svg-community-b-browser-20261119.cjs'
      - 'scripts/test-nishinomiya-community-b-20261119.cjs'
      - 'scripts/test-takarazuka-community-b-20261119.cjs'
      - 'scripts/audit-nishinomiya-community-b-321-quiz.cjs'
      - '.github/workflows/town-svg-community-b-comparison.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    container:
      image: mcr.microsoft.com/playwright:v1.56.1-noble
    env:
      NODE_PATH: ${{ github.workspace }}/v2/tests/browser/node_modules
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: v2/tests/browser/package-lock.json
      - run: npm ci --prefix v2/tests/browser --no-audit --no-fund
      - name: Fetch preserved town source data, read only
        run: |
          mkdir -p nishinomiya/data takarazuka/data
          curl --fail --location --retry 3 --silent --show-error https://raw.githubusercontent.com/Kussoon/nishinomiya/main/data/community-town-map.json -o nishinomiya/data/community-town-map.json
          curl --fail --location --retry 3 --silent --show-error https://raw.githubusercontent.com/Kussoon/takarazuka/main/town-search.html -o takarazuka/town-search.html
          curl --fail --location --retry 3 --silent --show-error https://raw.githubusercontent.com/Kussoon/takarazuka/main/data/takarazuka-town-info.json -o takarazuka/data/takarazuka-town-info.json
      - name: Verify nationwide region state on Chromium and WebKit
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 &
          python3 -m http.server 8772 --bind 127.0.0.1 &
          sleep 3
          node scripts/test-town-svg-community-b-browser-20261119.cjs
      - name: Keep existing town slider and control behavior on both cities
        run: |
          node scripts/test-nishinomiya-community-b-20261119.cjs
          node scripts/test-takarazuka-community-b-20261119.cjs
      - name: Exhaustively verify 321-town quiz 1 and 2 in new Nishinomiya page
        run: |
          NISHINOMIYA_TEST_BASE=http://127.0.0.1:8765 node scripts/audit-nishinomiya-community-b-321-quiz.cjs
