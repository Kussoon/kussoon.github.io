name: Nishinomiya SVG V22 directional glyph diagnostics
on:
  pull_request:
    paths:
      - 'scripts/audit-nishinomiya-c-v22-directional-glyph.cjs'
      - '.github/workflows/nishinomiya-svg-v22-directional-glyph.yml'
  workflow_dispatch:
jobs:
  compare:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Chromium and WebKit
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium webkit
      - name: Download community mapping
        run: |
          mkdir -p nishinomiya/data
          curl --fail --location --retry 3 --silent --show-error https://raw.githubusercontent.com/Kussoon/nishinomiya/main/data/community-town-map.json -o nishinomiya/data/community-town-map.json
      - name: Diagnose direction of C/V21 name and reading differences
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 &
          sleep 3
          node scripts/audit-nishinomiya-c-v22-directional-glyph.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nishinomiya-v22-directional-glyph-evidence
          path: nishinomiya-c-v22-directional-glyph/
          if-no-files-found: error
