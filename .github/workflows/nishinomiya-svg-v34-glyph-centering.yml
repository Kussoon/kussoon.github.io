name: Nishinomiya SVG V34 centered no-reading glyph
on:
  pull_request:
    paths:
      - 'v2/nishinomiya-town-svg-master-v34-20261117-pilot.html'
      - 'scripts/*v34*'
      - '.github/workflows/nishinomiya-svg-v34-glyph-centering.yml'
  workflow_dispatch:
jobs:
  compare:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium webkit
      - run: |
          mkdir -p nishinomiya/data
          curl --fail --location --retry 3 --silent --show-error https://raw.githubusercontent.com/Kussoon/nishinomiya/main/data/community-town-map.json -o nishinomiya/data/community-town-map.json
      - name: Compare C versus V34 with 26 regions and direct links
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 &
          sleep 3
          node scripts/audit-nishinomiya-c-v34-glyph-metrics.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nishinomiya-v34-geometry
          path: nishinomiya-c-v34-glyph-metrics/
          if-no-files-found: error
      - name: Quiz1 and Quiz2 for all 321 town names
        run: node scripts/audit-nishinomiya-v34-321-quiz-contract.cjs
      - name: UI state transitions on PC and mobile
        run: node scripts/smoke-nishinomiya-v34-state-matrix.cjs
