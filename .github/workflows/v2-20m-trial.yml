name: Generate V2 20m trial data
on:
  push:
    branches: [v2/2026-prebuilt-20m]
    paths:
      - 'scripts/v2/generate_osaka_nara_20m.py'
      - '.github/workflows/v2-20m-trial.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v2/2026-prebuilt-20m
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/v2/generate_osaka_nara_20m.py
      - name: Commit generated trial file
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add v2/data/national/2026-common/osaka-nara-20m.topojson
          git diff --cached --quiet || (git commit -m 'Generate 20m trial topology' && git push)
