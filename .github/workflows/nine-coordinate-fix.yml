name: Nine-store integrated coordinate verification
on:
  pull_request:
    paths:
      - 'data/bread/**'
      - 'v2/verification/bread-coordinate-audit/**'
      - 'v2/tests/nine-coordinate-fix.browser.cjs'
      - 'v2/tests/verify-nine-coordinate-fix.py'
      - '.github/workflows/nine-coordinate-fix.yml'
permissions:
  contents: read
jobs:
  nine-stores-integrated:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Verify five incremental and nine cumulative coordinate changes
        run: python3 v2/tests/verify-nine-coordinate-fix.py
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: v2/tests/browser/package-lock.json
      - run: npm ci --no-audit --no-fund
        working-directory: v2/tests/browser
      - run: npx playwright install --with-deps chromium webkit
        working-directory: v2/tests/browser
      - name: Fetch the production cluster library for deterministic browser delivery
        run: |
          curl -fsSL --retry 3 --max-time 30 'https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js' -o "$RUNNER_TEMP/leaflet.markercluster.js"
          echo "1e4e1d22972a3926f48598e0caf14e3fe7049835d428a344fed4f9e3665b3508  $RUNNER_TEMP/leaflet.markercluster.js" | sha256sum -c -
      - run: node v2/tests/nine-coordinate-fix.browser.cjs
        env:
          KUSSOON_BROWSER_ARTIFACTS: ${{ runner.temp }}/nine-browser
          KUSSOON_CLUSTER_FIXTURE: ${{ runner.temp }}/leaflet.markercluster.js
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nine-store-browser-verification
          path: ${{ runner.temp }}/nine-browser
          retention-days: 14
          if-no-files-found: warn
