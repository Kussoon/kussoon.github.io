name: National town 321 label placement rule audit
on:
  pull_request:
    paths:
      - 'v2/common/js/town-svg-label-rule-audit.js'
      - 'v2/town-map-label-rule-audit-20261120-pilot.html'
      - 'scripts/test-national-town-label-rule-audit.cjs'
      - 'scripts/test-national-town-label-rule-browser.cjs'
      - '.github/workflows/national-town-label-rule-audit.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  contract:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/test-national-town-label-rule-audit.cjs
      - run: node scripts/test-town-map-master-spec.cjs
      - run: node scripts/test-national-town-geojson-components.cjs
      - run: node scripts/test-national-town-question-scoped-colors.cjs
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    container:
      image: mcr.microsoft.com/playwright:v1.56.1-noble
    env:
      NODE_PATH: ${{ github.workspace }}/v2/tests/browser/node_modules
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --prefix v2/tests/browser --no-audit --no-fund
      - name: Compare all 321 approved V34 labels to automatic candidates
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          sleep 3
          node scripts/test-national-town-label-rule-browser.cjs
