name: National town SVG label rendering parity
on:
  pull_request:
    paths:
      - 'v2/common/js/town-svg-labels.js'
      - 'v2/common/js/town-map-unified-label-render-takarazuka-20261118-pilot.js'
      - 'v2/takarazuka-town-svg-unified-label-render-20261118-pilot.html'
      - 'scripts/test-national-label-render-unit.cjs'
      - 'scripts/test-national-label-render-parity.cjs'
      - '.github/workflows/national-town-svg-label-render.yml'
  workflow_dispatch:
jobs:
  unit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/test-national-label-render-unit.cjs
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium webkit
      - name: Fetch original Takarazuka data
        run: |
          mkdir -p takarazuka/data
          curl --fail --location --retry 3 --silent --show-error https://raw.githubusercontent.com/Kussoon/takarazuka/main/town-search.html -o takarazuka/town-search.html
          curl --fail --location --retry 3 --silent --show-error https://raw.githubusercontent.com/Kussoon/takarazuka/main/data/takarazuka-town-info.json -o takarazuka/data/takarazuka-town-info.json
      - name: Compare every label DOM and position in 10 view states
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 &
          sleep 3
          node scripts/test-national-label-render-parity.cjs
      - name: Full Takarazuka 125-town quiz1 and quiz2
        run: node scripts/audit-takarazuka-label-render-125-regions.cjs
      - name: Quiz interruption and retries
        run: node scripts/test-takarazuka-label-render-exceptions.cjs
