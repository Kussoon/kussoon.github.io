name: Nishinomiya SVG V26 regional-direction audit
on:
  pull_request:
    paths:
      - 'scripts/audit-nishinomiya-c-v26-region-direction.cjs'
      - '.github/workflows/nishinomiya-svg-v26-region-direction.yml'
  workflow_dispatch:
jobs:
  compare:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browsers
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium webkit
      - name: Download town/region membership mapping
        run: |
          mkdir -p nishinomiya/data
          curl --fail --location --retry 3 --silent --show-error https://raw.githubusercontent.com/Kussoon/nishinomiya/main/data/community-town-map.json -o nishinomiya/data/community-town-map.json
      - name: Measure directional residuals, all 26 regions and reset
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 &
          sleep 3
          node scripts/audit-nishinomiya-c-v26-region-direction.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nishinomiya-v26-region-direction-evidence
          path: nishinomiya-c-v26-region-direction/
          if-no-files-found: error
