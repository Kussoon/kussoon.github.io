name: National town Nishinomiya calibrated label-update parity
on:
  pull_request:
    paths:
      - 'v2/common/js/town-svg-label-update.js'
      - 'v2/nishinomiya-town-svg-common-update-20261118-pilot.html'
      - 'scripts/*calibrated-update*.cjs'
      - 'scripts/*v34-shared-update*.cjs'
      - '.github/workflows/national-town-v34-shared-update.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  contract:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          node scripts/test-national-town-label-update-contract.cjs
          node scripts/test-national-town-calibrated-update-contract.cjs
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      NODE_PATH: ${{ github.workspace }}/v2/tests/browser/node_modules
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: v2/tests/browser/package-lock.json
      - run: npm ci --prefix v2/tests/browser --no-audit --no-fund
      - run: ./v2/tests/browser/node_modules/.bin/playwright install --with-deps chromium webkit
      - name: Fetch approved Nishinomiya region source
        run: |
          mkdir -p nishinomiya/data
          curl --fail --location --retry 3 --silent --show-error https://raw.githubusercontent.com/Kussoon/nishinomiya/main/data/community-town-map.json -o nishinomiya/data/community-town-map.json
      - name: Compare approved 324 labels in desktop and WebKit states
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 &
          sleep 3
          node scripts/smoke-nishinomiya-v34-shared-update-parity.cjs
      - name: Check all 321 town questions in quiz 1 and 2
        run: node scripts/audit-nishinomiya-v34-shared-update-321-quiz.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nishinomiya-v34-shared-update-evidence
          path: |
            nishinomiya-v34-shared-update-parity/
            nishinomiya-v34-shared-update-321-quiz-contract/
          if-no-files-found: ignore
