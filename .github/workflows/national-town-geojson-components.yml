name: National town geometry-first component label audit
on:
  pull_request:
    paths:
      - 'v2/common/js/town-geojson-component-labels.js'
      - 'scripts/test-national-town-geojson-components.cjs'
      - 'scripts/test-national-town-geojson-real-browser.cjs'
      - '.github/workflows/national-town-geojson-components.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  contract:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/test-national-town-geojson-components.cjs
      - run: node scripts/test-town-map-master-spec.cjs
      - run: node scripts/test-national-town-dataset-ready.cjs
      - run: node scripts/test-national-town-ready-runtime.cjs
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    container:
      image: mcr.microsoft.com/playwright:v1.56.1-noble
    env:
      NODE_PATH: ${{ github.workspace }}/v2/tests/browser/node_modules
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --prefix v2/tests/browser --no-audit --no-fund
      - name: Fetch certified municipality registry
        run: |
          mkdir -p nishinomiya/data
          curl --fail --location --retry 3 --silent --show-error https://raw.githubusercontent.com/Kussoon/nishinomiya/main/data/community-town-map.json -o nishinomiya/data/community-town-map.json
      - name: Audit real TopoJSON parts without changing approved labels or quiz
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          sleep 3
          node scripts/test-national-town-geojson-real-browser.cjs
