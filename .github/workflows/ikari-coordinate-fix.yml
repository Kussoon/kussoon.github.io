name: Ikari four-store coordinate fix
on:
  pull_request:
    paths:
      - 'data/bread/**'
      - 'v2/verification/bread-coordinate-audit/**'
      - 'v2/tests/ikari-coordinate-fix.browser.cjs'
      - 'v2/tests/verify-ikari-coordinate-fix.py'
      - '.github/workflows/ikari-coordinate-fix.yml'
permissions:
  contents: read
jobs:
  four-stores-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Verify four-store-only Excel and HTML changes
        run: python3 v2/tests/verify-ikari-coordinate-fix.py
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: v2/tests/browser/package-lock.json
      - run: npm ci --no-audit --no-fund
        working-directory: v2/tests/browser
      - run: npx playwright install --with-deps chromium webkit
        working-directory: v2/tests/browser
      - run: node v2/tests/ikari-coordinate-fix.browser.cjs
        env:
          KUSSOON_BROWSER_ARTIFACTS: ${{ runner.temp }}/ikari-browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ikari-four-store-browser-verification
          path: ${{ runner.temp }}/ikari-browser
          retention-days: 14
          if-no-files-found: warn
