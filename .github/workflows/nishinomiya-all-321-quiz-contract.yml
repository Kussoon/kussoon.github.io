name: Nishinomiya SVG V6 All-321 Quiz Contracts
on:
  pull_request:
    paths:
      - 'scripts/audit-nishinomiya-321-quiz-contract.cjs'
      - '.github/workflows/nishinomiya-all-321-quiz-contract.yml'
  workflow_dispatch:
jobs:
  exhaustive-quiz:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browsers
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium webkit
      - name: Fetch original community mapping
        run: |
          mkdir -p nishinomiya/data
          curl --fail --location --retry 3 --silent --show-error https://raw.githubusercontent.com/Kussoon/nishinomiya/main/data/community-town-map.json -o nishinomiya/data/community-town-map.json
      - name: Run all 321 quiz contracts
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 &
          sleep 3
          node scripts/audit-nishinomiya-321-quiz-contract.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nishinomiya-321-quiz-contract-report
          path: nishinomiya-321-quiz-contract/
          if-no-files-found: ignore
