name: Nishinomiya SVG V38 settled C parity acceptance
on:
  pull_request:
    paths:
      - 'scripts/audit-nishinomiya-c-v38-glyph-metrics.cjs'
      - '.github/workflows/nishinomiya-svg-v38-stable-acceptance.yml'
  workflow_dispatch:
jobs:
  settled-parity:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium webkit
      - run: |
          mkdir -p nishinomiya/data
          curl --fail --location --retry 3 --silent --show-error https://raw.githubusercontent.com/Kussoon/nishinomiya/main/data/community-town-map.json -o nishinomiya/data/community-town-map.json
      - name: Strict settled 26-region and town-label parity
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 &
          sleep 3
          node scripts/audit-nishinomiya-c-v38-glyph-metrics.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nishinomiya-v38-settled-metrics
          path: nishinomiya-c-v38-glyph-metrics/
          if-no-files-found: error
