name: V2 municipality boundary contrast trial
on:
  pull_request:
    paths:
      - 'v2/verification/municipality-boundaries/**'
      - '.github/workflows/v2-municipality-boundaries-trial.yml'
  push:
    branches: [main]
    paths:
      - 'v2/verification/municipality-boundaries/**'
      - '.github/workflows/v2-municipality-boundaries-trial.yml'
jobs:
  comparison:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check prototype and R02 arc contracts
        run: |
          node --check v2/verification/municipality-boundaries/trial.js
          node --check v2/verification/municipality-boundaries/contract.test.cjs
          node --check v2/verification/municipality-boundaries/browser.test.cjs
          node v2/verification/municipality-boundaries/contract.test.cjs
      - name: Install browser test dependencies
        run: npm ci --no-audit --no-fund
        working-directory: v2/tests/browser
      - name: Install Chromium and WebKit
        run: npx playwright install --with-deps chromium webkit
        working-directory: v2/tests/browser
      - name: Compare representative regions on iPhone portrait viewport
        run: |
          KUSSOON_BROWSER_ENGINE=chromium node v2/verification/municipality-boundaries/browser.test.cjs
          KUSSOON_BROWSER_ENGINE=webkit node v2/verification/municipality-boundaries/browser.test.cjs
        env:
          KUSSOON_BROWSER_ARTIFACTS: ${{ runner.temp }}/municipality-boundaries
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v2-municipality-boundary-comparison
          path: ${{ runner.temp }}/municipality-boundaries
          if-no-files-found: ignore
