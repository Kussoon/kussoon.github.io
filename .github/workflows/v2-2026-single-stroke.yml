name: V2 2026 single stroke performance guard
on:
  pull_request:
    paths:
      - 'v2/national/official-2026-nationwide-pilot.html'
      - 'v2/shared/municipality-renderer.js'
      - 'v2/national/test-2026-single-stroke.cjs'
      - '.github/workflows/v2-2026-single-stroke.yml'
  push:
    branches: [main]
    paths:
      - 'v2/national/official-2026-nationwide-pilot.html'
      - 'v2/shared/municipality-renderer.js'
      - 'v2/national/test-2026-single-stroke.cjs'
      - '.github/workflows/v2-2026-single-stroke.yml'
jobs:
  lightweight-stroke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: One shared border, constant screen width, no extra overlay
        run: |
          node --check v2/national/test-2026-single-stroke.cjs
          node v2/national/test-2026-single-stroke.cjs
