name: One-shot nationwide office-map code coverage audit
on:
  push:
    branches:
      - v2/national-office-map-coverage-audit-20261102
    paths:
      - v2/scripts/audit-office-map-codes.cjs
      - .github/workflows/v2-one-shot-office-map-audit.yml
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Compare all 47 map and office datasets
        run: node v2/scripts/audit-office-map-codes.cjs
      - name: Save audit report
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add v2/audit/office-map-coverage-20261102.json
          if ! git diff --cached --quiet; then
            git commit -m "Record exact nationwide map-office code mismatches"
            git push
          fi
