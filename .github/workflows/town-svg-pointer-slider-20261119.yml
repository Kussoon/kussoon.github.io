name: National town v1.4 pointer slider and community reset
on:
  pull_request:
    paths:
      - 'v2/takarazuka-town-svg-pointer-slider-20261119-pilot.html'
      - 'v2/common/js/town-svg-community-state.js'
      - 'v2/common/js/town-svg-zoom-slider-drag.js'
      - 'v2/common/js/town-map-result-navigation-takarazuka-pointer-20261119-pilot.js'
      - 'scripts/test-takarazuka-pointer-slider-20261119.cjs'
      - '.github/workflows/town-svg-pointer-slider-20261119.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    container:
      image: mcr.microsoft.com/playwright:v1.56.1-noble
    env:
      NODE_PATH: ${{ github.workspace }}/v2/tests/browser/node_modules
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: v2/tests/browser/package-lock.json
      - run: npm ci --prefix v2/tests/browser --no-audit --no-fund
      - name: Fetch Takarazuka source data (read only)
        run: |
          mkdir -p takarazuka/data
          curl --fail --location --retry 3 --silent --show-error https://raw.githubusercontent.com/Kussoon/takarazuka/main/town-search.html -o takarazuka/town-search.html
          curl --fail --location --retry 3 --silent --show-error https://raw.githubusercontent.com/Kussoon/takarazuka/main/data/takarazuka-town-info.json -o takarazuka/data/takarazuka-town-info.json
      - name: Verify pointer tracking, endpoints, step buttons and region reset
        run: |
          python3 -m http.server 8772 --bind 127.0.0.1 &
          sleep 3
          node scripts/test-town-svg-zoom-slider-single-rail-20261119.cjs
