name: V2 2026 cross-region five detailed border map
on:
  pull_request:
    paths:
      - 'v2/tools/shared-topology/audit-cross-region-detail-2026.py'
      - 'v2/national/official-2026-cross-region-border-detail.html'
      - '.github/workflows/v2-2026-five-border-detail.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install geometry diagnostics
        run: python -m pip install --disable-pip-version-check 'shapely==2.1.2'
      - name: Generate dense five-border comparison layers
        run: |
          python -m py_compile v2/tools/shared-topology/audit-cross-region-detail-2026.py
          python v2/tools/shared-topology/audit-cross-region-detail-2026.py v2/data/national/2026-common v2/data/national/2026-common/cross-region-detail
      - name: Check five published datasets and page JavaScript
        run: |
          python - <<'PY'
          import json,pathlib
          root=pathlib.Path('v2/data/national/2026-common/cross-region-detail')
          index=json.loads((root/'index.json').read_text())
          pairs=['07-08','07-15','06-15','28-31','28-33']
          assert [x['pair'] for x in index['pairs']]==pairs
          for pair in pairs:
              data=json.loads((root/(pair+'.geojson')).read_text())
              assert data['type']=='FeatureCollection'
              p=data['properties']
              assert p['pair']==pair
              assert p['matchedSampleCount']>20
              assert p['p95M']>=0
              assert p['maxObservedM']>=p['medianM']
              assert sum(x['properties']['type']=='sample' for x in data['features'])>0
              assert {x['properties']['side'] for x in data['features'] if x['properties']['type']=='boundary'}==set(pair.split('-'))
              print('PASS',pair,p['matchedSampleCount'],'samples',p['p95M'],'p95 metres,',(root/(pair+'.geojson')).stat().st_size,'bytes')
          html=pathlib.Path('v2/national/official-2026-cross-region-border-detail.html').read_text()
          assert 'KussoonV2MapViewport.init' in html
          assert 'cross-region-detail/' in html
          pathlib.Path('/tmp/v2-2026-border-detail.js').write_text(html.split('<script>')[-1].split('</script>')[0])
          PY
          node --check /tmp/v2-2026-border-detail.js
          node v2/shared/test-map-viewport.cjs
      - name: Commit read-only comparison JSON and GeoJSON to PR branch
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add v2/data/national/2026-common/cross-region-detail/
          if ! git diff --cached --quiet; then
            git commit -m "test(v2): publish five-border detailed diagnostic layers"
            git push origin HEAD:${{ github.head_ref }}
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: five-cross-region-border-detailed-2026
          path: v2/data/national/2026-common/cross-region-detail/
          retention-days: 30
