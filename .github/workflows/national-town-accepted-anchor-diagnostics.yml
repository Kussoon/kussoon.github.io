name: National town accepted anchor diagnostics
on:
  pull_request:
    paths:
      - 'scripts/audit-national-town-accepted-label-anchors.cjs'
      - '.github/workflows/national-town-accepted-anchor-diagnostics.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    container:
      image: mcr.microsoft.com/playwright:v1.56.1-noble
    env:
      NODE_PATH: ${{ github.workspace }}/v2/tests/browser/node_modules
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: v2/tests/browser/package-lock.json
      - run: npm ci --prefix v2/tests/browser --no-audit --no-fund
      - name: Fetch linked source data read-only
        run: |
          mkdir -p nishinomiya/data
          curl --fail --location --retry 3 --silent --show-error https://raw.githubusercontent.com/Kussoon/nishinomiya/main/data/community-town-map.json -o nishinomiya/data/community-town-map.json
      - name: Diagnose accepted V34 outside anchors without UI changes
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 &
          sleep 3
          node scripts/audit-national-town-accepted-label-anchors.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: national-town-accepted-anchor-diagnostics
          path: artifacts/national-town-anchor-diagnostics/
          if-no-files-found: ignore
