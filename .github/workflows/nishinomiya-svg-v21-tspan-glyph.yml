name: Nishinomiya SVG V21 Cross-browser Glyph Geometry
on:
  pull_request:
    paths:
      - 'v2/nishinomiya-town-svg-master-v21-20261117-pilot.html'
      - 'scripts/*v21*'
      - '.github/workflows/nishinomiya-svg-v21-tspan-glyph.yml'
  workflow_dispatch:
jobs:
  compare:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Chromium and WebKit
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium webkit
      - name: Download community mapping
        run: |
          mkdir -p nishinomiya/data
          curl --fail --location --retry 3 --silent --show-error https://raw.githubusercontent.com/Kussoon/nishinomiya/main/data/community-town-map.json -o nishinomiya/data/community-town-map.json
      - name: Compare C and V21 actual glyph positions including reading
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 &
          sleep 3
          node scripts/audit-nishinomiya-c-v21-glyph-metrics.cjs
      - name: All 321 towns quiz1 and quiz2
        run: node scripts/audit-nishinomiya-v21-321-quiz-contract.cjs
      - name: All 15-step UI transitions
        run: node scripts/smoke-nishinomiya-v21-state-matrix.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nishinomiya-v21-tspan-glyph-evidence
          path: |
            nishinomiya-c-v21-glyph-metrics/
            nishinomiya-v21-321-quiz-contract/
            nishinomiya-v21-state-matrix/
          if-no-files-found: ignore
