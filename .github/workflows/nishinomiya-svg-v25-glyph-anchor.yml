name: Nishinomiya SVG V25 glyph-range anchor comparison
on:
  pull_request:
    paths:
      - 'v2/nishinomiya-town-svg-master-v25-20261117-pilot.html'
      - 'scripts/*v25*'
      - '.github/workflows/nishinomiya-svg-v25-glyph-anchor.yml'
  workflow_dispatch:
jobs:
  compare:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium webkit
      - name: Download community mapping
        run: |
          mkdir -p nishinomiya/data
          curl --fail --location --retry 3 --silent --show-error https://raw.githubusercontent.com/Kussoon/nishinomiya/main/data/community-town-map.json -o nishinomiya/data/community-town-map.json
      - name: C versus V25 DOM Range glyph geometry
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 &
          sleep 3
          node scripts/audit-nishinomiya-c-v25-glyph-metrics.cjs
      # Make geometry evidence available immediately, even while the exhaustive
      # quiz jobs run for several minutes. This prevents a successful geometry
      # measurement from being inaccessible due to slow later steps.
      - name: Upload C versus V25 geometry evidence
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nishinomiya-v25-geometry-evidence
          path: nishinomiya-c-v25-glyph-metrics/
          if-no-files-found: error
      - name: 321 town names quiz1 and quiz2
        run: node scripts/audit-nishinomiya-v25-321-quiz-contract.cjs
      - name: UI state matrix
        run: node scripts/smoke-nishinomiya-v25-state-matrix.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nishinomiya-v25-range-anchor-evidence
          path: |
            nishinomiya-c-v25-glyph-metrics/
            nishinomiya-v25-321-quiz-contract/
            nishinomiya-v25-state-matrix/
          if-no-files-found: ignore
