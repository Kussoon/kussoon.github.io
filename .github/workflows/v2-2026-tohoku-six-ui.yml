name: V2 2026 Tohoku six-prefecture UI regression
on:
  pull_request:
    paths:
      - 'v2/national/official-2026-tohoku-six-20m-trial.html'
      - '.github/workflows/v2-2026-tohoku-six-ui.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check regional choices, independent delivery and SVG gestures
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          html=Path('v2/national/official-2026-tohoku-six-20m-trial.html').read_text()
          script=html.split('<script>')[-1].split('</script>')[0]
          codes=re.findall(r'<option value="(\d\d)">',html)
          assert codes==['02','03','04','05','06','07'],codes
          assert 'KussoonV2MunicipalRenderer.render' in script
          assert 'KussoonV2MunicipalRenderer.focusBounds(chosen.polys)' in script
          assert 'KussoonV2MapViewport.init' in script
          assert 'new Set(regionCodes).size!==items.length' in script
          assert 'items.length<20' not in script
          assert 'tohoku-prefecture-20m/' in script
          assert 'TOKYO_BOX' not in script and 'tokyoArea' not in script
          assert '<script src="../shared/map-viewport.js"></script>' in html
          assert '<script src="../shared/municipality-renderer.js"></script>' in html
          assert 'id="zoomReset"' in html
          assert 'viewport.zoomIn()' in script and 'viewport.zoomOut()' in script
          Path('/tmp/v2-tohoku-ui.js').write_text(script)
          print('PASS six Tohoku prefectures, common rendering, gestures and selectable municipalities')
          PY
          node --check /tmp/v2-tohoku-ui.js
          node v2/shared/test-map-viewport.cjs
          node v2/shared/test-municipality-renderer.cjs
