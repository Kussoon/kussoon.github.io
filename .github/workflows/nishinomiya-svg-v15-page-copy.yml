name: Nishinomiya SVG V15 Page Copy Gate
on:
  pull_request:
    paths:
      - 'v2/nishinomiya-town-svg-master-v15-20261117-pilot.html'
      - 'scripts/test-nishinomiya-v15-page-copy.cjs'
      - '.github/workflows/nishinomiya-svg-v15-page-copy.yml'
  workflow_dispatch:
jobs:
  copy:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate V15 description and protected links
        run: node scripts/test-nishinomiya-v15-page-copy.cjs
