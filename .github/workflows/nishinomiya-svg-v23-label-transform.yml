name: Nishinomiya SVG V23 label-transform diagnosis
on:
  pull_request:
    paths:
      - 'scripts/audit-nishinomiya-v23-label-transform.cjs'
      - '.github/workflows/nishinomiya-svg-v23-label-transform.yml'
  workflow_dispatch:
jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium webkit
      - name: Download community mapping
        run: |
          mkdir -p nishinomiya/data
          curl --fail --location --retry 3 --silent --show-error https://raw.githubusercontent.com/Kussoon/nishinomiya/main/data/community-town-map.json -o nishinomiya/data/community-town-map.json
      - name: Measure parent and child transforms independently
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 &
          sleep 3
          node scripts/audit-nishinomiya-v23-label-transform.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nishinomiya-v23-label-transform-diagnostics
          path: nishinomiya-v23-label-transform/
          if-no-files-found: error
