name: V2 2026 mobile popup layout guard
on:
  pull_request:
    paths:
      - 'v2/national/official-2026-nationwide-pilot.html'
      - 'v2/national/test-2026-mobile-popup.cjs'
      - '.github/workflows/v2-2026-mobile-popup.yml'
  push:
    branches: [main]
    paths:
      - 'v2/national/official-2026-nationwide-pilot.html'
      - 'v2/national/test-2026-mobile-popup.cjs'
      - '.github/workflows/v2-2026-mobile-popup.yml'
jobs:
  static-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          node --check v2/national/test-2026-mobile-popup.cjs
          node v2/national/test-2026-mobile-popup.cjs
