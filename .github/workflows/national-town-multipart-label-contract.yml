name: National town multipart label contract
on:
  pull_request:
    paths:
      - 'v2/common/js/town-svg-multipart-label-contract.js'
      - 'v2/common/js/town-map-multipart-label-takarazuka-20261118-pilot.js'
      - 'v2/takarazuka-town-svg-multipart-label-20261118-pilot.html'
      - 'scripts/*multipart-label*.cjs'
      - '.github/workflows/national-town-multipart-label-contract.yml'
  workflow_dispatch:
jobs:
  contract:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/test-national-town-multipart-label-contract.cjs
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium webkit
      - name: Fetch original town source
        run: |
          mkdir -p takarazuka/data
          curl --fail --location --retry 3 --silent --show-error https://raw.githubusercontent.com/Kussoon/takarazuka/main/town-search.html -o takarazuka/town-search.html
          curl --fail --location --retry 3 --silent --show-error https://raw.githubusercontent.com/Kussoon/takarazuka/main/data/takarazuka-town-info.json -o takarazuka/data/takarazuka-town-info.json
      - name: Compare labels across three browser environments and ten states
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 &
          sleep 3
          node scripts/test-national-multipart-label-browser-parity.cjs
      - name: Full town quiz and 20 region regression
        run: node scripts/audit-takarazuka-multipart-label-125-regions.cjs
      - name: Incorrect answers, interruption and retry regression
        run: node scripts/test-takarazuka-multipart-label-exceptions.cjs
