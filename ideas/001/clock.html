<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
  <link rel="canonical" href="https://kussoon.com/ideas/001/clock.html" />
  <meta name="description" content="大きなデジタル時計と、60本のカラーバーで残り時間を確認できるタイマーです。横・縦表示、全画面表示、画面の明るさ調整に対応しています。" />
  <meta name="theme-color" content="#000000" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="時計・タイマー" />
  <title>バータイマー付きデジタル時計｜Kussoon</title>

  <style>
    :root {
      --safe-top: env(safe-area-inset-top);
      --safe-right: env(safe-area-inset-right);
      --safe-bottom: env(safe-area-inset-bottom);
      --safe-left: env(safe-area-inset-left);
      --main-opacity: 1;
      --sub-opacity: .76;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display",
        "Helvetica Neue", Arial, "Hiragino Sans", "Yu Gothic", sans-serif;
    }

    body {
      position: fixed;
      inset: 0;
      user-select: none;
      -webkit-user-select: none;
      touch-action: manipulation;
      background: #000;
    }

    body.level-0 {
      --main-opacity: 1;
      --sub-opacity: .76;
    }

    body.level-1 {
      --main-opacity: .45;
      --sub-opacity: .36;
    }

    body.level-2 {
      --main-opacity: .20;
      --sub-opacity: .16;
    }


    body.fullscreen #top-switches,
    body.fullscreen #menu-btn,
    body.fullscreen #menu,
    body.fullscreen #wake-status {
      display: none !important;
    }


    #fullscreen-close-btn {
      display: none;
      position: fixed;
      top: max(12px, calc(8px + var(--safe-top)));
      right: max(12px, calc(8px + var(--safe-right)));
      width: 48px;
      height: 48px;
      border: 1px solid rgba(255,255,255,.38);
      border-radius: 50%;
      background: rgba(24,24,24,.78);
      color: rgba(255,255,255,.92);
      font-size: 30px;
      font-weight: 300;
      line-height: 1;
      align-items: center;
      justify-content: center;
      z-index: 100;
      -webkit-tap-highlight-color: transparent;
    }

    body.fullscreen #fullscreen-close-btn {
      display: flex;
    }

    #fullscreen-close-btn:active {
      background: rgba(70,70,70,.92);
    }

    body.fullscreen #landscape-layout {
      padding:
        calc(6px + var(--safe-top))
        max(.8vw, calc(6px + var(--safe-right)))
        calc(6px + var(--safe-bottom))
        max(.8vw, calc(6px + var(--safe-left)));
    }

    body.fullscreen #landscape-time {
      font-size: min(23vw, 56dvh);
      line-height: .82;
      letter-spacing: -.06em;
      max-width: calc(100vw - 44px - var(--safe-left) - var(--safe-right));
      transform: scaleX(.96);
      transform-origin: center;
    }

    body.fullscreen #landscape-date {
      margin-top: 1.2vh;
      font-size: min(8.2vw, 14vh);
      line-height: 1;
    }

    body.fullscreen #landscape-year-remaining {
      margin-top: .8vh;
      font-size: min(3.55vw, 6.2vh);
      line-height: 1.08;
      gap: .55vh;
    }

    body.fullscreen #portrait-layout {
      padding:
        calc(10px + var(--safe-top))
        calc(10px + var(--safe-right))
        calc(14px + var(--safe-bottom))
        calc(10px + var(--safe-left));
    }

    body.fullscreen .portrait-time-part {
      font-size: min(52vw, 30dvh);
      line-height: .84;
    }

    body.fullscreen #portrait-date {
      font-size: min(11.6vw, 8vh);
      line-height: 1;
      padding-bottom: .1vh;
    }

    body.fullscreen #portrait-year-remaining {
      margin-top: .3vh;
      font-size: min(6.8vw, 4.7vh);
      line-height: 1.08;
      gap: .35vh;
      padding-bottom: .3vh;
    }

    body.fullscreen #landscape-timer-status,
    body.fullscreen #portrait-timer-status,
    body.fullscreen .keypad {
      display: none !important;
    }

    body.fullscreen #landscape-visual {
      min-height: 48vh;
      align-items: center;
      grid-template-columns: minmax(0, 1fr) minmax(270px, 34%);
      gap: 1.4vw;
    }

    body.fullscreen #landscape-bar-panel,
    body.fullscreen #landscape-digits-panel {
      height: min(42vh, 290px);
      min-height: 210px;
    }

    body.fullscreen #landscape-timer-display {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 118%;
      max-width: none;
      margin: 0;
      font-size: min(13.2vw, 27dvh);
      line-height: .82;
      text-align: center;
      transform: translate(-50%, -50%) scaleX(.82);
      transform-origin: center center;
      overflow: visible;
    }

    body.fullscreen #landscape-segment-bar {
      height: 94%;
    }

    body.fullscreen #portrait-visual {
      height: 78vh;
      align-items: stretch;
      grid-template-columns: minmax(126px, 38%) minmax(0, 1fr);
      gap: 18px;
    }

    body.fullscreen #portrait-segment-bar {
      width: 84%;
    }

    body.fullscreen #portrait-timer-display {
      font-size: min(30vw, 17dvh);
      line-height: .84;
      transform: scaleX(.78);
      transform-origin: center;
      overflow: visible;
    }

    body.fullscreen #portrait-bar-panel,
    body.fullscreen #portrait-digits-panel {
      padding-top: 16px;
      padding-bottom: 16px;
    }

    .hidden {
      display: none !important;
    }

    .no-fullscreen-exit {
      display: inline-block;
    }

    /* ---------- 共通上部切替 ---------- */

    #top-switches {
      position: fixed;
      top: max(12px, calc(8px + var(--safe-top)));
      left: max(12px, calc(8px + var(--safe-left)));
      right: max(12px, calc(8px + var(--safe-right)));
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      z-index: 30;
      pointer-events: none;
    }

    .switch-group {
      display: flex;
      gap: 8px;
      pointer-events: auto;
    }

    .switch-btn {
      border: 1px solid rgba(255,255,255,.28);
      border-radius: 12px;
      background: rgba(36,36,36,.92);
      color: #fff;
      min-width: 68px;
      padding: 9px 14px;
      font-size: 15px;
      font-weight: 650;
      box-shadow: 0 3px 12px rgba(0,0,0,.30);
    }

    .switch-btn.active {
      background: rgba(255,255,255,.20);
      border-color: rgba(255,255,255,.48);
    }

    /* ---------- メニュー ---------- */

    #menu-btn {
      position: fixed;
      right: max(16px, calc(12px + var(--safe-right)));
      bottom: max(16px, calc(12px + var(--safe-bottom)));
      width: 58px;
      height: 58px;
      border: 1px solid rgba(255,255,255,.42);
      border-radius: 15px;
      background: rgba(35,35,35,.94);
      color: rgba(255,255,255,.94);
      font-size: 28px;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 40;
    }

    #menu {
      position: fixed;
      right: max(16px, calc(12px + var(--safe-right)));
      bottom: max(84px, calc(80px + var(--safe-bottom)));
      width: 210px;
      padding: 12px;
      border: 1px solid rgba(255,255,255,.25);
      border-radius: 15px;
      background: rgba(24,24,24,.98);
      z-index: 39;
      display: none;
    }

    #menu.show {
      display: block;
    }

    .menu-title {
      font-size: 13px;
      color: rgba(255,255,255,.64);
      margin: 1px 3px 8px;
    }

    .menu-group {
      display: grid;
      gap: 8px;
    }

    .menu-group button {
      border: 1px solid rgba(255,255,255,.18);
      border-radius: 10px;
      background: rgba(255,255,255,.07);
      color: #fff;
      padding: 10px 12px;
      font-size: 15px;
      font-weight: 600;
    }

    .menu-group button.active {
      background: rgba(255,255,255,.22);
      border-color: rgba(255,255,255,.45);
    }

    .menu-info {
      margin-top: 12px;
      padding-top: 10px;
      border-top: 1px solid rgba(255,255,255,.16);
      display: grid;
      gap: 7px;
      font-size: 12px;
      line-height: 1.45;
    }

    .menu-info a {
      color: rgba(255,255,255,.82);
      text-decoration: none;
    }

    .menu-info a:focus-visible,
    .menu-info a:hover {
      color: #fff;
      text-decoration: underline;
    }

    .menu-copyright {
      color: rgba(255,255,255,.44);
      font-size: 10px;
      margin-top: 2px;
    }

    #wake-status {
      position: fixed;
      left: max(10px, calc(7px + var(--safe-left)));
      bottom: max(8px, calc(6px + var(--safe-bottom)));
      font-size: 10px;
      opacity: .18;
      pointer-events: none;
      z-index: 20;
    }

    /* ---------- 横レイアウト ---------- */

    #landscape-layout {
      position: fixed;
      inset: 0;
      padding:
        calc(64px + var(--safe-top))
        max(5vw, calc(24px + var(--safe-right)))
        calc(18px + var(--safe-bottom))
        max(5vw, calc(24px + var(--safe-left)));
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #landscape-clock {
      width: 100%;
      text-align: center;
    }

    #landscape-time {
      font-variant-numeric: tabular-nums;
      font-weight: 500;
      line-height: .84;
      letter-spacing: -.055em;
      white-space: nowrap;
      font-size: min(22.5vw, 52dvh);
      max-width: calc(100vw - 36px - var(--safe-left) - var(--safe-right));
      transform: scaleX(.97);
      transform-origin: center;
      opacity: var(--main-opacity);
    }

    #landscape-date {
      margin-top: 1.8vh;
      font-size: min(6.8vw, 12vh);
      line-height: 1;
      font-weight: 500;
      opacity: var(--sub-opacity);
    }


    #landscape-year-remaining {
      margin-top: .8vh;
      display: grid;
      gap: .55vh;
      justify-items: center;
      font-size: min(3.35vw, 5.8vh);
      line-height: 1.08;
      font-weight: 500;
      opacity: var(--sub-opacity);
    }

    #landscape-timer {
      width: 100%;
      max-width: 92vw;
      text-align: center;
    }

    #landscape-visual {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(200px, 26%);
      gap: 2.2vw;
      align-items: stretch;
    }

    .lcd-panel {
      border: 2px solid rgba(255,255,255,.17);
      border-radius: 18px;
      background: rgba(220,224,206,.09);
      box-shadow: inset 0 0 0 2px rgba(0,0,0,.5);
    }

    #landscape-bar-panel {
      height: min(31vh, 210px);
      min-height: 150px;
      display: flex;
      align-items: center;
      padding: 16px 20px;
    }

    #landscape-segment-bar {
      position: relative;
      width: 100%;
      height: 90%;
      display: grid;
      grid-template-columns: repeat(60, minmax(0, 1fr));
      gap: 2px;
      align-items: stretch;
    }

    .segment-h {
      align-self: stretch;
      height: 100%;
      border-radius: 2px;
      background: #333333;
      border: 1px solid #555555;
      transition: background .12s linear;
    }

    .segment-h.on {
      height: 100%;
      background: #fff3a6;
      border-color: #e7d76e;
      box-shadow: 0 0 4px rgba(255,243,166,.22);
    }

    .segment-h.zone-1.on {
      background: #ff9800;
      border-color: #ffb74d;
      box-shadow: 0 0 5px rgba(255,152,0,.30);
    }

    .segment-h.zone-2.on {
      background: #9be81b;
      border-color: #b9f35a;
      box-shadow: 0 0 5px rgba(155,232,27,.28);
    }

    .segment-h.zone-3.on {
      background: #19c45a;
      border-color: #4fe384;
      box-shadow: 0 0 5px rgba(25,196,90,.28);
    }

    .segment-h.zone-4.on {
      background: #1f7cff;
      border-color: #5ba2ff;
      box-shadow: 0 0 5px rgba(31,124,255,.28);
    }

    #landscape-digits-panel {
      position: relative;
      min-height: 150px;
      height: min(31vh, 210px);
      display: block;
      text-align: center;
      padding: 10px 8px;
      overflow: hidden;
    }

    #landscape-timer-display {
      max-width: 100%;
      overflow: visible;
      color: #f6f6f2;
      font-variant-numeric: tabular-nums;
      font-weight: 500;
      line-height: .84;
      letter-spacing: -.045em;
      white-space: nowrap;
      position: absolute;
      left: 50%;
      top: 50%;
      width: 116%;
      max-width: none;
      margin: 0;
      font-size: min(12.2vw, 24dvh);
      transform: translate(-50%, -50%) scaleX(.84);
      transform-origin: center center;
      text-align: center;
    }

    #landscape-timer-status {
      margin-top: 2vh;
      font-size: min(2.1vw, 4vh);
      opacity: var(--sub-opacity);
      min-height: 1.2em;
    }

    /* 刀：横レイアウトでは縦向き */
    #katana-h {
      position: absolute;
      top: -10%;
      left: 100%;
      width: 30px;
      height: 122%;
      transform: translateX(-50%);
      z-index: 8;
      pointer-events: none;
      transition: left .12s linear;
    }

    #katana-h .blade {
      position: absolute;
      left: 7px;
      top: 0;
      width: 12px;
      height: 74%;
      border-radius: 70% 30% 24% 76% / 12% 12% 88% 88%;
      background: linear-gradient(
        to right,
        #dfe7ee 0%,
        #ffffff 24%,
        #ffffff 48%,
        #eef3f7 72%,
        #cbd5de 100%
      );
      box-shadow:
        0 0 7px rgba(255,255,255,.95),
        0 0 15px rgba(235,245,255,.58);
      transform: skewX(-2deg);
      clip-path: polygon(
        42% 0%,
        88% 2%,
        100% 91%,
        82% 100%,
        28% 100%,
        8% 92%,
        18% 18%
      );
    }

    #katana-h .blade::before {
      content: "";
      position: absolute;
      top: -7px;
      left: 2px;
      width: 8px;
      height: 13px;
      background: #ffffff;
      border-radius: 70% 30% 18% 82%;
      transform: rotate(-10deg);
    }

    #katana-h .guard {
      position: absolute;
      left: 1px;
      top: 73%;
      width: 25px;
      height: 5px;
      border-radius: 3px;
      background: #ffffff;
    }

    #katana-h .handle {
      position: absolute;
      left: 8px;
      top: calc(73% + 5px);
      width: 11px;
      height: 23%;
      min-height: 25px;
      border: 2px solid #efefef;
      border-radius: 3px;
      background: repeating-linear-gradient(
        to bottom,
        #242424 0 5px,
        #bcbcbc 5px 7px
      );
    }

    /* ---------- 縦レイアウト ---------- */

    #portrait-layout {
      position: fixed;
      inset: 0;
      padding:
        calc(70px + var(--safe-top))
        calc(16px + var(--safe-right))
        calc(80px + var(--safe-bottom))
        calc(16px + var(--safe-left));
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #portrait-clock {
      width: 100%;
      height: 100%;
      display: grid;
      grid-template-rows: 1fr 1fr 1fr auto;
      align-items: center;
      justify-items: center;
      text-align: center;
    }

    .portrait-time-part {
      width: 100%;
      font-variant-numeric: tabular-nums;
      font-weight: 500;
      line-height: .88;
      letter-spacing: -.035em;
      font-size: min(48vw, 27dvh);
      opacity: var(--main-opacity);
    }

    #portrait-date {
      font-size: min(10vw, 6.8vh);
      line-height: 1;
      font-weight: 500;
      opacity: var(--sub-opacity);
      padding-bottom: .4vh;
    }


    #portrait-year-remaining {
      margin-top: .4vh;
      display: grid;
      gap: .35vh;
      justify-items: center;
      font-size: min(6.2vw, 4.2vh);
      line-height: 1.08;
      font-weight: 500;
      opacity: var(--sub-opacity);
      padding-bottom: .4vh;
    }

    #portrait-timer {
      width: 100%;
      height: 100%;
      display: grid;
      grid-template-rows: minmax(0, 1fr) auto auto auto;
      gap: 12px;
      justify-items: center;
      align-items: center;
    }

    #portrait-visual {
      width: 100%;
      height: 100%;
      display: grid;
      grid-template-columns: minmax(100px, 34%) minmax(0, 1fr);
      gap: 16px;
      align-items: stretch;
      min-height: 0;
    }

    #portrait-bar-panel {
      position: relative;
      min-height: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 18px 16px;
    }

    #portrait-segment-bar {
      position: relative;
      width: 80%;
      height: 100%;
      display: grid;
      grid-template-rows: repeat(60, minmax(0, 1fr));
      gap: 2px;
    }

    .segment-v {
      justify-self: stretch;
      width: 100%;
      border-radius: 2px;
      background: #333333;
      border: 1px solid #555555;
      transition: background .12s linear;
    }

    .segment-v.on {
      width: 100%;
      background: #fff3a6;
      border-color: #e7d76e;
      box-shadow: 0 0 4px rgba(255,243,166,.22);
    }

    .segment-v.zone-1.on {
      background: #ff9800;
      border-color: #ffb74d;
      box-shadow: 0 0 5px rgba(255,152,0,.30);
    }

    .segment-v.zone-2.on {
      background: #9be81b;
      border-color: #b9f35a;
      box-shadow: 0 0 5px rgba(155,232,27,.28);
    }

    .segment-v.zone-3.on {
      background: #19c45a;
      border-color: #4fe384;
      box-shadow: 0 0 5px rgba(25,196,90,.28);
    }

    .segment-v.zone-4.on {
      background: #1f7cff;
      border-color: #5ba2ff;
      box-shadow: 0 0 5px rgba(31,124,255,.28);
    }

    #portrait-digits-panel {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 0;
      padding: 12px;
    }

    #portrait-timer-display {
      max-width: 100%;
      overflow: visible;
      color: #f6f6f2;
      font-variant-numeric: tabular-nums;
      font-weight: 500;
      line-height: .95;
      letter-spacing: -.04em;
      white-space: nowrap;
      font-size: min(27vw, 15dvh);
      line-height: .84;
      transform: scaleX(.80);
      transform-origin: center;
    }

    #portrait-timer-status {
      font-size: min(4vw, 2.5vh);
      opacity: var(--sub-opacity);
      min-height: 1.2em;
    }

    /* 刀：縦レイアウトでは横向き */
    #katana-v {
      position: absolute;
      left: -22%;
      bottom: 100%;
      width: 146%;
      height: 30px;
      transform: translateY(50%);
      z-index: 8;
      pointer-events: none;
      transition: bottom .12s linear;
    }

    #katana-v .blade {
      position: absolute;
      left: 0;
      top: 7px;
      width: 74%;
      height: 13px;
      border-radius: 12% 88% 76% 24% / 65% 55% 45% 35%;
      background: linear-gradient(
        to bottom,
        #dfe7ee 0%,
        #ffffff 24%,
        #ffffff 48%,
        #eef3f7 72%,
        #cbd5de 100%
      );
      box-shadow:
        0 0 7px rgba(255,255,255,.95),
        0 0 15px rgba(235,245,255,.58);
      transform: skewY(-2deg);
      clip-path: polygon(
        0% 38%,
        8% 12%,
        88% 0%,
        100% 18%,
        100% 72%,
        90% 96%,
        10% 88%
      );
    }

    #katana-v .blade::before {
      content: "";
      position: absolute;
      left: -8px;
      top: 2px;
      width: 13px;
      height: 8px;
      background: #ffffff;
      border-radius: 65% 35% 28% 72%;
      transform: rotate(-8deg);
    }

    #katana-v .guard {
      position: absolute;
      left: 73%;
      top: 1px;
      width: 5px;
      height: 25px;
      border-radius: 3px;
      background: #ffffff;
    }

    #katana-v .handle {
      position: absolute;
      left: calc(73% + 5px);
      top: 8px;
      width: 23%;
      min-width: 26px;
      height: 11px;
      border: 2px solid #efefef;
      border-radius: 3px;
      background: repeating-linear-gradient(
        to right,
        #242424 0 5px,
        #bcbcbc 5px 7px
      );
    }

    /* ---------- タイマー操作 ---------- */

    .timer-controls {
      display: flex;
      justify-content: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    .control-btn,
    .key-btn {
      border: 1px solid rgba(255,255,255,.30);
      background: rgba(255,255,255,.07);
      color: #fff;
      border-radius: 11px;
      font-weight: 600;
    }

    .control-btn {
      min-width: 100px;
      padding: 10px 20px;
      font-size: 16px;
    }

    body.fullscreen .control-btn {
      min-width: 112px;
      padding: 12px 24px;
      font-size: 18px;
    }

    .keypad {
      width: min(1180px, 94vw);
      display: grid;
      gap: 9px;
    }

    .digit-row {
      display: grid;
      grid-template-columns: repeat(10, minmax(0, 1fr));
      gap: 5px;
    }

    .key-action-row {

        fullscreenActive = true;

        fullscreenActive = false;

        if (fullscreenActive) exitFullscreenMode();
        else enterFullscreenMode();

      function getYearRemaining(now) {
        // 「残り日数」は今日を含めず、明日から12月31日までの日数。
        const tomorrow = new Date(now.getFullYear(), now.getMonth(), now.getDate() + 1);
        const nextYear = new Date(now.getFullYear() + 1, 0, 1);
        const msPerDay = 24 * 60 * 60 * 1000;
        const daysLeft = Math.max(0, Math.round((nextYear - tomorrow) / msPerDay));
        const weeksLeft = Math.ceil(daysLeft / 7);
        return { daysLeft, weeksLeft };
      }


      // 西暦から「令和・平成・昭和をそのまま延長した年数」を表示。
      // 例: 2026年 = 令和8年・平成38年・昭和101年
      function getEraLine(year) {
        const reiwa = year - 2018;
        const heisei = year - 1988;
        const showa = year - 1925;
        return `${year}年・令和${reiwa}年・平成${heisei}年・昭和${showa}年`;

      // 太陽の見かけの黄経を概算し、現在の二十四節気を求める。
      // 日付固定ではなく、年による切替日の変動にも追従する。
      function solarLongitude(date) {
        const jd = date.getTime() / 86400000 + 2440587.5;
        const T = (jd - 2451545.0) / 36525;
        let L0 = 280.46646 + 36000.76983 * T + 0.0003032 * T * T;
        let M = 357.52911 + 35999.05029 * T - 0.0001537 * T * T;
        const Mr = M * Math.PI / 180;
        const C =
          (1.914602 - 0.004817 * T - 0.000014 * T * T) * Math.sin(Mr) +
          (0.019993 - 0.000101 * T) * Math.sin(2 * Mr) +
          0.000289 * Math.sin(3 * Mr);
        const omega = (125.04 - 1934.136 * T) * Math.PI / 180;
        let lambda = L0 + C - 0.00569 - 0.00478 * Math.sin(omega);
        lambda %= 360;
        if (lambda < 0) lambda += 360;
        return lambda;
      }

      function updateClock() {
        const now = new Date();
        const h = pad2(now.getHours());
        const m = pad2(now.getMinutes());
        const s = pad2(now.getSeconds());
        const solarTerm = getSolarTerm(now);
        const dateText =
          `${now.getMonth() + 1}月${now.getDate()}日 ${weekdays[now.getDay()]}曜日・${solarTerm}`;

        landscapeTime.textContent = `${h}:${m}:${s}`;
        landscapeDate.textContent = dateText;

        portraitHour.textContent = h;
        portraitMinute.textContent = m;
        portraitSecond.textContent = s;
        portraitDate.textContent = dateText;

        const { daysLeft, weeksLeft } = getYearRemaining(now);
        const eraText = getEraLine(now.getFullYear());
        const remainingText = `今年は残り${weeksLeft}週・${daysLeft}日です`;
        const anniversaryText = `今日は「${getAnniversary(now)}」です`;

        landscapeEraLine.textContent = eraText;
        landscapeRemainingLine.textContent = remainingText;
        landscapeAnniversaryLine.textContent = anniversaryText;
        portraitEraLine.textContent = eraText;
        portraitRemainingLine.textContent = remainingText;
        portraitAnniversaryLine.textContent = anniversaryText;

        updateClockReminders(now);
      }

      function startClock() {
        updateClock();

        function tick() {
          const delay = 1000 - (Date.now() % 1000) + 8;
          setTimeout(() => {
            updateClock();
            tick();
          }, delay);
        }

        tick();
      }

        const h = document.createElement("div");
        const hZone = Math.min(4, Math.floor(i / (SEGMENT_COUNT / 4)) + 1);
        h.className = `segment-h zone-${hZone}`;
        landscapeSegmentBar.insertBefore(h, katanaH);
        hSegments.push(h);

        const v = document.createElement("div");
        const vZone = Math.max(1, 4 - Math.floor(i / (SEGMENT_COUNT / 4)));
        v.className = `segment-v zone-${vZone}`;
        portraitSegmentBar.insertBefore(v, katanaV);

      function formatTimer(seconds) {
        const total = Math.max(0, Math.ceil(seconds));
        const hours = Math.floor(total / 3600);
        const mins = Math.floor((total % 3600) / 60);
        const secs = total % 60;

        if (hours > 0) {
          return `${pad2(hours)}:${pad2(mins)}:${pad2(secs)}`;
        }
        return `${pad2(mins)}:${pad2(secs)}`;
      }

      function setStatus(text) {
        landscapeTimerStatus.textContent = text;
        portraitTimerStatus.textContent = text;
      }

      function setStartButton(text) {
        landscapeStartBtn.textContent = text;
        portraitStartBtn.textContent = text;
      }

      function updateProgress() {
        const ratio = selectedSeconds > 0
          ? Math.max(0, Math.min(1, remainingSeconds / selectedSeconds))
          : 0;

        const onCount = Math.ceil(ratio * SEGMENT_COUNT);

        // 横：左側が残り、右側が経過
        hSegments.forEach((el, index) => {
          el.classList.toggle("on", index < onCount);
        });

        // 縦：下側が残り、上側が経過
        vSegments.forEach((el, index) => {
          el.classList.toggle("on", index >= SEGMENT_COUNT - onCount);
        });

        // 開始時は100%（端）、終了時は0%（反対端）。
        // 枠内余白はCSS側で確保し、進捗座標そのものは縮めない。
        const markerPercent = Math.max(0, Math.min(100, ratio * 100));
        katanaH.style.left = `${markerPercent}%`;
        katanaV.style.bottom = `${markerPercent}%`;
      }

      function updateTimerDisplay() {
        const text = formatTimer(remainingSeconds);
        landscapeTimerDisplay.textContent = text;
        portraitTimerDisplay.textContent = text;
        updateProgress();
      }

      function digitsToSeconds(digits) {
        const padded = digits.padStart(4, "0").slice(-4);
        let minutes = Number(padded.slice(0, 2));
        let seconds = Number(padded.slice(2, 4));
        minutes += Math.floor(seconds / 60);
        seconds %= 60;
        return minutes * 60 + seconds;
      }

      function secondsToDigits(totalSeconds) {
        totalSeconds = Math.max(0, Math.floor(totalSeconds));
        const minutes = Math.min(99, Math.floor(totalSeconds / 60));
        const seconds = totalSeconds % 60;
        return `${pad2(minutes)}${pad2(seconds)}`;
      }

      function stopTimerInterval() {
        if (timerInterval) {
          clearInterval(timerInterval);
          timerInterval = null;
        }
      }

      function syncTimerFromInput() {
        stopTimerInterval();
        timerRunning = false;
        endTimestamp = null;

        // 入力中は4桁をそのまま MM:SS として表示し、
        // 60秒以上でも勝手に繰り上げない。
        const padded = inputDigits.padStart(4, "0").slice(-4);
        const rawMinutes = padded.slice(0, 2);
        const rawSeconds = padded.slice(2, 4);

        landscapeTimerDisplay.textContent = `${rawMinutes}:${rawSeconds}`;
        portraitTimerDisplay.textContent = `${rawMinutes}:${rawSeconds}`;

        selectedSeconds = digitsToSeconds(inputDigits);
        remainingSeconds = selectedSeconds;

        setStartButton("スタート");
        setStatus(selectedSeconds > 0 ? "入力時間" : "時間を入力");

        // バーは実際の合計秒数で表示
        updateProgress();
      }

      function pushDigits(digits) {
        if (timerRunning) return;
        for (const digit of String(digits)) {
          inputDigits = (inputDigits + digit).slice(-4);
        }
        syncTimerFromInput();
      }

      function clearInput() {
        if (timerRunning) return;
        inputDigits = "0000";
        syncTimerFromInput();
      }

      function backspaceInput() {
        if (timerRunning) return;
        inputDigits = ("0" + inputDigits.slice(0, -1)).slice(-4);
        syncTimerFromInput();
      }

      function startTimer() {
        if (remainingSeconds <= 0) {
          remainingSeconds = selectedSeconds;
        }

        if (remainingSeconds <= 0) return;

        // スタート時だけ、00:72 → 01:12 のように正規化する。
        inputDigits = secondsToDigits(selectedSeconds);
        remainingSeconds = selectedSeconds;
        updateTimerDisplay();

        timerRunning = true;
        endTimestamp = Date.now() + remainingSeconds * 1000;
        setStartButton("一時停止");
        setStatus("計測中");

        stopTimerInterval();

        timerInterval = setInterval(() => {
          const previousSeconds = remainingSeconds;
          remainingSeconds = Math.max(0, (endTimestamp - Date.now()) / 1000);
          checkFiveMinuteFlash(previousSeconds, remainingSeconds);
          updateTimerDisplay();

          if (remainingSeconds <= 0) {
            finishTimer();
          }
        }, 200);
      }

      function pauseTimer() {
        if (!timerRunning) return;

        remainingSeconds = Math.max(0, (endTimestamp - Date.now()) / 1000);
        timerRunning = false;
        endTimestamp = null;
        stopTimerInterval();

        setStartButton("再開");
        setStatus("一時停止");
        updateTimerDisplay();
      }

      function toggleTimer() {
        if (timerRunning) pauseTimer();
        else startTimer();
      }

      function resetTimer() {
        timerRunning = false;
        endTimestamp = null;
        stopTimerInterval();
        stopFinishFlash();

        // リセット後は、現在の設定値を4桁表示へ戻す。
        inputDigits = secondsToDigits(selectedSeconds);
        remainingSeconds = selectedSeconds;

        setStartButton("スタート");
        setStatus(selectedSeconds > 0 ? "入力時間" : "時間を入力");
        syncTimerFromInput();
      }

      function stopFinishFlash() {
        flashOverlay.classList.remove("flashing");

        if (flashTimerId) {
          clearTimeout(flashTimerId);
          flashTimerId = null;
        }
      }

      function triggerTimerFlash() {
        triggerTimerFlash();
      }

      function checkFiveMinuteFlash(previousSeconds, currentSeconds) {
        if (!timerRunning || currentSeconds <= 0) return;

        // 残り時間が 5:00, 10:00, 15:00 ... の境界を下向きに通過した時だけ発光。
        const previousBucket = Math.floor(Math.max(0, previousSeconds) / 300);
        const currentBucket = Math.floor(Math.max(0, currentSeconds) / 300);

        if (currentBucket < previousBucket) {
          const crossedBoundary = previousBucket * 300;
          if (crossedBoundary > 0 && crossedBoundary < selectedSeconds) {
            triggerTimerFlash();
          }
        }
      }

      // タイマー終了時の点滅中は、画面を1回タップすれば即停止。
      // オーバーレイ自身で受けるため、全画面モード解除などには波及しない。
      flashOverlay.addEventListener("pointerdown", (event) => {
        if (!flashOverlay.classList.contains("flashing")) return;
        event.preventDefault();
        event.stopPropagation();
        stopFinishFlash();
      });

      function finishTimer() {
        timerRunning = false;
        endTimestamp = null;
        remainingSeconds = 0;
        stopTimerInterval();

        setStartButton("もう一度");
        setStatus("終了");
        updateTimerDisplay();

        stopFinishFlash();
        void flashOverlay.offsetWidth;
        flashOverlay.classList.add("flashing");

        flashTimerId = setTimeout(() => {
          stopFinishFlash();
        }, 6500);
      }

      function refreshDismissLayer() {

      function dismissClockMessages() {
        if (sedentaryAlert.classList.contains("show")) {
          if (sedentaryAlert.classList.contains("blinking")) {
            // 1回目：点滅だけ止め、注意表示は点灯のまま残す。
            sedentaryAcknowledgedKey = currentSedentaryKey;
            sedentaryAlert.classList.remove("blinking");
          } else {
            // 2回目：その時間帯の注意表示を消す。
            dismissedSedentaryKey = currentSedentaryKey;
            sedentaryAlert.classList.remove("show", "blinking");
          }
        }

        if (quarterReminder.classList.contains("show")) {
          dismissedQuarterKey = currentQuarterKey;
          quarterReminder.classList.remove("show");

          if (quarterReminderHideTimer) {
            clearTimeout(quarterReminderHideTimer);
            quarterReminderHideTimer = null;
          }
        }

        refreshDismissLayer();

      // 「座りすぎ注意」は1回目のタップで点滅→点灯、2回目で消える。
      // 15分リマインダーは従来どおり1回タップで消える。
      clockAlertLayer.addEventListener("pointerdown", (event) => {
        if (
          !sedentaryAlert.classList.contains("show") &&
          !quarterReminder.classList.contains("show")
        ) return;

        event.preventDefault();
        event.stopPropagation();
        dismissClockMessages();

      function shuffleQuarterMessages() {
        quarterMessageBag = [...quarterMessages];
        for (let i = quarterMessageBag.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [quarterMessageBag[i], quarterMessageBag[j]] = [quarterMessageBag[j], quarterMessageBag[i]];
        }
      }

      function randomQuarterMessage() {
        if (quarterMessageBag.length === 0) {
          shuffleQuarterMessages();
        }
        return quarterMessageBag.pop();
      }

      function showQuarterReminder(quarterKey) {
        const message = randomQuarterMessage();
        currentQuarterKey = quarterKey;

        quarterFlashOverlay.classList.remove("flashing");
        void quarterFlashOverlay.offsetWidth;
        quarterFlashOverlay.classList.add("flashing");

        setTimeout(() => {
          quarterFlashOverlay.classList.remove("flashing");
          // フラッシュ中にすでにこの回を消した扱いにしていない場合のみ表示。
          if (dismissedQuarterKey !== quarterKey) {
            quarterReminder.textContent = message;
            quarterReminder.classList.add("show");
            refreshDismissLayer();

          if (quarterReminderHideTimer) clearTimeout(quarterReminderHideTimer);

          quarterReminderHideTimer = setTimeout(() => {
            quarterReminder.classList.remove("show");
            quarterReminderHideTimer = null;
            refreshDismissLayer();

      function updateClockReminders(now) {
        if (currentMode !== "clock") {
          sedentaryAlert.classList.remove("show", "blinking");
          quarterReminder.classList.remove("show");
          refreshDismissLayer();
          return;
        }

        const minute = now.getMinutes();
        const second = now.getSeconds();

        if (minute >= 50) {
          currentSedentaryKey =
            `${now.getFullYear()}-${now.getMonth()}-${now.getDate()}-${now.getHours()}-50`;

          if (dismissedSedentaryKey !== currentSedentaryKey) {
            sedentaryAlert.classList.add("show");
            if (sedentaryAcknowledgedKey !== currentSedentaryKey) {
              sedentaryAlert.classList.add("blinking");
            } else {
              sedentaryAlert.classList.remove("blinking");
            }
          } else {
            sedentaryAlert.classList.remove("show", "blinking");
          }
        } else {
          sedentaryAlert.classList.remove("show", "blinking");
          currentSedentaryKey = "";
        }

        if ([0, 15, 30, 45].includes(minute) && second <= 1) {
          const quarterKey =
            `${now.getFullYear()}-${now.getMonth()}-${now.getDate()}-${now.getHours()}-${minute}`;

          currentQuarterKey = quarterKey;

          if (quarterKey !== lastQuarterKey) {
            lastQuarterKey = quarterKey;
            showQuarterReminder(quarterKey);
          }
        }

        refreshDismissLayer();

        if (minute === 0 && second <= 1) {
          const cuckooKey =
            `${now.getFullYear()}-${now.getMonth()}-${now.getDate()}-${now.getHours()}`;

          if (cuckooKey !== lastCuckooKey) {
            lastCuckooKey = cuckooKey;
            showCuckoo();
          }
        }
      }

      document.querySelectorAll(".timer-key").forEach(btn => {
        btn.addEventListener("click", () => {
          pushDigits(btn.dataset.key);
        });
      });

      document.querySelectorAll(".double-zero-key").forEach(btn => {
        btn.addEventListener("click", () => pushDigits("00"));
      });

      document.querySelectorAll(".clear-key").forEach(btn => {
        btn.addEventListener("click", clearInput);
      });

      document.querySelectorAll(".backspace-key").forEach(btn => {
        btn.addEventListener("click", backspaceInput);
      });

      // ----- Wake Lock -----
      const wakeStatus = document.getElementById("wake-status");
      let wakeLock = null;

      async function requestWakeLock() {
        if (!("wakeLock" in navigator)) {
          wakeStatus.textContent = "常時点灯：非対応";
          return;
        }

        try {
          wakeLock = await navigator.wakeLock.request("screen");
          wakeStatus.textContent = "常時点灯";

          wakeLock.addEventListener("release", () => {
            wakeStatus.textContent = "";
          });
        } catch (_) {
          wakeStatus.textContent = "タップで常時点灯";
        }
      }

      document.addEventListener("visibilitychange", () => {
        if (document.visibilityState === "visible") {
          requestWakeLock();

          if (timerRunning && endTimestamp) {
            remainingSeconds = Math.max(0, (endTimestamp - Date.now()) / 1000);

            if (remainingSeconds <= 0) finishTimer();
            else updateTimerDisplay();
          }
        }
      });

      document.addEventListener("pointerdown", () => {
        if (!wakeLock || wakeLock.released) {
          requestWakeLock();
        }
      }, { passive: true });

      // init
      applyBrightness();
      applyView();
      updateTimerDisplay();
      startClock();
      requestWakeLock();
    })();
  </script>
</body>
</html>
