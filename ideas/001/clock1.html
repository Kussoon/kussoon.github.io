<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
  <link rel="canonical" href="https://kussoon.com/ideas/001/clock1.html" />
  <meta name="description" content="大きなデジタル時計と、60本のカラーバーで残り時間を確認できるタイマーです。横・縦表示、全画面表示、画面の明るさ調整に対応しています。" />
  <meta name="theme-color" content="#000000" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="クセなし時計・タイマー" />
  <title>バータイマー付きデジタル時計｜クセなし版｜Kussoon</title>

  <style>
    :root {
      --safe-top: env(safe-area-inset-top);
      --safe-right: env(safe-area-inset-right);
      --safe-bottom: env(safe-area-inset-bottom);
      --safe-left: env(safe-area-inset-left);
      --main-opacity: 1;
      --sub-opacity: .76;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display",
        "Helvetica Neue", Arial, "Hiragino Sans", "Yu Gothic", sans-serif;
    }

    body {
      position: fixed;
      inset: 0;
      user-select: none;
      -webkit-user-select: none;
      touch-action: manipulation;
      background: #000;
    }

    body.level-0 {
      --main-opacity: 1;
      --sub-opacity: .76;
    }

    body.level-1 {
      --main-opacity: .45;
      --sub-opacity: .36;
    }

    body.level-2 {
      --main-opacity: .20;
      --sub-opacity: .16;
    }


    body.fullscreen #top-switches,
    body.fullscreen #menu-btn,
    body.fullscreen #menu,
    body.fullscreen #wake-status {
      display: none !important;
    }


    #fullscreen-close-btn {
      display: none;
      position: fixed;
      top: max(12px, calc(8px + var(--safe-top)));
      right: max(12px, calc(8px + var(--safe-right)));
      width: 48px;
      height: 48px;
      border: 1px solid rgba(255,255,255,.38);
      border-radius: 50%;
      background: rgba(24,24,24,.78);
      color: rgba(255,255,255,.92);
      font-size: 30px;
      font-weight: 300;
      line-height: 1;
      align-items: center;
      justify-content: center;
      z-index: 100;
      -webkit-tap-highlight-color: transparent;
    }

    body.fullscreen #fullscreen-close-btn {
      display: flex;
    }

    #fullscreen-close-btn:active {
      background: rgba(70,70,70,.92);
    }

    body.fullscreen #landscape-layout {
      padding:
        calc(6px + var(--safe-top))
        max(.8vw, calc(6px + var(--safe-right)))
        calc(6px + var(--safe-bottom))
        max(.8vw, calc(6px + var(--safe-left)));
    }

    body.fullscreen #landscape-time {
      font-size: min(23vw, 56dvh);
      line-height: .82;
      letter-spacing: -.06em;
      max-width: calc(100vw - 44px - var(--safe-left) - var(--safe-right));
      transform: scaleX(.96);
      transform-origin: center;
    }

    body.fullscreen #landscape-date {
      margin-top: 1.2vh;
      font-size: min(8.2vw, 14vh);
      line-height: 1;
    }

    body.fullscreen #landscape-year-remaining {
      margin-top: .8vh;
      font-size: min(3.55vw, 6.2vh);
      line-height: 1.08;
      gap: .55vh;
    }

    body.fullscreen #portrait-layout {
      padding:
        calc(10px + var(--safe-top))
        calc(10px + var(--safe-right))
        calc(14px + var(--safe-bottom))
        calc(10px + var(--safe-left));
    }

    body.fullscreen .portrait-time-part {
      font-size: min(52vw, 30dvh);
      line-height: .84;
    }

    body.fullscreen #portrait-date {
      font-size: min(11.6vw, 8vh);
      line-height: 1;
      padding-bottom: .1vh;
    }

    body.fullscreen #portrait-year-remaining {
      margin-top: .3vh;
      font-size: min(6.8vw, 4.7vh);
      line-height: 1.08;
      gap: .35vh;
      padding-bottom: .3vh;
    }

    body.fullscreen #landscape-timer-status,
    body.fullscreen #portrait-timer-status,
    body.fullscreen .keypad {
      display: none !important;
    }

    body.fullscreen #landscape-visual {
      min-height: 48vh;
      align-items: center;
      grid-template-columns: minmax(0, 1fr) minmax(270px, 34%);
      gap: 1.4vw;
    }

    body.fullscreen #landscape-bar-panel,
    body.fullscreen #landscape-digits-panel {
      height: min(42vh, 290px);
      min-height: 210px;
    }

    body.fullscreen #landscape-timer-display {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 118%;
      max-width: none;
      margin: 0;
      font-size: min(13.2vw, 27dvh);
      line-height: .82;
      text-align: center;
      transform: translate(-50%, -50%) scaleX(.82);
      transform-origin: center center;
      overflow: visible;
    }

    body.fullscreen #landscape-segment-bar {
      height: 94%;
    }

    body.fullscreen #portrait-visual {
      height: 78vh;
      align-items: stretch;
      grid-template-columns: minmax(126px, 38%) minmax(0, 1fr);
      gap: 18px;
    }

    body.fullscreen #portrait-segment-bar {
      width: 84%;
    }

    body.fullscreen #portrait-timer-display {
      font-size: min(30vw, 17dvh);
      line-height: .84;
      transform: scaleX(.78);
      transform-origin: center;
      overflow: visible;
    }

    body.fullscreen #portrait-bar-panel,
    body.fullscreen #portrait-digits-panel {
      padding-top: 16px;
      padding-bottom: 16px;
    }

    .hidden {
      display: none !important;
    }

    .no-fullscreen-exit {
      display: inline-block;
    }

    /* ---------- 共通上部切替 ---------- */

    #top-switches {
      position: fixed;
      top: max(12px, calc(8px + var(--safe-top)));
      left: max(12px, calc(8px + var(--safe-left)));
      right: max(12px, calc(8px + var(--safe-right)));
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      z-index: 30;
      pointer-events: none;
    }

    .switch-group {
      display: flex;
      gap: 8px;
      pointer-events: auto;
    }

    .switch-btn {
      border: 1px solid rgba(255,255,255,.28);
      border-radius: 12px;
      background: rgba(36,36,36,.92);
      color: #fff;
      min-width: 68px;
      padding: 9px 14px;
      font-size: 15px;
      font-weight: 650;
      box-shadow: 0 3px 12px rgba(0,0,0,.30);
    }

    .switch-btn.active {
      background: rgba(255,255,255,.20);
      border-color: rgba(255,255,255,.48);
    }

    /* ---------- メニュー ---------- */

    #menu-btn {
      position: fixed;
      right: max(16px, calc(12px + var(--safe-right)));
      bottom: max(16px, calc(12px + var(--safe-bottom)));
      width: 58px;
      height: 58px;
      border: 1px solid rgba(255,255,255,.42);
      border-radius: 15px;
      background: rgba(35,35,35,.94);
      color: rgba(255,255,255,.94);
      font-size: 28px;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 40;
    }

    #menu {
      position: fixed;
      right: max(16px, calc(12px + var(--safe-right)));
      bottom: max(84px, calc(80px + var(--safe-bottom)));
      width: 210px;
      padding: 12px;
      border: 1px solid rgba(255,255,255,.25);
      border-radius: 15px;
      background: rgba(24,24,24,.98);
      z-index: 39;
      display: none;
    }

    #menu.show {
      display: block;
    }

    .menu-title {
      font-size: 13px;
      color: rgba(255,255,255,.64);
      margin: 1px 3px 8px;
    }

    .menu-group {
      display: grid;
      gap: 8px;
    }

    .menu-group button {
      border: 1px solid rgba(255,255,255,.18);
      border-radius: 10px;
      background: rgba(255,255,255,.07);
      color: #fff;
      padding: 10px 12px;
      font-size: 15px;
      font-weight: 600;
    }

    .menu-group button.active {
      background: rgba(255,255,255,.22);
      border-color: rgba(255,255,255,.45);
    }

    .menu-info {
      margin-top: 12px;
      padding-top: 10px;
      border-top: 1px solid rgba(255,255,255,.16);
      display: grid;
      gap: 7px;
      font-size: 12px;
      line-height: 1.45;
    }

    .menu-info a {
      color: rgba(255,255,255,.82);
      text-decoration: none;
    }

    .menu-info a:focus-visible,
    .menu-info a:hover {
      color: #fff;
      text-decoration: underline;
    }

    .menu-copyright {
      color: rgba(255,255,255,.44);
      font-size: 10px;
      margin-top: 2px;
    }

    #wake-status {
      position: fixed;
      left: max(10px, calc(7px + var(--safe-left)));
      bottom: max(8px, calc(6px + var(--safe-bottom)));
      font-size: 10px;
      opacity: .18;
      pointer-events: none;
      z-index: 20;
    }

    /* ---------- 横レイアウト ---------- */

    #landscape-layout {
      position: fixed;
      inset: 0;
      padding:
        calc(64px + var(--safe-top))
        max(5vw, calc(24px + var(--safe-right)))
        calc(18px + var(--safe-bottom))
        max(5vw, calc(24px + var(--safe-left)));
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #landscape-clock {
      width: 100%;
      text-align: center;
    }

    #landscape-time {
      font-variant-numeric: tabular-nums;
      font-weight: 500;
      line-height: .84;
      letter-spacing: -.055em;
      white-space: nowrap;
      font-size: min(22.5vw, 52dvh);
      max-width: calc(100vw - 36px - var(--safe-left) - var(--safe-right));
      transform: scaleX(.97);
      transform-origin: center;
      opacity: var(--main-opacity);
    }

    #landscape-date {
      margin-top: 1.8vh;
      font-size: min(6.8vw, 12vh);
      line-height: 1;
      font-weight: 500;
      opacity: var(--sub-opacity);
    }


    #landscape-year-remaining {
      margin-top: .8vh;
      display: grid;
      gap: .55vh;
      justify-items: center;
      font-size: min(3.35vw, 5.8vh);
      line-height: 1.08;
      font-weight: 500;
      opacity: var(--sub-opacity);
    }

    #landscape-timer {
      width: 100%;
      max-width: 92vw;
      text-align: center;
    }

    #landscape-visual {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(200px, 26%);
      gap: 2.2vw;
      align-items: stretch;
    }

    .lcd-panel {
      border: 2px solid rgba(255,255,255,.17);
      border-radius: 18px;
      background: rgba(220,224,206,.09);
      box-shadow: inset 0 0 0 2px rgba(0,0,0,.5);
    }

    #landscape-bar-panel {
      height: min(31vh, 210px);
      min-height: 150px;
      display: flex;
      align-items: center;
      padding: 16px 20px;
    }

    #landscape-segment-bar {
      position: relative;
      width: 100%;
      height: 90%;
      display: grid;
      grid-template-columns: repeat(60, minmax(0, 1fr));
      gap: 2px;
      align-items: stretch;
    }

    .segment-h {
      align-self: stretch;
      height: 100%;
      border-radius: 2px;
      background: #333333;
      border: 1px solid #555555;
      transition: background .12s linear;
    }

    .segment-h.on {
      height: 100%;
      background: #fff3a6;
      border-color: #e7d76e;
      box-shadow: 0 0 4px rgba(255,243,166,.22);
    }

    .segment-h.zone-1.on {
      background: #ff9800;
      border-color: #ffb74d;
      box-shadow: 0 0 5px rgba(255,152,0,.30);
    }

    .segment-h.zone-2.on {
      background: #9be81b;
      border-color: #b9f35a;
      box-shadow: 0 0 5px rgba(155,232,27,.28);
    }

    .segment-h.zone-3.on {
      background: #19c45a;
      border-color: #4fe384;
      box-shadow: 0 0 5px rgba(25,196,90,.28);
    }

    .segment-h.zone-4.on {
      background: #1f7cff;
      border-color: #5ba2ff;
      box-shadow: 0 0 5px rgba(31,124,255,.28);
    }

    #landscape-digits-panel {
      position: relative;
      min-height: 150px;
      height: min(31vh, 210px);
      display: block;
      text-align: center;
      padding: 10px 8px;
      overflow: hidden;
    }

    #landscape-timer-display {
      max-width: 100%;
      overflow: visible;
      color: #f6f6f2;
      font-variant-numeric: tabular-nums;
      font-weight: 500;
      line-height: .84;
      letter-spacing: -.045em;
      white-space: nowrap;
      position: absolute;
      left: 50%;
      top: 50%;
      width: 116%;
      max-width: none;
      margin: 0;
      font-size: min(12.2vw, 24dvh);
      transform: translate(-50%, -50%) scaleX(.84);
      transform-origin: center center;
      text-align: center;
    }

    #landscape-timer-status {
      margin-top: 2vh;
      font-size: min(2.1vw, 4vh);
      opacity: var(--sub-opacity);
      min-height: 1.2em;
    }

    /* 刀：横レイアウトでは縦向き */
    #katana-h {
      position: absolute;
      top: -10%;
      left: 100%;
      width: 30px;
      height: 122%;
      transform: translateX(-50%);
      z-index: 8;
      pointer-events: none;
      transition: left .12s linear;
    }

    #katana-h .blade {
      position: absolute;
      left: 7px;
      top: 0;
      width: 12px;
      height: 74%;
      border-radius: 70% 30% 24% 76% / 12% 12% 88% 88%;
      background: linear-gradient(
        to right,
        #dfe7ee 0%,
        #ffffff 24%,
        #ffffff 48%,
        #eef3f7 72%,
        #cbd5de 100%
      );
      box-shadow:
        0 0 7px rgba(255,255,255,.95),
        0 0 15px rgba(235,245,255,.58);
      transform: skewX(-2deg);
      clip-path: polygon(
        42% 0%,
        88% 2%,
        100% 91%,
        82% 100%,
        28% 100%,
        8% 92%,
        18% 18%
      );
    }

    #katana-h .blade::before {
      content: "";
      position: absolute;
      top: -7px;
      left: 2px;
      width: 8px;
      height: 13px;
      background: #ffffff;
      border-radius: 70% 30% 18% 82%;
      transform: rotate(-10deg);
    }

    #katana-h .guard {
      position: absolute;
      left: 1px;
      top: 73%;
      width: 25px;
      height: 5px;
      border-radius: 3px;
      background: #ffffff;
    }

    #katana-h .handle {
      position: absolute;
      left: 8px;
      top: calc(73% + 5px);
      width: 11px;
      height: 23%;
      min-height: 25px;
      border: 2px solid #efefef;
      border-radius: 3px;
      background: repeating-linear-gradient(
        to bottom,
        #242424 0 5px,
        #bcbcbc 5px 7px
      );
    }

    /* ---------- 縦レイアウト ---------- */

    #portrait-layout {
      position: fixed;
      inset: 0;
      padding:
        calc(70px + var(--safe-top))
        calc(16px + var(--safe-right))
        calc(80px + var(--safe-bottom))
        calc(16px + var(--safe-left));
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #portrait-clock {
      width: 100%;
      height: 100%;
      display: grid;
      grid-template-rows: 1fr 1fr 1fr auto;
      align-items: center;
      justify-items: center;
      text-align: center;
    }

    .portrait-time-part {
      width: 100%;
      font-variant-numeric: tabular-nums;
      font-weight: 500;
      line-height: .88;
      letter-spacing: -.035em;
      font-size: min(48vw, 27dvh);
      opacity: var(--main-opacity);
    }

    #portrait-date {
      font-size: min(10vw, 6.8vh);
      line-height: 1;
      font-weight: 500;
      opacity: var(--sub-opacity);
      padding-bottom: .4vh;
    }


    #portrait-year-remaining {
      margin-top: .4vh;
      display: grid;
      gap: .35vh;
      justify-items: center;
      font-size: min(6.2vw, 4.2vh);
      line-height: 1.08;
      font-weight: 500;
      opacity: var(--sub-opacity);
      padding-bottom: .4vh;
    }

    #portrait-timer {
      width: 100%;
      height: 100%;
      display: grid;
      grid-template-rows: minmax(0, 1fr) auto auto auto;
      gap: 12px;
      justify-items: center;
      align-items: center;
    }

    #portrait-visual {
      width: 100%;
      height: 100%;
      display: grid;
      grid-template-columns: minmax(100px, 34%) minmax(0, 1fr);
      gap: 16px;
      align-items: stretch;
      min-height: 0;
    }

    #portrait-bar-panel {
      position: relative;
      min-height: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 18px 16px;
    }

    #portrait-segment-bar {
      position: relative;
      width: 80%;
      height: 100%;
      display: grid;
      grid-template-rows: repeat(60, minmax(0, 1fr));
      gap: 2px;
    }

    .segment-v {
      justify-self: stretch;
      width: 100%;
      border-radius: 2px;
      background: #333333;
      border: 1px solid #555555;
      transition: background .12s linear;
    }

    .segment-v.on {
      width: 100%;
      background: #fff3a6;
      border-color: #e7d76e;
      box-shadow: 0 0 4px rgba(255,243,166,.22);
    }

    .segment-v.zone-1.on {
      background: #ff9800;
      border-color: #ffb74d;
      box-shadow: 0 0 5px rgba(255,152,0,.30);
    }

    .segment-v.zone-2.on {
      background: #9be81b;
      border-color: #b9f35a;
      box-shadow: 0 0 5px rgba(155,232,27,.28);
    }

    .segment-v.zone-3.on {
      background: #19c45a;
      border-color: #4fe384;
      box-shadow: 0 0 5px rgba(25,196,90,.28);
    }

    .segment-v.zone-4.on {
      background: #1f7cff;
      border-color: #5ba2ff;
      box-shadow: 0 0 5px rgba(31,124,255,.28);
    }

    #portrait-digits-panel {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 0;
      padding: 12px;
    }

    #portrait-timer-display {
      max-width: 100%;
      overflow: visible;
      color: #f6f6f2;
      font-variant-numeric: tabular-nums;
      font-weight: 500;
      line-height: .95;
      letter-spacing: -.04em;
      white-space: nowrap;
      font-size: min(27vw, 15dvh);
      line-height: .84;
      transform: scaleX(.80);
      transform-origin: center;
    }

    #portrait-timer-status {
      font-size: min(4vw, 2.5vh);
      opacity: var(--sub-opacity);
      min-height: 1.2em;
    }

    /* 刀：縦レイアウトでは横向き */
    #katana-v {
      position: absolute;
      left: -22%;
      bottom: 100%;
      width: 146%;
      height: 30px;
      transform: translateY(50%);
      z-index: 8;
      pointer-events: none;
      transition: bottom .12s linear;
    }

    #katana-v .blade {
      position: absolute;
      left: 0;
      top: 7px;
      width: 74%;
      height: 13px;
      border-radius: 12% 88% 76% 24% / 65% 55% 45% 35%;
      background: linear-gradient(
        to bottom,
        #dfe7ee 0%,
        #ffffff 24%,
        #ffffff 48%,
        #eef3f7 72%,
        #cbd5de 100%
      );
      box-shadow:
        0 0 7px rgba(255,255,255,.95),
        0 0 15px rgba(235,245,255,.58);
      transform: skewY(-2deg);
      clip-path: polygon(
        0% 38%,
        8% 12%,
        88% 0%,
        100% 18%,
        100% 72%,
        90% 96%,
        10% 88%
      );
    }

    #katana-v .blade::before {
      content: "";
      position: absolute;
      left: -8px;
      top: 2px;
      width: 13px;
      height: 8px;
      background: #ffffff;
      border-radius: 65% 35% 28% 72%;
      transform: rotate(-8deg);
    }

    #katana-v .guard {
      position: absolute;
      left: 73%;
      top: 1px;
      width: 5px;
      height: 25px;
      border-radius: 3px;
      background: #ffffff;
    }

    #katana-v .handle {
      position: absolute;
      left: calc(73% + 5px);
      top: 8px;
      width: 23%;
      min-width: 26px;
      height: 11px;
      border: 2px solid #efefef;
      border-radius: 3px;
      background: repeating-linear-gradient(
        to right,
        #242424 0 5px,
        #bcbcbc 5px 7px
      );
    }

    /* ---------- タイマー操作 ---------- */

    .timer-controls {
      display: flex;
      justify-content: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    .control-btn,
    .key-btn {
      border: 1px solid rgba(255,255,255,.30);
      background: rgba(255,255,255,.07);
      color: #fff;
      border-radius: 11px;
      font-weight: 600;
    }

    .control-btn {
      min-width: 100px;
      padding: 10px 20px;
      font-size: 16px;
    }

    body.fullscreen .control-btn {
      min-width: 112px;
      padding: 12px 24px;
      font-size: 18px;
    }

    .keypad {
      width: min(1180px, 94vw);
      display: grid;
      gap: 9px;
    }

    .digit-row {
      display: grid;
      grid-template-columns: repeat(10, minmax(0, 1fr));
      gap: 5px;

      <div class="keypad">

          <button class="key-btn timer-key" type="button" data-key="1">1</button>

          <button class="key-btn timer-key" type="button" data-key="3">3</button>
          <button class="key-btn timer-key" type="button" data-key="4">4</button>
          <button class="key-btn timer-key" type="button" data-key="5">5</button>
          <button class="key-btn timer-key" type="button" data-key="6">6</button>
          <button class="key-btn timer-key" type="button" data-key="7">7</button>
          <button class="key-btn timer-key" type="button" data-key="8">8</button>
          <button class="key-btn timer-key" type="button" data-key="9">9</button>
          <button class="key-btn timer-key" type="button" data-key="0">0</button>

        <div class="key-action-row">
          <button class="key-btn small double-zero-key" type="button">00</button>

  <script defer src="/common/footer-links.js"></script>
<script>
(()=>{
"use strict";
const $=id=>document.getElementById(id),pad=x=>String(x).padStart(2,"0");
const weekdays=["日","月","火","水","木","金","土"];
const key="kussoon_clock1_layout_v2";
let pref={};try{pref=JSON.parse(localStorage.getItem(key)||"{}")}catch(e){}
let mode=new URLSearchParams(location.search).get("mode")==="timer"?"timer":"clock";
let layout=pref.layout==="portrait"?"portrait":"landscape";
let level=[0,1,2].includes(pref.level)?pref.level:0;
function save(){try{localStorage.setItem(key,JSON.stringify({layout,level}))}catch(e){}}
function view(){
 const land=layout==="landscape",clock=mode==="clock";
 ["landscape-layout","portrait-layout","landscape-clock","landscape-timer","portrait-clock","portrait-timer"].forEach((id,i)=>{
  $(id).classList.toggle("hidden",![land,!land,land&&clock,land&&!clock,!land&&clock,!land&&!clock][i]);
 });
 ["clock-mode-btn","timer-mode-btn","landscape-btn","portrait-btn"].forEach((id,i)=>$(id).classList.toggle("active",[clock,!clock,land,!land][i]));
 document.body.classList.toggle("timer-mode",!clock);
 try{const u=new URL(location.href);u.searchParams.set("mode",mode);history.replaceState(null,"",u)}catch(e){}
 save();
}
$("clock-mode-btn").onclick=()=>{mode="clock";view()};
$("timer-mode-btn").onclick=()=>{mode="timer";view()};
$("landscape-btn").onclick=()=>{layout="landscape";view()};
$("portrait-btn").onclick=()=>{layout="portrait";view()};
let full=false;
function fullView(v){full=v;document.body.classList.toggle("fullscreen",v);$("menu").classList.remove("show")}
$("fullscreen-btn").onclick=()=>fullView(!full);
$("fullscreen-close-btn").onclick=()=>fullView(false);
for(const id of ["landscape-layout","portrait-layout"])$(id).addEventListener("click",e=>{if(full&&!e.target.closest("button,.lcd-panel,.no-fullscreen-exit"))fullView(false)});
$("menu-btn").onclick=e=>{e.stopPropagation();$("menu").classList.toggle("show")};
document.addEventListener("click",e=>{if(!$("menu").contains(e.target)&&e.target!==$("menu-btn"))$("menu").classList.remove("show")});
function bright(){
 document.body.classList.remove("level-0","level-1","level-2");document.body.classList.add("level-"+level);
 document.querySelectorAll("[data-level]").forEach(b=>b.classList.toggle("active",Number(b.dataset.level)===level));save();
}
document.querySelectorAll("[data-level]").forEach(b=>b.onclick=()=>{level=Number(b.dataset.level);bright();$("menu").classList.remove("show")});
function clock(){
 const d=new Date(),y=d.getFullYear(),time=[pad(d.getHours()),pad(d.getMinutes()),pad(d.getSeconds())];
 const date=(d.getMonth()+1)+"月"+d.getDate()+"日（"+weekdays[d.getDay()]+"）";
 const era=y+"年・"+(d>=new Date(2019,4,1)?"令和"+(y===2019?"元":y-2018)+"年":"令和開始前");
 $("landscape-time").querySelector("span").textContent=time.join(":");
 $("landscape-date").querySelector("span").textContent=date;
 $("landscape-era-line").textContent=era;
 for(let i=0;i<3;i++)$(["portrait-hour","portrait-minute","portrait-second"][i]).querySelector("span").textContent=time[i];
 $("portrait-date").querySelector("span").textContent=date;$("portrait-era-line").textContent=era;
}
const h=[],v=[];
for(let i=0;i<60;i++){
 const z=i<15?1:i<30?2:i<45?3:4;
 for(const [id,cls,arr] of [["landscape-segment-bar","segment-h",h],["portrait-segment-bar","segment-v",v]]){
  const bar=document.createElement("span");bar.className=cls+" zone-"+z;$(id).appendChild(bar);arr.push(bar);
 }
}
let digits="0500",selected=300,left=300,running=false,ended=false,edited=false,deadline=0,ticker=null;
const parse=d=>Number(d.slice(2))<60?Number(d.slice(0,2))*60+Number(d.slice(2)):-1;
const format=s=>{s=Math.max(0,Math.ceil(s));return pad(Math.floor(s/60))+":"+pad(s%60)};
function render(){
 const count=selected>0?Math.ceil(60*Math.max(0,left)/selected):0;
 for(let i=0;i<60;i++){h[i].classList.toggle("on",i<count);v[i].classList.toggle("on",i<count)}
 for(const side of ["landscape","portrait"]){
  $(side+"-timer-display").textContent=selected<0&&!running?digits.slice(0,2)+":"+digits.slice(2):format(left);
  $(side+"-timer-status").textContent=selected<0?"秒は59以下にしてください":ended?"終了":running?"計測中":left>0&&left<selected?"一時停止中":"入力時間";
  $(side+"-start-btn").textContent=running?"一時停止":left>0&&left<selected?"再開":"スタート";
  $(side+"-start-btn").disabled=selected<=0&&!running;
 }
 document.querySelectorAll(".timer-key,.double-zero-key,.clear-key,.backspace-key").forEach(b=>b.disabled=running);
}
function recalc(){if(running)return;ended=false;selected=parse(digits);left=Math.max(0,selected);render()}
function input(str){if(running)return;if(!edited){digits="0000";edited=true}digits=(digits+str).slice(-4);recalc()}
function back(){if(running)return;if(!edited){digits="0000";edited=true}else digits="0"+digits.slice(0,-1);recalc()}
document.querySelectorAll(".timer-key").forEach(b=>b.onclick=()=>input(b.dataset.key));
document.querySelectorAll(".double-zero-key").forEach(b=>b.onclick=()=>input("00"));
document.querySelectorAll(".clear-key").forEach(b=>b.onclick=()=>{digits="0000";edited=true;recalc()});
document.querySelectorAll(".backspace-key").forEach(b=>b.onclick=back);
function stop(){if(ticker!==null){clearInterval(ticker);ticker=null}}
function progress(){if(!running)return;left=Math.max(0,Math.ceil((deadline-Date.now())/1000));if(!left){running=false;ended=true;stop()}render()}
function toggle(){
 if(running){progress();running=false;stop();render();return}
 if(selected<=0)return;if(left<=0)left=selected;
 running=true;ended=false;edited=false;deadline=Date.now()+left*1000;stop();ticker=setInterval(progress,150);render();
}
function reset(){stop();running=false;ended=false;edited=false;selected=parse(digits);left=Math.max(0,selected);render()}
for(const side of ["landscape","portrait"]){$(side+"-start-btn").onclick=toggle;$(side+"-reset-btn").onclick=reset}
window.addEventListener("keydown",e=>{
 if(mode!=="timer"||e.altKey||e.ctrlKey||e.metaKey||e.target.closest("button,input,textarea"))return;
 if(/^[0-9]$/.test(e.key)){input(e.key);e.preventDefault()}
 else if(e.key==="Backspace"){back();e.preventDefault()}
});
document.addEventListener("visibilitychange",()=>{clock();progress()});
clock();setInterval(clock,250);bright();view();render();
})();
</script>
</body>
</html>
