<html lang="ja">
<head>
<meta charset="utf-8">

<title>バータイマー付きデジタル時計｜クセなし版｜Kussoon</title>
<style>
:root{color-scheme:dark;--bg:#0d141c;--panel:#17222e;--panel2:#202d3a;--ink:#f7fafc;--muted:#a9bbca;--line:#344657;--accent:#6dd1ee;--btn:#263745;--focus:#ffce73}
*{box-sizing:border-box}
html{height:100%;scroll-behavior:smooth}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif;line-height:1.45}
body[data-dim="1"]{--bg:#080d12;--panel:#111920;--panel2:#17202a;--ink:#dce6ec;--muted:#8294a1;--line:#293440;--accent:#77bbce;--btn:#1c2833}
body[data-dim="2"]{--bg:#030507;--panel:#080b0e;--panel2:#0d1115;--ink:#a9b1b8;--muted:#737d86;--line:#192027;--accent:#77949d;--btn:#10171c}
button,a{touch-action:manipulation}
button{font:inherit;cursor:pointer}
button:focus-visible,a:focus-visible{outline:3px solid var(--focus);outline-offset:3px}
button:disabled{opacity:.45;cursor:not-allowed}
[hidden]{display:none!important}
.shell{max-width:1050px;margin:auto;padding:clamp(12px,2.4vw,24px) clamp(12px,3vw,26px) 26px}
.top{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-bottom:18px}
.brand{display:flex;flex-direction:column;gap:2px}
.brand strong{font-size:clamp(17px,3vw,24px);letter-spacing:.02em}
.brand small{font-size:12px;color:var(--muted)}
.top-controls,.layout-controls{display:flex;gap:7px;align-items:center;flex-wrap:wrap}
.button{border:1px solid var(--line);color:var(--ink);background:var(--btn);border-radius:11px;padding:9px 13px;font-weight:700;min-height:42px}
.button:hover{border-color:var(--accent)}
.button.active{color:#091820;background:var(--accent);border-color:var(--accent)}
.modebar{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.modebar button{font-size:clamp(16px,2.6vw,20px);padding:13px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:22px;padding:clamp(18px,4vw,34px);box-shadow:0 8px 34px #0002}
.clock-face{min-height:clamp(280px,45vh,530px);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:24px;text-align:center}
.time{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-variant-numeric:tabular-nums;font-weight:700;letter-spacing:-.045em;white-space:nowrap;line-height:1.02;font-size:clamp(44px,10.1vw,110px)}
.clock-meta{display:grid;gap:8px}
.date{font-weight:650;font-size:clamp(20px,4.3vw,36px)}
.era{font-size:clamp(18px,3.1vw,27px);color:var(--muted)}
body[data-layout="horizontal"] .clock-face{flex-direction:row;text-align:left;gap:clamp(14px,3vw,32px)}
body[data-layout="horizontal"] .clock-meta{border-left:1px solid var(--line);padding-left:clamp(12px,3vw,28px)}
body[data-layout="horizontal"] .clock-face .time{font-size:clamp(41px,7.2vw,90px)}
.timer-shell{max-width:890px;margin:auto}
.timer-display{text-align:center;font-size:clamp(62px,13vw,125px);font-weight:750;font-variant-numeric:tabular-nums;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;letter-spacing:-.05em;line-height:1.1;margin:3px 0 14px}
.timer-status{min-height:1.6em;color:var(--muted);font-size:15px;text-align:center}
.bars{display:grid;grid-template-columns:repeat(60,minmax(0,1fr));gap:clamp(1px,.4vw,4px);height:clamp(52px,10vw,80px);margin:16px 0 18px;align-items:stretch}
.segment{border-radius:3px;min-width:0;opacity:.16;transition:opacity .16s linear;box-shadow:inset 0 -4px 0 #0002}
.segment.on{opacity:1}
.timer-actions{display:grid;grid-template-columns:1.5fr 1fr;gap:9px;margin-top:16px}
.timer-actions .button{font-size:17px;min-height:49px}
.timer-actions .primary{color:#08181e;background:var(--accent);border-color:var(--accent)}
.keypad{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:7px;max-width:450px;margin:16px auto 0}
.key{background:var(--panel2);border:1px solid var(--line);border-radius:12px;color:var(--ink);font-weight:700;font-size:clamp(18px,3vw,25px);padding:11px;min-height:48px}
.key:active{background:var(--btn)}
.key.special{font-size:16px}
.tip{font-size:12px;color:var(--muted);margin:16px 0 0;text-align:center}
footer{max-width:1050px;padding:8px 20px 32px;margin:auto;font-size:12px;color:var(--muted);text-align:center}
footer nav{display:flex;justify-content:center;flex-wrap:wrap;gap:10px 15px;margin-bottom:12px}
footer a{color:var(--muted);text-underline-offset:3px}
.focus-exit{position:fixed;right:calc(12px + env(safe-area-inset-right,0px));top:calc(12px + env(safe-area-inset-top,0px));z-index:10;background:#313c48e6;border:1px solid #607180;color:#fff;border-radius:999px;padding:10px 15px;font-size:15px}
body.focus-mode{overflow:auto}
body.focus-mode .top,body.focus-mode .modebar,body.focus-mode footer{display:none}
body.focus-mode .shell{max-width:none;margin:0;padding:calc(10px + env(safe-area-inset-top,0px)) 12px calc(10px + env(safe-area-inset-bottom,0px))}
body.focus-mode .panel{min-height:calc(100dvh - 22px);display:flex;align-items:center;justify-content:center;border:0;padding:36px 12px 18px;border-radius:0;background:var(--bg);box-shadow:none}
body.focus-mode .clock-face{min-height:70dvh}
body.focus-mode .timer-shell{width:min(100%,950px)}
body.focus-mode .time{font-size:clamp(47px,11vw,155px)}
body.focus-mode .keypad{max-width:340px}
body.focus-mode .key{min-height:44px;padding:7px}
@media(max-width:700px){body[data-layout="horizontal"] .clock-face{flex-direction:column;text-align:center}body[data-layout="horizontal"] .clock-meta{border-left:0;padding:0}body[data-layout="horizontal"] .clock-face .time{font-size:clamp(44px,10vw,68px)}.clock-face{min-height:360px}.top{align-items:flex-start}.button{padding:9px 10px}}
@media(max-width:390px){.time{font-size:clamp(39px,10vw,46px)}.panel{padding:14px}.button{font-size:13px}.clock-face{min-height:325px}}
@media(prefers-reduced-motion:reduce){.segment{transition:none}}
</style>

<body data-layout="vertical" data-dim="0">
<div class="shell">
<header class="top">
  <div class="brand"><strong>デジタル時計・バータイマー</strong><small>クセなし版｜時刻と残り時間だけを、すっきり表示</small></div>
  <div class="top-controls" aria-label="表示設定">
    <button type="button" class="button" id="layoutButton">横表示に切替</button>
    <button type="button" class="button" id="dimButton">明るさ：通常</button>
    <button type="button" class="button" id="focusButton">全画面</button>
  </div>
</header>
<nav class="modebar" aria-label="時計とタイマーの切替">
  <button type="button" class="button active" id="clockButton" aria-pressed="true" data-umami-event="ideas-001-clock1-clock">時計</button>
  <button type="button" class="button" id="timerButton" aria-pressed="false" data-umami-event="ideas-001-clock1-timer">タイマー</button>
</nav>
<main>
 <section id="clockPanel" class="panel" aria-label="デジタル時計">
  <div class="clock-face">
    <div class="time" id="clockTime" aria-live="off">--:--:--</div>
    <div class="clock-meta">
      <div class="date" id="dateText">----年--月--日（-）</div>
      <div class="era" id="eraText">西暦 ----年 · 令和 -年</div>
    </div>
  </div>
 </section>
 <section id="timerPanel" class="panel" aria-label="60本バータイマー" hidden>
  <div class="timer-shell">
    <div class="timer-display" id="timerDisplay" role="timer" aria-live="off">05:00</div>
    <div id="timerStatus" class="timer-status" role="status">分・秒を入力してスタート</div>
    <div id="timerBars" class="bars" role="progressbar" aria-label="タイマー残り時間" aria-valuemin="0" aria-valuemax="300" aria-valuenow="300"></div>
    <div class="timer-actions">
      <button type="button" class="button primary" id="startButton" data-umami-event="ideas-001-clock1-start">スタート</button>
      <button type="button" class="button" id="resetButton" data-umami-event="ideas-001-clock1-reset">リセット</button>
    </div>
    <div class="keypad" id="keypad" aria-label="分秒入力">
      <button type="button" class="key" data-digit="1">1</button><button type="button" class="key" data-digit="2">2</button><button type="button" class="key" data-digit="3">3</button>
      <button type="button" class="key" data-digit="4">4</button><button type="button" class="key" data-digit="5">5</button><button type="button" class="key" data-digit="6">6</button>
      <button type="button" class="key" data-digit="7">7</button><button type="button" class="key" data-digit="8">8</button><button type="button" class="key" data-digit="9">9</button>
      <button type="button" class="key special" id="clearButton">消去</button><button type="button" class="key" data-digit="0">0</button><button type="button" class="key special" id="backButton">←</button>
    </div>
    <p class="tip">テンキーは左から順に分・秒を入力します。終了時の点滅や通知音はありません。</p>
  </div>
 </section>
</main>
</div>
<button type="button" class="focus-exit" id="focusExit" hidden>× 全画面を終了</button>

<script>
(function(){
"use strict";
const $=id=>document.getElementById(id);
const prefKey="kussoon_clock1_preferences_v1";
let preferences={layout:"vertical",dim:0};
try{const saved=JSON.parse(localStorage.getItem(prefKey)||"{}");if(saved.layout==="horizontal"||saved.layout==="vertical")preferences.layout=saved.layout;if([0,1,2].includes(saved.dim))preferences.dim=saved.dim;}catch(e){}
const days=["日","月","火","水","木","金","土"];
const two=n=>String(n).padStart(2,"0");
const clockTime=$("clockTime"),dateText=$("dateText"),eraText=$("eraText");
function tickClock(){
 const now=new Date(),year=now.getFullYear();
 clockTime.textContent=two(now.getHours())+":"+two(now.getMinutes())+":"+two(now.getSeconds());
 dateText.textContent=year+"年"+(now.getMonth()+1)+"月"+now.getDate()+"日（"+days[now.getDay()]+"）";
 const reiwa=year-2018;
 const inReiwa=now>=new Date(2019,4,1);
 eraText.textContent="西暦 "+year+"年 · "+(inReiwa?"令和"+(reiwa===1?"元":reiwa)+"年":"令和開始前");
}
tickClock();
setInterval(tickClock,250);
let mode=(new URLSearchParams(location.search).get("mode")==="timer")?"timer":"clock";
function setMode(next){
 mode=next;
 $("clockPanel").hidden=next!=="clock";$("timerPanel").hidden=next!=="timer";
 $("clockButton").classList.toggle("active",next==="clock");$("timerButton").classList.toggle("active",next==="timer");
 $("clockButton").setAttribute("aria-pressed",String(next==="clock"));$("timerButton").setAttribute("aria-pressed",String(next==="timer"));
 try{const url=new URL(location.href);url.searchParams.set("mode",next);history.replaceState(null,"",url);}catch(e){}
}
$("clockButton").addEventListener("click",()=>setMode("clock"));
$("timerButton").addEventListener("click",()=>setMode("timer"));
function storePref(){try{localStorage.setItem(prefKey,JSON.stringify(preferences));}catch(e){}}
function paintPrefs(){
 document.body.dataset.layout=preferences.layout;document.body.dataset.dim=String(preferences.dim);
 $("layoutButton").textContent=preferences.layout==="vertical"?"横表示に切替":"縦表示に切替";
 $("dimButton").textContent="明るさ："+["通常","暗い","超暗い"][preferences.dim];
}
$("layoutButton").addEventListener("click",()=>{preferences.layout=preferences.layout==="vertical"?"horizontal":"vertical";paintPrefs();storePref();});
$("dimButton").addEventListener("click",()=>{preferences.dim=(preferences.dim+1)%3;paintPrefs();storePref();});
paintPrefs();
let focus=false,awake=null;
async function requestWake(){
 if(!("wakeLock" in navigator)||document.visibilityState!=="visible"||awake)return;
 try{awake=await navigator.wakeLock.request("screen");awake.addEventListener("release",()=>awake=null);}catch(e){}
}
async function releaseWake(){if(awake){try{await awake.release();}catch(e){}awake=null;}}
function applyFocus(v){
 focus=v;document.body.classList.toggle("focus-mode",v);$("focusExit").hidden=!v;
 $("focusButton").textContent=v?"全画面を終了":"全画面";
 if(v){requestWake();if(document.documentElement.requestFullscreen){document.documentElement.requestFullscreen().catch(()=>{});}}
 else{if(document.fullscreenElement)document.exitFullscreen().catch(()=>{});if(!running)releaseWake();}
}
$("focusButton").addEventListener("click",()=>applyFocus(!focus));
$("focusExit").addEventListener("click",()=>applyFocus(false));
document.addEventListener("fullscreenchange",()=>{if(!document.fullscreenElement&&focus){focus=false;document.body.classList.remove("focus-mode");$("focusExit").hidden=true;$("focusButton").textContent="全画面";}});
document.addEventListener("visibilitychange",()=>{tickClock();if(document.visibilityState==="visible"&&(focus||running))requestWake();});
const bars=$("timerBars"),barEls=[];
for(let i=0;i<60;i++){
 const el=document.createElement("span");
 el.className="segment";
 el.style.backgroundColor=i<15?"#ed9b49":i<30?"#a8c952":i<45?"#58b99b":"#5d9fe6";
 bars.appendChild(el);barEls.push(el);
}
let digits="0500",selected=300,remaining=300,deadline=null,running=false,ticker=null,ended=false,editStarted=false;
function secondsFromDigits(s){const n=s.padStart(4,"0");const m=Number(n.slice(0,2)),sec=Number(n.slice(2,4));return sec<=59?m*60+sec:-1;}
function format(sec){const s=Math.max(0,Math.ceil(sec));return two(Math.floor(s/60))+":"+two(s%60);}
function clearTicker(){if(ticker!==null){clearInterval(ticker);ticker=null;}}
function renderTimer(){
 $("timerDisplay").textContent=(selected<0&&!running)?digits.slice(0,2)+":"+digits.slice(2):format(remaining);
 const fraction=selected>0?Math.max(0,Math.min(1,remaining/selected)):0;
 const onCount=Math.ceil(fraction*60);
 barEls.forEach((bar,i)=>bar.classList.toggle("on",i<onCount));
 bars.setAttribute("aria-valuemax",String(Math.max(0,selected)));
 bars.setAttribute("aria-valuenow",String(Math.max(0,Math.ceil(remaining))));
 bars.setAttribute("aria-valuetext",format(remaining)+" 残り");
 $("startButton").disabled=(selected<=0&&!running);
 $("startButton").textContent=running?"一時停止":(remaining<selected&&remaining>0?"再開":"スタート");
 $("timerStatus").textContent=selected<0?"秒は59以下にしてください":ended?"終了":running?"計測中":remaining<selected&&remaining>0?"一時停止中":"分・秒を入力してスタート";
 document.querySelectorAll(".key").forEach(el=>el.disabled=running);
}
function recalcInput(){
 if(running)return;ended=false;selected=secondsFromDigits(digits);remaining=Math.max(0,selected);
 renderTimer();
}
function inputDigit(value){if(running)return;if(!editStarted){digits="0000";editStarted=true;}digits=(digits+value).slice(-4);recalcInput();}
$("keypad").addEventListener("click",e=>{
 const button=e.target.closest("button");if(!button||button.disabled)return;
 if(button.dataset.digit!==undefined)inputDigit(button.dataset.digit);
 else if(button.id==="clearButton"){digits="0000";editStarted=true;recalcInput();}
 else if(button.id==="backButton"){if(!editStarted){digits="0000";editStarted=true;}else digits=("0"+digits.slice(0,-1));recalcInput();}
});
function finish(){
 clearTicker();running=false;deadline=null;remaining=0;ended=true;renderTimer();if(!focus)releaseWake();
}
function updateCountdown(){
 if(!running||deadline===null)return;
 remaining=Math.max(0,Math.ceil((deadline-Date.now())/1000));
 if(remaining<=0)finish();else renderTimer();
}
function toggleTimer(){
 if(running){
  updateCountdown();running=false;deadline=null;clearTicker();renderTimer();if(!focus)releaseWake();return;
 }
 if(selected<=0)return;
 if(remaining<=0)remaining=selected;
 ended=false;running=true;editStarted=false;deadline=Date.now()+remaining*1000;
 clearTicker();ticker=setInterval(updateCountdown,150);requestWake();renderTimer();
}
function resetTimer(){
 running=false;deadline=null;ended=false;editStarted=false;clearTicker();selected=secondsFromDigits(digits);remaining=Math.max(0,selected);
 renderTimer();if(!focus)releaseWake();
}
$("startButton").addEventListener("click",toggleTimer);
$("resetButton").addEventListener("click",resetTimer);
window.addEventListener("keydown",e=>{
 if(mode!=="timer"||e.altKey||e.ctrlKey||e.metaKey||document.activeElement?.matches("button"))return;
 if(/^[0-9]$/.test(e.key)){inputDigit(e.key);e.preventDefault();}
 else if(e.key==="Backspace"){if(!editStarted){digits="0000";editStarted=true;}else digits="0"+digits.slice(0,-1);recalcInput();e.preventDefault();}
});
setMode(mode);renderTimer();
})();
</script>
</body>
