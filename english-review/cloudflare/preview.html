<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>語学復習アプリ Cloudflare検証版</title><style>body{font:16px system-ui;max-width:680px;margin:auto;padding:16px}button,input,select{font:inherit;padding:10px;margin:4px}section,details{border:1px solid #aaa;border-radius:8px;padding:12px;margin:12px 0}#question{font-size:1.5rem}#answer{white-space:pre-wrap}button{cursor:pointer}</style></head><body><h1>語学復習アプリ</h1><p>Cloudflare検証版・スピード・回転数重視！</p><p id="status" role="status">認証確認中</p><button id="sync" disabled>同期</button><section><select id="lang"><option value="en">英語</option><option value="fr">フランス語</option></select><button id="start" disabled>復習開始</button><p id="progress"></p><p id="question"></p><button id="reveal" disabled>答えを見る</button><p id="answer"></p><button id="correct" disabled>正解</button><button id="wrong" disabled>不正解</button><button id="stop" disabled>終了</button></section><details><summary>移行用管理機能</summary><input type="file" id="file" accept=".json"><button id="import" disabled>検証・取り込み</button><p id="migration" role="status"></p></details><script type="module">
import {openLocal,createSync} from "./local-sync.mjs";
import {buildImportPlan} from "./import-plan.mjs";
const $=id=>document.getElementById(id);
let local,sync,account,queue=[],index=0,session,busy=false,ready=false,importing=false;
async function api(path,body){const r=await fetch(path,{credentials:"same-origin",cache:"no-store",redirect:"error",...(body===undefined?{}:{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)})});if(!r.ok)throw Error("HTTP "+r.status);return r.json();}
async function refresh(){if(!sync||importing)return;try{const result=await sync();$("status").textContent="同期済み・未送信 "+result.pending+"件";ready=true;$("start").disabled=!!session;}catch(e){$("status").textContent="同期失敗："+e.message+"（端末内記録は保持）";}}
function render(){const q=queue[index];$("progress").textContent=session?(index+1)+" / "+queue.length:"";$("question").textContent=q?.q??"";$("answer").textContent="";$("reveal").disabled=!q;$("correct").disabled=true;$("wrong").disabled=true;$("stop").disabled=!session;$("start").disabled=!ready||!!session||importing;}
$("start").onclick=async()=>{if(session||!ready||busy||importing)return;busy=true;try{queue=(await local.expressions()).filter(q=>(q.language??"en")===$("lang").value);if(!queue.length){$("status").textContent="教材がありません";return;}index=0;session=crypto.randomUUID();render();}finally{busy=false;}};
$("reveal").onclick=()=>{const q=queue[index];if(!q||busy)return;$("answer").textContent=q.answer+(q.why?"\n"+q.why:"");$("correct").disabled=false;$("wrong").disabled=false;};
async function grade(rating){if(busy||!session||!queue[index])return;busy=true;$("correct").disabled=$("wrong").disabled=$("stop").disabled=true;try{await local.grade(queue[index].id,rating,session);index++;if(index>=queue.length){session=null;queue=[];index=0;}$("status").textContent="端末に保存しました";render();}catch(e){$("status").textContent="保存失敗："+e.message;$("correct").disabled=$("wrong").disabled=$("stop").disabled=false;}finally{busy=false;}}
$("correct").onclick=()=>grade("correct");$("wrong").onclick=()=>grade("wrong");$("stop").onclick=()=>{if(busy)return;session=null;queue=[];index=0;render();void refresh();};
$("sync").onclick=refresh;
$("import").onclick=async()=>{if(importing||session||busy||!$("file").files[0])return;importing=true;$("import").disabled=$("start").disabled=true;try{const plan=await buildImportPlan(JSON.parse(await $("file").files[0].text()));if(!confirm("教材 "+plan.counts.expressions+"件を初回移行しますか？"))return;const {state}=await api("/api/import/status");if(state&&state.archive_id!==plan.archiveId)throw Error("別の移行が存在します");for(const batch of plan.batches){if(batch.index<(state?.next_batch??0))continue;$("migration").textContent=(batch.index+1)+" / "+plan.batches.length;await api("/api/import/batch",{archiveId:plan.archiveId,...batch});}await api("/api/import/finish",{archiveId:plan.archiveId,batchCount:plan.batches.length,counts:plan.counts});$("migration").textContent="移行件数照合完了";}catch(e){$("migration").textContent="移行停止："+e.message;}finally{importing=false;$("import").disabled=false;await refresh();}};
try{account=(await api("/api/me")).id;local=await openLocal(account);sync=createSync(local,account);$("sync").disabled=$("import").disabled=false;await refresh();setInterval(()=>{if(document.visibilityState==="visible")void refresh();},30000);window.addEventListener("online",refresh);}catch(e){$("status").textContent="開始できません："+e.message;}
</script></body></html>
