name = "kussoon-review-preview"
main = "worker.mjs"
compatibility_date = "2026-11-01"
workers_dev = false
preview_urls = false
[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true
[[d1_databases]]
binding = "DB"
database_name = "kussoon-review-preview"
database_id = "REPLACE_WITH_D1_ID"
migrations_dir = "migrations"
[vars]
TEAM_DOMAIN = "https://REPLACE.cloudflareaccess.com"
POLICY_AUD = "REPLACE"
